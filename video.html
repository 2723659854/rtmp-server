<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
    <title>FLV直播播放器</title>
    <script type="text/javascript" charset="utf-8" src="/aliplayer-min.js"></script>
    <link rel="stylesheet" href="/aliplayer-min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1430 100%);
        }

        /* 主容器 */
        .player-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(20, 25, 45, 0.9);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(64, 128, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        /* 头部区域 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            animation: pulse-badge 2s ease-in-out infinite;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink-dot 1s ease-in-out infinite;
        }

        @keyframes blink-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse-badge {
            0%, 100% { box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(255, 65, 108, 0.6); }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .protocol-selector {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 10px;
        }

        .protocol-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #a0a0b0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .protocol-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .protocol-btn.active {
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.3);
        }

        /* 播放器区域 */
        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 0 100px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 25px;
        }

        .prism-player {
            border-radius: 12px;
        }

        /* 信息面板 */
        .info-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0a0b0;
        }

        .info-label {
            color: #6a6a7a;
            font-weight: 500;
        }

        .info-value {
            color: #e0e0e0;
            font-weight: 500;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-streaming {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
            animation: glow 1.5s ease-in-out infinite;
        }

        .status-error {
            background: #ff4b2b;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.6);
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 8px rgba(76, 175, 80, 0.6); }
            50% { box-shadow: 0 0 16px rgba(76, 175, 80, 0.8); }
        }

        /* 控制按钮 */
        .control-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            width: 16px;
            height: 16px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .player-container {
                padding: 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 18px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .info-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .protocol-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        /* 加载动画 */
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #4a6cf7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 地址输入区域 */
        .url-input-area {
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .url-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .url-input-group label {
            font-size: 13px;
            color: #6a6a7a;
            font-weight: 500;
        }

        .url-input {
            flex: 1;
            min-width: 250px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 8px rgba(74, 108, 247, 0.3);
        }

        .url-input::placeholder {
            color: #5a5a6a;
        }

        .apply-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .apply-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.4);
        }

        .url-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #6a6a7a;
        }

        .url-hint code {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body>
<div class="player-container">
    <!-- 头部 -->
    <div class="header">
        <div class="title-group">
            <h1>直播播放器</h1>
            <div class="live-badge">
                <span class="live-dot"></span>
                LIVE
            </div>
        </div>
        <div class="protocol-selector">
            <button class="protocol-btn active" data-protocol="http">HTTP-FLV</button>
            <button class="protocol-btn" data-protocol="ws">WebSocket-FLV</button>
        </div>
    </div>

    <!-- 地址输入区域 -->
    <div class="url-input-area">
        <div class="url-input-group">
            <label>播放地址：</label>
            <input type="text" id="streamUrl" class="url-input" placeholder="例如：http://127.0.0.1:8501/a/b.flv 或 ws://127.0.0.1:8501/a/b.flv">
            <button class="apply-btn" onclick="applyUrlAndPlay()">应用并播放</button>
        </div>
        <div class="url-hint">
            💡 提示：支持 HTTP-FLV 和 WebSocket-FLV 两种协议，地址格式示例：
            <code>http://127.0.0.1:8501/a/b.flv</code> 或
            <code>ws://127.0.0.1:8501/a/b.flv</code>
        </div>
    </div>

    <!-- 播放器 -->
    <div class="player-wrapper">
        <div class="prism-player" id="player-con"></div>
    </div>

    <!-- 信息栏 -->
    <div class="info-bar">
        <div class="info-item">
            <span class="status-indicator status-streaming" id="statusIndicator"></span>
            <span class="info-label">状态:</span>
            <span class="info-value" id="streamStatus">未播放</span>
        </div>
        <div class="info-item">
            <span class="info-label">协议:</span>
            <span class="info-value" id="currentProtocol">HTTP-FLV</span>
        </div>
        <div class="info-item">
            <span class="info-label">音量:</span>
            <span class="info-value" id="volumeDisplay">0%</span>
        </div>
        <div class="info-item">
            <span class="info-label">当前地址:</span>
            <span class="info-value" id="currentUrl">-</span>
        </div>
    </div>

    <!-- 控制按钮 -->
    <div class="control-buttons">
        <button class="btn btn-primary" id="muteBtn" onclick="toggleMute()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            取消静音
        </button>
        <button class="btn btn-secondary" onclick="reloadPlayer()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            重新加载
        </button>
        <button class="btn btn-secondary" onclick="toggleProtocol()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.35 6.35L12 12l5.65-5.65L12 0 6.35 6.35zM4 12c0-2.21.9-4.21 2.35-5.65L0 0v12h4zm16 0c0 2.21-.9 4.21-2.35 5.65L24 24V12h-4zM12 4L8 8l4 4 4-4-4-4z"/>
            </svg>
            切换协议
        </button>
    </div>
</div>

<script>
    var currentProtocol = 'http';
    var currentUrl = '';
    var player = null;

    // 默认地址配置
    var defaultUrls = {
        http: 'http://127.0.0.1:8501/a/b.flv',
        ws: 'ws://127.0.0.1:8501/a/b.flv'
    };

    /** 参考文档 https://help.aliyun.com/zh/vod/developer-reference/basic-features */
    function createPlayer(url) {
        if (!url) {
            url = defaultUrls[currentProtocol];
        }

        // 根据URL自动判断协议并更新UI
        if (url.startsWith('ws://') || url.startsWith('wss://')) {
            currentProtocol = 'ws';
            updateProtocolButtonUI('ws');
            document.getElementById('currentProtocol').textContent = 'WebSocket-FLV';
        } else if (url.startsWith('http://') || url.startsWith('https://')) {
            currentProtocol = 'http';
            updateProtocolButtonUI('http');
            document.getElementById('currentProtocol').textContent = 'HTTP-FLV';
        }

        currentUrl = url;
        document.getElementById('currentUrl').textContent = url.length > 50 ? url.substring(0, 47) + '...' : url;
        document.getElementById('streamUrl').value = url;

        if (player) {
            player.dispose();
            player = null;
        }

        // 显示加载状态
        document.getElementById('streamStatus').textContent = '加载中...';
        document.getElementById('statusIndicator').className = 'status-indicator';
        document.getElementById('statusIndicator').style.background = '#ffa500';
        document.getElementById('statusIndicator').style.boxShadow = '0 0 8px rgba(255, 165, 0, 0.6)';

        player = new Aliplayer({
            "id": "player-con",
            "source": url,
            "width": "100%",
            "height": "500px",
            "autoplay": true,
            "isLive": true,
            "rePlay": false,
            "playsinline": true,
            "preload": true,
            "enableStashBufferForFlv": true,
            "stashInitialSizeForFlv": 32,
            "controlBarVisibility": "hover",
            "useH5Prism": true,
            "skinLayout": [
                {"name": "bigPlayButton", "align": "blabs", "x": 30, "y": 80},
                {"name": "H5Loading", "align": "cc"},
                {"name": "errorDisplay", "align": "tlabs", "x": 0, "y": 0},
                {"name": "infoDisplay"},
                {"name": "tooltip", "align": "blabs", "x": 0, "y": 56},
                {"name": "thumbnail"},
                {
                    "name": "controlBar", "align": "blabs", "x": 0, "y": 0,
                    "children": [
                        {"name": "progress", "align": "blabs", "x": 0, "y": 44},
                        {"name": "playButton", "align": "tl", "x": 15, "y": 12},
                        {"name": "timeDisplay", "align": "tl", "x": 10, "y": 7},
                        {"name": "fullScreenButton", "align": "tr", "x": 10, "y": 12},
                        {"name": "volume", "align": "tr", "x": 5, "y": 10}
                    ]
                }
            ]
        }, function(p) {
            console.log("播放器已创建 - 地址: " + url);
            p.setVolume(0);
            p.play();
            updateUI();
        });

        // 错误处理
        player.on('error', function(error) {
            console.error('播放器错误:', error);
            document.getElementById('streamStatus').textContent = '播放错误';
            document.getElementById('statusIndicator').className = 'status-indicator status-error';
            document.getElementById('statusIndicator').style.background = '#ff4b2b';
        });

        player.on('canplay', function() {
            document.getElementById('streamStatus').textContent = '直播中';
            document.getElementById('statusIndicator').className = 'status-indicator status-streaming';
            document.getElementById('statusIndicator').style.background = '#4caf50';
        });
    }

    function updateUI() {
        document.getElementById('currentProtocol').textContent =
            currentProtocol === 'http' ? 'HTTP-FLV' : 'WebSocket-FLV';
        document.getElementById('volumeDisplay').textContent = '0%';
    }

    function updateProtocolButtonUI(protocol) {
        document.querySelectorAll('.protocol-btn').forEach(function(btn) {
            if (btn.dataset.protocol === protocol) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    function toggleMute() {
        if (!player) return;
        var btn = document.getElementById('muteBtn');
        var currentVolume = player.getVolume();

        if (currentVolume > 0) {
            player.setVolume(0);
            document.getElementById('volumeDisplay').textContent = '0%';
            btn.innerHTML = '<svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg> 取消静音';
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-secondary');
        } else {
            player.setVolume(1);
            document.getElementById('volumeDisplay').textContent = '100%';
            btn.innerHTML = '<svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z"/></svg> 静音';
            btn.classList.remove('btn-secondary');
            btn.classList.add('btn-primary');
        }
    }

    function reloadPlayer() {
        if (currentUrl) {
            createPlayer(currentUrl);
        } else {
            createPlayer(defaultUrls[currentProtocol]);
        }
    }

    function applyUrlAndPlay() {
        var urlInput = document.getElementById('streamUrl');
        var newUrl = urlInput.value.trim();
        if (newUrl) {
            createPlayer(newUrl);
        } else {
            alert('请输入播放地址');
        }
    }

    function toggleProtocol() {
        // 切换协议并更新地址
        if (currentProtocol === 'http') {
            currentProtocol = 'ws';
            // 将 http:// 替换为 ws://
            if (currentUrl.startsWith('http://')) {
                currentUrl = currentUrl.replace('http://', 'ws://');
            } else if (currentUrl.startsWith('https://')) {
                currentUrl = currentUrl.replace('https://', 'wss://');
            } else {
                currentUrl = defaultUrls.ws;
            }
        } else {
            currentProtocol = 'http';
            // 将 ws:// 替换为 http://
            if (currentUrl.startsWith('ws://')) {
                currentUrl = currentUrl.replace('ws://', 'http://');
            } else if (currentUrl.startsWith('wss://')) {
                currentUrl = currentUrl.replace('wss://', 'https://');
            } else {
                currentUrl = defaultUrls.http;
            }
        }
        updateProtocolButtonUI(currentProtocol);
        createPlayer(currentUrl);
    }

    // 协议切换按钮点击事件
    document.querySelectorAll('.protocol-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var protocol = this.dataset.protocol;
            if (protocol === currentProtocol) return;

            currentProtocol = protocol;
            // 根据选择的协议生成默认地址
            if (currentUrl) {
                // 替换现有URL的协议部分
                if (currentProtocol === 'http') {
                    currentUrl = currentUrl.replace(/^ws(s?):\/\//, 'http$1://');
                } else {
                    currentUrl = currentUrl.replace(/^http(s?):\/\//, 'ws$1://');
                }
            } else {
                currentUrl = defaultUrls[currentProtocol];
            }
            updateProtocolButtonUI(currentProtocol);
            createPlayer(currentUrl);
        });
    });

    // 初始化播放器
    createPlayer(defaultUrls.http);
</script>
</body>
</html>
