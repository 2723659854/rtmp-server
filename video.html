<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
    <title>FLV 播放器 - 静态文件回放</title>
    <script type="text/javascript" charset="utf-8" src="/aliplayer-min.js"></script>
    <link rel="stylesheet" href="/aliplayer-min.css">
</head>
<body>
<h1>本页面仅演示，请手动修改播放地址</h1>
<div class="prism-player" id="player-con"></div>
<script>
    var player = new Aliplayer({
            "id": "player-con",
            /** 静态 FLV 文件路径（需要填写真是的文件路径，此处是测试文件） */
            "source": "http://127.0.0.1/flv/a/b/202605310838496a1bf39945066.flv",
            "width": "100%",
            "height": "500px",
            "autoplay": true,
            "isLive": false,           // ← 关键：静态文件回放，设为 false
            "rePlay": true,             // ← 播放完毕后显示重新播放按钮
            "playsinline": true,
            "preload": true,
            "controlBarVisibility": "hover",
            "useH5Prism": true
        }, function (player) {
            console.log("The player is created");
        }
    );
</script>
</body>
</html>
