<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>双码率转码推流-WS-FLV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" charset="utf-8" src="/aliplayer-min.js"></script>
    <link rel="stylesheet" href="/aliplayer-min.css">
    <style>
        :root { --bg:#0f0f1a; --card:#1a1a2e; --accent:#4cc9f0; --danger:#f72585; --success:#06d6a0; --text:#e0e0e0; --muted:#888; --border:#2a2a3e; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }
        .container { width:100%; max-width:1000px; margin:0 auto; background:var(--card); border-radius:16px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
        .title { font-size:1.4em; font-weight:600; display:flex; align-items:center; gap:10px; }
        .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
        .dot.live { background:var(--danger); animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .btn { padding:10px 22px; border:none; border-radius:8px; font-size:0.95em; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
        .btn-start { background:var(--accent); color:#000; } .btn-stop { background:var(--danger); color:#fff; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .input-group { margin-bottom:16px; }
        .input-group label { display:block; font-size:0.85em; color:var(--muted); margin-bottom:6px; }
        .input-group input { width:100%; padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.9em; }
        .input-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
        .preview-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
        .preview-card { background:rgba(0,0,0,0.3); border-radius:12px; overflow:hidden; border:2px solid var(--border); }
        .preview-header { padding:10px; background:rgba(0,0,0,0.4); display:flex; justify-content:space-between; align-items:center; }
        .preview-title { font-size:0.85em; font-weight:600; }
        .preview-status { font-size:0.7em; padding:3px 8px; border-radius:4px; background:var(--muted); }
        .preview-status.active { background:var(--success); }
        .preview-wrap { background:#000; position:relative; }
        .preview-wrap canvas { width:100%; display:block; }
        .overlay { position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,0.7); color:#fff; padding:3px 8px; border-radius:4px; font-size:0.7em; }
        .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
        .stat-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:14px; }
        .stat-card .title { font-size:0.8em; color:var(--muted); margin-bottom:8px; }
        .stat-values { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; }
        .stat-values .value { font-size:1.2em; font-weight:700; font-family:monospace; }
        .stat-values .label { font-size:0.65em; color:var(--muted); margin-top:2px; }
        .value.video { color:var(--accent); } .value.audio { color:var(--success); } .value.time { color:#ff9f1c; }
        .settings { display:flex; gap:16px; flex-wrap:wrap; padding:16px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; margin-bottom:20px; }
        .setting { display:flex; align-items:center; gap:8px; }
        .setting label { font-size:0.85em; color:var(--muted); }
        .setting select { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
        .log-panel { background:#000; border:1px solid var(--border); border-radius:10px; padding:12px; max-height:180px; overflow-y:auto; font-family:monospace; font-size:0.7em; color:#aaa; }
        .log-warn { color:#ff9f1c; } .log-error { color:#f72585; } .log-success { color:#06d6a0; }
        .tip-box { font-size:10px; color:#555; text-align:center; margin-top:10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title"><span class="dot" id="statusDot"></span>双码率转码推流</div>
        <div>
            <button class="btn btn-start" id="startBtn" onclick="startTranscode()">▶ 开始转码推流</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopTranscode()" disabled>■ 停止</button>
        </div>
    </div>

    <div class="input-group">
        <label>拉流地址 (WS-FLV)</label>
        <input type="text" id="pullUrl" value="ws://127.0.0.1:8501/a/b.flv">
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>720p 推流地址</label>
            <input type="text" id="pushUrl720" value="ws://127.0.0.1:8501/a/b_720p">
        </div>
        <div class="input-group">
            <label>360p 推流地址</label>
            <input type="text" id="pushUrl360" value="ws://127.0.0.1:8501/a/b_360p">
        </div>
    </div>

    <!-- 隐藏的播放器容器 -->
    <div id="playerSource" style="display:none;"></div>

    <div class="preview-grid">
        <div class="preview-card">
            <div class="preview-header">
                <span class="preview-title">720p 输出</span>
                <span class="preview-status" id="status720">等待</span>
            </div>
            <div class="preview-wrap">
                <canvas id="canvas720" width="1280" height="720"></canvas>
                <div class="overlay" id="overlay720">1280×720</div>
            </div>
        </div>
        <div class="preview-card">
            <div class="preview-header">
                <span class="preview-title">360p 输出</span>
                <span class="preview-status" id="status360">等待</span>
            </div>
            <div class="preview-wrap">
                <canvas id="canvas360" width="640" height="360"></canvas>
                <div class="overlay" id="overlay360">640×360</div>
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="title">720p 统计</div>
            <div class="stat-values">
                <div><div class="value video" id="videoCount720">0</div><div class="label">视频帧</div></div>
                <div><div class="value audio" id="audioCount720">0</div><div class="label">音频帧</div></div>
                <div><div class="value time" id="elapsedTime720">00:00</div><div class="label">时长</div></div>
                <div><div class="value" style="color:#fff;" id="bitrate720">0</div><div class="label">kbps</div></div>
            </div>
        </div>
        <div class="stat-card">
            <div class="title">360p 统计</div>
            <div class="stat-values">
                <div><div class="value video" id="videoCount360">0</div><div class="label">视频帧</div></div>
                <div><div class="value audio" id="audioCount360">0</div><div class="label">音频帧</div></div>
                <div><div class="value time" id="elapsedTime360">00:00</div><div class="label">时长</div></div>
                <div><div class="value" style="color:#fff;" id="bitrate360">0</div><div class="label">kbps</div></div>
            </div>
        </div>
    </div>

    <div class="settings">
        <div class="setting"><label>帧率</label><select id="fpsSelect"><option value="20">20</option><option value="25" selected>25</option><option value="30">30</option></select></div>
        <div class="setting"><label>720p码率</label><select id="bitrate720Select"><option value="1500">1500k</option><option value="2000" selected>2000k</option><option value="2500">2500k</option></select></div>
        <div class="setting"><label>360p码率</label><select id="bitrate360Select"><option value="400">400k</option><option value="600" selected>600k</option><option value="800">800k</option></select></div>
    </div>

    <div class="log-panel" id="logPanel"></div>

    <div class="tip-box">
        <span>💡 单路拉流 → 双码率重编码 → 推流回服务器</span>
    </div>

    <div style="margin-top:30px;padding:12px 0;text-align:center;font-size:12px;color:#6a6a7a;border-top:1px solid rgba(255,255,255,0.06);">
        本页面由 <strong style="color:#6c8cff;">xiaosongshu/rtmp-server</strong> 提供
    </div>
</div>

<script>
    // ==================== 常量 ====================
    const KEYFRAME_INTERVAL = 30;
    const RESOLUTIONS = {
        '720': { width: 1280, height: 720, name: '720p' },
        '360': { width: 640,  height: 360,  name: '360p' }
    };

    // ==================== 全局变量 ====================
    let playerSource = null;
    let videoSource = null;
    let isTranscoding = false;
    let FPS = 25;
    let SAMPLE_RATE = 48000;
    let statsTimer = null;

    const encoders = {
        '720': { ws: null, videoEncoder: null, audioEncoder: null,
            videoChunkCount: 0, audioChunkCount: 0, totalBytes: 0,
            avcConfigSent: false, aacConfigSent: false,
            videoFrameIndex: 0, audioFrameIndex: 0 },
        '360': { ws: null, videoEncoder: null, audioEncoder: null,
            videoChunkCount: 0, audioChunkCount: 0, totalBytes: 0,
            avcConfigSent: false, aacConfigSent: false,
            videoFrameIndex: 0, audioFrameIndex: 0 }
    };

    let audioCtx = null;
    let scriptNode = null;
    let sourceNode = null;
    let animationFrameId = null;

    // ==================== 日志 ====================
    function log(msg, level = 'info') {
        const t = new Date().toLocaleTimeString();
        const p = document.getElementById('logPanel');
        const css = {'warn':'log-warn','error':'log-error','success':'log-success'}[level] || '';
        p.innerHTML += `<div><span style="color:#555">${t}</span> <span class="${css}">${msg}</span></div>`;
        p.scrollTop = p.scrollHeight;
    }

    // ==================== UI 更新 ====================
    function updateStats() {
        const now = performance.now();
        for (const res of ['720', '360']) {
            document.getElementById(`videoCount${res}`).textContent = encoders[res].videoChunkCount;
            document.getElementById(`audioCount${res}`).textContent = encoders[res].audioChunkCount;
            const sec = Math.floor((encoders[res].videoFrameIndex / FPS) || 0);
            document.getElementById(`elapsedTime${res}`).textContent =
                `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
            if (sec > 0) {
                document.getElementById(`bitrate${res}`).textContent =
                    Math.floor(encoders[res].totalBytes * 8 / sec / 1000);
            }
        }
    }

    function setStatus(live) {
        document.getElementById('statusDot').className = 'dot' + (live ? ' live' : '');
        for (const res of ['720', '360']) {
            const el = document.getElementById(`status${res}`);
            el.textContent = live ? '推送中' : '等待';
            el.className = 'preview-status' + (live ? ' active' : '');
        }
    }

    // ==================== FLV 封装 ====================
    function sendFlvHeader(ws) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(new Uint8Array([0x46,0x4C,0x56,0x01,0x05,0x00,0x00,0x00,0x09,0x00,0x00,0x00,0x00]));
    }

    function sendTag(ws, type, payload, timestampMs) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return 0;
        const size = payload.length;
        const tag = new Uint8Array(11 + size + 4);
        tag[0] = type;
        tag[1] = (size >> 16) & 0xFF;
        tag[2] = (size >> 8) & 0xFF;
        tag[3] = size & 0xFF;
        const ts = Math.floor(timestampMs);
        tag[4] = (ts >> 16) & 0xFF;
        tag[5] = (ts >> 8) & 0xFF;
        tag[6] = ts & 0xFF;
        tag[7] = (ts >> 24) & 0xFF;
        tag[8] = 0; tag[9] = 0; tag[10] = 0;
        tag.set(payload, 11);
        const prevTagSize = 11 + size;
        tag[11 + size] = (prevTagSize >> 24) & 0xFF;
        tag[12 + size] = (prevTagSize >> 16) & 0xFF;
        tag[13 + size] = (prevTagSize >> 8) & 0xFF;
        tag[14 + size] = prevTagSize & 0xFF;
        ws.send(tag);
        return tag.length;
    }

    function sendMetaData(ws, res) {
        const { width, height } = RESOLUTIONS[res];
        function n2b(n) { const a = new Uint8Array(8); new DataView(a.buffer).setFloat64(0, n, false); return Array.from(a); }
        function s2b(s) { return Array.from(new TextEncoder().encode(s)); }
        const meta = [
            ['duration',0],['width',width],['height',height],
            ['videocodecid',7],['audiocodecid',10],
            ['audiosamplerate',SAMPLE_RATE],['audiosamplesize',16],
            ['stereo',true],['filesize',0],['framerate',FPS]
        ];
        const buf = [0x02,0x00,0x0A,...s2b('onMetaData'),0x03];
        for (const [k,v] of meta) {
            buf.push((k.length>>8)&0xFF, k.length&0xFF, ...s2b(k));
            if (typeof v==='number') buf.push(0x00,...n2b(v));
            else if (typeof v==='boolean') buf.push(0x01, v?1:0);
        }
        buf.push(0x00,0x00,0x09);
        sendTag(ws, 0x12, new Uint8Array(buf), 0);
    }

    function sendAACConfig(ws, desc, res) {
        if (encoders[res].aacConfigSent || !desc) return;
        encoders[res].aacConfigSent = true;
        const d = new Uint8Array(desc);
        const b = new Uint8Array(2 + d.length);
        b[0] = 0xAF; b[1] = 0x00; b.set(d, 2);
        sendTag(ws, 8, b, 0);
    }

    function sendAvcConfig(ws, desc, res) {
        if (encoders[res].avcConfigSent || !desc) return;
        encoders[res].avcConfigSent = true;
        const b = new Uint8Array(5 + desc.length);
        b[0] = 0x17; b[1] = 0x00; b[2] = 0; b[3] = 0; b[4] = 0;
        b.set(new Uint8Array(desc), 5);
        sendTag(ws, 9, b, 0);
    }

    function buildVideoBody(data, isKey) {
        const b = new Uint8Array(5 + data.length);
        b[0] = isKey ? 0x17 : 0x27;
        b[1] = 0x01; b[2] = 0; b[3] = 0; b[4] = 0;
        b.set(data, 5);
        return b;
    }

    function buildAudioBody(data) {
        const b = new Uint8Array(2 + data.length);
        b[0] = 0xAF; b[1] = 0x01;
        b.set(data, 2);
        return b;
    }

    // ==================== 拉流（Aliplayer）====================
    function initPlayer() {
        return new Promise((resolve, reject) => {
            const pullUrl = document.getElementById('pullUrl').value.trim();
            if (!pullUrl) return reject(new Error('请输入拉流地址'));

            if (playerSource) { try { playerSource.dispose(); } catch(e) {} }

            let resolved = false;

            playerSource = new Aliplayer({
                id: 'playerSource',
                source: pullUrl,
                width: '100%',
                height: '100%',
                autoplay: true,
                isLive: true,
                muted: false,
                playsinline: true,
                preload: 'auto',
                useH5Prism: true,
                controlBarVisibility: 'hover',
            }, () => {
                log('源播放器已就绪', 'success');
                videoSource = document.querySelector('#playerSource video');
                if (!videoSource) { reject(new Error('未找到 video 元素')); return; }
                const checkPlay = setInterval(() => {
                    if (videoSource.readyState >= 2 && videoSource.videoWidth > 0) {
                        clearInterval(checkPlay);
                        if (!resolved) { resolved = true; log(`源流播放: ${videoSource.videoWidth}x${videoSource.videoHeight}`, 'success'); resolve(); }
                    }
                }, 200);
                setTimeout(() => { clearInterval(checkPlay); if (!resolved) { resolved = true; log('源流播放超时', 'warn'); resolve(); } }, 15000);
            });

            playerSource.on('error', (e) => { if (!resolved) { resolved = true; reject(new Error(`源流错误: ${e?.message || e}`)); } });
        });
    }

    // ==================== 建立推流连接 ====================
    function connectPushStreams() {
        const pushUrl720 = document.getElementById('pushUrl720').value.trim();
        const pushUrl360 = document.getElementById('pushUrl360').value.trim();

        const connectOne = (url, res) => {
            return new Promise((resolve, reject) => {
                const ws = new WebSocket(url);
                ws.binaryType = 'arraybuffer';
                ws.onopen = () => { log(`${RESOLUTIONS[res].name} WebSocket 连接成功`, 'success'); sendFlvHeader(ws); sendMetaData(ws, res); resolve(ws); };
                ws.onerror = () => reject(new Error(`${res} WebSocket 连接失败`));
                ws.onclose = (e) => log(`${RESOLUTIONS[res].name} WebSocket 断开 (code:${e.code})`, 'warn');
                encoders[res].ws = ws;
            });
        };

        return Promise.all([connectOne(pushUrl720, '720'), connectOne(pushUrl360, '360')]);
    }

    // ==================== 视频编码 ====================
    function setupVideoEncoding() {
        const bitrate720 = +document.getElementById('bitrate720Select').value * 1000;
        const bitrate360 = +document.getElementById('bitrate360Select').value * 1000;
        const canvas720 = document.getElementById('canvas720');
        const canvas360 = document.getElementById('canvas360');
        const ctx720 = canvas720.getContext('2d');
        const ctx360 = canvas360.getContext('2d');

        const createVideoEncoder = (res, bitrate) => {
            const encoder = new VideoEncoder({
                output(chunk, meta) {
                    if (!isTranscoding) return;
                    const ws = encoders[res].ws;
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                    if (meta?.decoderConfig?.description) sendAvcConfig(ws, new Uint8Array(meta.decoderConfig.description), res);
                    if (data.length > 0) {
                        encoders[res].videoChunkCount++;
                        const dts = encoders[res].videoFrameIndex * (1000 / FPS);
                        sendTag(ws, 9, buildVideoBody(data, chunk.type === 'key'), dts);
                        encoders[res].videoFrameIndex++;
                    }
                },
                error(e) { log(`${res} 视频编码错误: ${e.message}`, 'error'); }
            });
            encoder.configure({ codec: 'avc1.42001F', width: RESOLUTIONS[res].width, height: RESOLUTIONS[res].height, bitrate: bitrate, framerate: FPS, latencyMode: 'realtime' });
            log(`${res} 视频编码器就绪`, 'success');
            return encoder;
        };

        encoders['720'].videoEncoder = createVideoEncoder('720', bitrate720);
        encoders['360'].videoEncoder = createVideoEncoder('360', bitrate360);

        let frameCount = 0;
        let lastKeyFrame = -KEYFRAME_INTERVAL;

        function processFrame() {
            if (!isTranscoding) return;

            if (videoSource && videoSource.readyState >= 2 && videoSource.videoWidth > 0) {
                ctx720.drawImage(videoSource, 0, 0, 1280, 720);
                ctx360.drawImage(videoSource, 0, 0, 640, 360);
            } else {
                ctx720.fillStyle = '#000'; ctx720.fillRect(0, 0, 1280, 720);
                ctx360.fillStyle = '#000'; ctx360.fillRect(0, 0, 640, 360);
            }

            const isKey = (frameCount - lastKeyFrame >= KEYFRAME_INTERVAL) || frameCount === 0;

            try {
                const frame720 = new VideoFrame(canvas720, { timestamp: frameCount * (1000000 / FPS), duration: 1000000 / FPS });
                if (encoders['720'].videoEncoder && encoders['720'].videoEncoder.state === 'configured') {
                    encoders['720'].videoEncoder.encode(frame720, { keyFrame: isKey });
                }
                frame720.close();

                const frame360 = new VideoFrame(canvas360, { timestamp: frameCount * (1000000 / FPS), duration: 1000000 / FPS });
                if (encoders['360'].videoEncoder && encoders['360'].videoEncoder.state === 'configured') {
                    encoders['360'].videoEncoder.encode(frame360, { keyFrame: isKey });
                }
                frame360.close();

                if (isKey) lastKeyFrame = frameCount;
                frameCount++;
            } catch (e) {
                log(`视频编码异常: ${e.message}`, 'error');
            }

            animationFrameId = requestAnimationFrame(processFrame);
        }

        animationFrameId = requestAnimationFrame(processFrame);
        log('视频帧循环已启动', 'success');
    }

    // ==================== 音频编码 ====================
    function setupAudioEncoding() {
        if (!videoSource) { log('无 video 元素', 'warn'); return; }

        const captureStream = videoSource.captureStream();
        const audioTrack = captureStream.getAudioTracks()[0];
        if (!audioTrack) { log('无音频轨道', 'warn'); return; }

        const settings = audioTrack.getSettings();
        SAMPLE_RATE = settings.sampleRate || 48000;
        const channelCount = Math.min(settings.channelCount || 1, 2);
        log(`音频: ${SAMPLE_RATE}Hz ${channelCount}ch`, 'success');

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = new MediaStream([audioTrack]);
        sourceNode = audioCtx.createMediaStreamSource(stream);
        scriptNode = audioCtx.createScriptProcessor(4096, channelCount, channelCount);
        sourceNode.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);

        const createAudioEncoder = (res) => {
            const encoder = new AudioEncoder({
                output(chunk, meta) {
                    if (!isTranscoding) return;
                    const ws = encoders[res].ws;
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    if (meta?.decoderConfig?.description) sendAACConfig(ws, meta.decoderConfig.description, res);
                    const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                    if (data.length > 0) {
                        encoders[res].audioChunkCount++;
                        const dts = encoders[res].audioFrameIndex * (1024 / SAMPLE_RATE) * 1000;
                        sendTag(ws, 8, buildAudioBody(data), dts);
                        encoders[res].audioFrameIndex++;
                    }
                },
                error(e) { log(`${res} 音频编码错误: ${e.message}`, 'error'); }
            });
            encoder.configure({ codec: 'mp4a.40.2', sampleRate: SAMPLE_RATE, numberOfChannels: channelCount, bitrate: 96000 });
            return encoder;
        };

        encoders['720'].audioEncoder = createAudioEncoder('720');
        encoders['360'].audioEncoder = createAudioEncoder('360');
        log('音频编码器就绪', 'success');

        scriptNode.onaudioprocess = (event) => {
            if (!isTranscoding) return;
            const inputBuffer = event.inputBuffer;
            const numChannels = inputBuffer.numberOfChannels;
            const sampleRate = inputBuffer.sampleRate;
            const numFrames = inputBuffer.length;

            const pcmData = new Int16Array(numFrames * numChannels);
            for (let ch = 0; ch < numChannels; ch++) {
                const channelData = inputBuffer.getChannelData(ch);
                for (let i = 0; i < numFrames; i++) {
                    const sample = Math.max(-1, Math.min(1, channelData[i]));
                    pcmData[i * numChannels + ch] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                }
            }

            const audioData = new AudioData({
                format: 's16',
                sampleRate: sampleRate,
                numberOfFrames: numFrames,
                numberOfChannels: numChannels,
                timestamp: 0,
                data: pcmData.buffer
            });

            for (const res of ['720', '360']) {
                if (encoders[res].audioEncoder && encoders[res].audioEncoder.state === 'configured') {
                    try { encoders[res].audioEncoder.encode(audioData); } catch (e) {}
                }
            }
        };
    }

    // ==================== 启动 / 停止 ====================
    async function startTranscode() {
        if (isTranscoding) return;
        try {
            FPS = +document.getElementById('fpsSelect').value;
            for (const res of ['720', '360']) {
                encoders[res].videoChunkCount = 0; encoders[res].audioChunkCount = 0;
                encoders[res].totalBytes = 0;
                encoders[res].avcConfigSent = false; encoders[res].aacConfigSent = false;
                encoders[res].videoFrameIndex = 0; encoders[res].audioFrameIndex = 0;
            }

            log('拉取源流...', 'info');
            await initPlayer();
            log('建立推流连接...', 'info');
            await connectPushStreams();
            log('启动视频编码...', 'info');
            setupVideoEncoding();
            setTimeout(() => setupAudioEncoding(), 1000);

            isTranscoding = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            setStatus(true);
            statsTimer = setInterval(updateStats, 500);
            log('双码率推流已启动', 'success');
        } catch (err) {
            log(`启动失败: ${err.message}`, 'error');
            await stopTranscode();
        }
    }

    async function stopTranscode() {
        if (!isTranscoding && !playerSource) return;
        log('停止中...', 'warn');
        isTranscoding = false;

        if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
        if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }

        if (scriptNode) { try { scriptNode.disconnect(); } catch(e) {} scriptNode = null; }
        if (sourceNode) { try { sourceNode.disconnect(); } catch(e) {} sourceNode = null; }
        if (audioCtx) { try { audioCtx.close(); } catch(e) {} audioCtx = null; }

        for (const res of ['720', '360']) {
            for (const type of ['videoEncoder', 'audioEncoder']) {
                const enc = encoders[res][type];
                if (enc && enc.state !== 'closed') {
                    try { await enc.flush(); } catch(e) {}
                    try { enc.close(); } catch(e) {}
                    encoders[res][type] = null;
                }
            }
            if (encoders[res].ws) {
                try { encoders[res].ws.close(1000, 'stop'); } catch(e) {}
                encoders[res].ws = null;
            }
        }

        if (playerSource) { try { playerSource.dispose(); } catch(e) {} playerSource = null; videoSource = null; }

        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        setStatus(false);
        log('已停止', 'warn');
    }

    window.addEventListener('beforeunload', async (e) => { if (isTranscoding) { e.preventDefault(); await stopTranscode(); } });
    log('就绪', 'info');
</script>
