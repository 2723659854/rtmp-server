<!DOCTYPE html>
<html>
<head>
    <title>WebSocket FLV 屏幕推流</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; border: none; border-radius: 4px; }
        #stopBtn { background: #f72585; color: white; }
        button:disabled { opacity: 0.5; }
        #status { margin: 10px 0; padding: 10px; background: #2d2d44; border-radius: 4px; }
        #log { margin-top: 10px; padding: 10px; background: #0a0a1a; color: #0f0; font-family: monospace; font-size: 12px; height: 400px; overflow-y: auto; border-radius: 4px; }
        video { border: 1px solid #333; margin: 10px 0; max-width: 100%; border-radius: 4px; }
    </style>
</head>
<body>
<h3>📹 WebSocket FLV 屏幕推流</h3>
<video id="preview" autoplay muted playsinline></video>
<div><button id="stopBtn" disabled>停止推流</button></div>
<div id="status">⚪ 就绪</div>
<div id="log"></div>

<script>
    (function() {
        const preview = document.getElementById('preview');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        const WS_URL = 'ws://127.0.0.1:8501/a/b';

        let ws, stream, videoTrack, audioTrack;
        let videoEncoder, audioEncoder;
        let isPushing = false;
        let avcConfigSent = false, aacConfigSent = false, metaSent = false;
        let videoChunkCount = 0, audioChunkCount = 0;
        let audioCtx = null;

        let videoBaseTs = null;
        let audioBaseTs = null;

        let WIDTH = 1280, HEIGHT = 720, FPS = 30;
        let CODEC = 'avc1.4D0028';

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${msg}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(text, err) {
            statusDiv.innerHTML = (err ? '❌ ' : '✅ ') + text;
            log(text);
        }

        function sendTag(type, payload, timestamp) {
            if (!isPushing || !ws || ws.readyState !== WebSocket.OPEN) return;
            const size = payload.length;
            const tag = new Uint8Array(11 + size + 4);
            tag[0] = type;
            tag[1] = (size >> 16) & 0xFF;
            tag[2] = (size >> 8) & 0xFF;
            tag[3] = size & 0xFF;
            const ts = Math.max(0, Math.floor(timestamp));
            tag[4] = (ts >> 16) & 0xFF;
            tag[5] = (ts >> 8) & 0xFF;
            tag[6] = ts & 0xFF;
            tag[7] = (ts >> 24) & 0xFF;
            tag[8] = 0; tag[9] = 0; tag[10] = 0;
            tag.set(payload, 11);
            const prevSize = 11 + size;
            const pos = 11 + size;
            tag[pos] = (prevSize >> 24) & 0xFF;
            tag[pos+1] = (prevSize >> 16) & 0xFF;
            tag[pos+2] = (prevSize >> 8) & 0xFF;
            tag[pos+3] = prevSize & 0xFF;
            ws.send(tag);
        }

        function sendFlvHeader() {
            ws.send(new Uint8Array([0x46,0x4C,0x56,0x01,0x05,0x00,0x00,0x00,0x09,0x00,0x00,0x00,0x00]));
        }

        function sendMetaData() {
            if (metaSent) return;
            metaSent = true;
            function n2b(n) { const a=new Uint8Array(8); new DataView(a.buffer).setFloat64(0,n,false); return a; }
            function s2b(s) { const a=[]; for(let i=0;i<s.length;i++) a.push(s.charCodeAt(i)); return a; }
            const meta = [['duration',0],['width',WIDTH],['height',HEIGHT],['videocodecid',7],['audiocodecid',10],['audiosamplerate',44100],['audiosamplesize',16],['stereo',true],['filesize',0],['framerate',FPS]];
            const buf = [];
            buf.push(0x02,0x00,0x0A,...s2b('onMetaData'),0x03);
            for(const [k,v] of meta) { buf.push((k.length>>8)&0xFF,k.length&0xFF,...s2b(k)); if(typeof v==='number') buf.push(0x00,...n2b(v)); else if(typeof v==='boolean') buf.push(0x01,v?1:0); }
            buf.push(0x00,0x00,0x09);
            sendTag(0x12,new Uint8Array(buf),0);
        }

        function sendAACConfig(desc) {
            if (aacConfigSent || !desc) return;
            aacConfigSent = true;
            const asc = new Uint8Array(desc);
            const body = new Uint8Array(2+asc.length);
            body[0]=0xAF; body[1]=0x00; body.set(asc,2);
            sendTag(8, body, 0);
        }

        function sendAvcSequenceHeader(avcc) {
            if (avcConfigSent) return;
            avcConfigSent = true;
            const body = new Uint8Array(5+avcc.length);
            body[0]=0x17; body[1]=0x00; body[2]=0;body[3]=0;body[4]=0; body.set(avcc,5);
            sendTag(9, body, 0);
        }

        function sendVideoTag(nalu, keyframe, ts) {
            const body = new Uint8Array(5+nalu.length);
            body[0]=keyframe?0x17:0x27; body[1]=0x01; body[2]=0;body[3]=0;body[4]=0; body.set(nalu,5);
            sendTag(9, body, ts);
        }

        function sendAudioTag(aac, ts) {
            const body = new Uint8Array(2+aac.length);
            body[0]=0xAF; body[1]=0x01; body.set(aac,2);
            sendTag(8, body, ts);
        }

        async function stopStreaming() {
            isPushing = false;
            if (audioCtx) { try { audioCtx.close(); } catch(e) {} audioCtx = null; }
            if (videoEncoder) { try { videoEncoder.close(); } catch(e) {} videoEncoder = null; }
            if (audioEncoder) { try { audioEncoder.close(); } catch(e) {} audioEncoder = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            preview.srcObject = null;
            if (ws) { try { ws.close(); } catch(e) {} ws = null; }
            stopBtn.disabled = true;
            setStatus(`已停止 (V:${videoChunkCount}, A:${audioChunkCount})`);
        }

        function resampleAudio(rawTrack) {
            const ctx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:44100});
            audioCtx = ctx;
            const src = ctx.createMediaStreamSource(new MediaStream([rawTrack]));
            const merger = ctx.createChannelMerger(2);
            try { const s=ctx.createChannelSplitter(2); src.connect(s); s.connect(merger,0,0); s.connect(merger,1,1); } catch(e) { src.connect(merger,0,0); }
            const dest = ctx.createMediaStreamDestination();
            merger.connect(dest);
            return dest.stream.getAudioTracks()[0];
        }

        async function startStreaming() {
            try {
                setStatus('获取屏幕...');
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video:{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}, audio:true
                });
                videoTrack = stream.getVideoTracks()[0];
                const rawAudioTrack = stream.getAudioTracks()[0] || null;
                stream.getVideoTracks()[0].addEventListener('ended', stopStreaming);
                let processedAudioTrack = rawAudioTrack ? resampleAudio(rawAudioTrack) : null;
                preview.srcObject = new MediaStream([videoTrack]);
                const settings = videoTrack.getSettings();
                WIDTH = Math.min(settings.width||1920,1280)&~1;
                HEIGHT = Math.min(settings.height||1080,720)&~1;

                // ★ 动态检测编码器支持
                const codecs = ['avc1.4D0028','avc1.640028','avc1.4D001F','avc1.42001F'];
                CODEC = codecs[0];
                for (const c of codecs) {
                    const s = await VideoEncoder.isConfigSupported({codec:c,width:WIDTH,height:HEIGHT,bitrate:2000000,framerate:FPS,latencyMode:'realtime'});
                    if(s.supported) { CODEC = c; break; }
                }
                log(`分辨率: ${WIDTH}x${HEIGHT}, Codec: ${CODEC}`);

                videoBaseTs = null;
                audioBaseTs = null;

                ws = new WebSocket(WS_URL); ws.binaryType = 'arraybuffer';

                ws.onopen = async () => {
                    log('WS 连接');
                    isPushing = true; stopBtn.disabled = false;
                    setStatus(`🎬 ${WIDTH}x${HEIGHT}`);

                    sendFlvHeader();
                    sendMetaData();

                    videoEncoder = new VideoEncoder({
                        output(chunk, meta) {
                            const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                            if (meta?.decoderConfig?.description && !avcConfigSent) {
                                sendAvcSequenceHeader(new Uint8Array(meta.decoderConfig.description));
                            }
                            if (data.length > 0) {
                                videoChunkCount++;
                                if (videoBaseTs === null) videoBaseTs = chunk.timestamp;
                                // ★ 使用微秒差值转毫秒，确保时间戳均匀
                                const ts = Math.floor((chunk.timestamp - videoBaseTs) / 1000);
                                sendVideoTag(data, chunk.type === 'key', ts);
                                if (videoChunkCount <= 10 || videoChunkCount % 30 === 0) {
                                    log(`V#${videoChunkCount} ${chunk.type==='key'?'🔑':''} ${data.length}B ts=${ts}`);
                                }
                            }
                        },
                        error(e) { log(`V错误: ${e.message}`); }
                    });

                    // ★ 降低比特率，减少编码压力
                    videoEncoder.configure({
                        codec:CODEC, width:WIDTH, height:HEIGHT,
                        bitrate:1500000, framerate:FPS,
                        latencyMode:'realtime'
                    });

                    if (processedAudioTrack) {
                        audioEncoder = new AudioEncoder({
                            output(chunk, meta) {
                                if (meta?.decoderConfig?.description && !aacConfigSent) {
                                    sendAACConfig(meta.decoderConfig.description);
                                }
                                const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                                if (data.length > 0) {
                                    audioChunkCount++;
                                    if (audioBaseTs === null) audioBaseTs = chunk.timestamp;
                                    const ts = Math.floor((chunk.timestamp - audioBaseTs) / 1000);
                                    sendAudioTag(data, ts);
                                }
                            },
                            error(e) { log(`A错误: ${e.message}`); }
                        });
                        audioEncoder.configure({codec:'mp4a.40.2',sampleRate:44100,numberOfChannels:2,bitrate:128000});
                    }

                    const vp = new MediaStreamTrackProcessor({track:videoTrack});
                    const vr = vp.readable.getReader();
                    let ff = true, captureCount = 0, dropCount = 0;
                    (async () => {
                        while (isPushing) {
                            const { done, value } = await vr.read();
                            if (done) break;
                            captureCount++;
                            try {
                                // ★ 减少丢帧，让编码器自己处理队列
                                videoEncoder.encode(value, { keyFrame: ff });
                                ff = false;
                                if (captureCount % 30 === 0) {
                                    log(`[CAP] frame=${captureCount} drop=${dropCount} queue=${videoEncoder.encodeQueueSize}`);
                                }
                            } catch(e) { log(`[ENC ERR] ${e.message}`); dropCount++; }
                            finally { value.close(); }
                        }
                    })();

                    if (processedAudioTrack) {
                        const ap = new MediaStreamTrackProcessor({track:processedAudioTrack});
                        const ar = ap.readable.getReader();
                        (async () => {
                            while (isPushing) {
                                const { done, value } = await ar.read();
                                if (done) break;
                                try { audioEncoder.encode(value); } catch(e) {}
                                finally { value.close(); }
                            }
                        })();
                    }
                };

                ws.onerror = () => stopStreaming();
                ws.onclose = (e) => { if(isPushing) stopStreaming(); };

            } catch(e) { setStatus(`失败: ${e.message}`, true); }
        }

        stopBtn.addEventListener('click', stopStreaming);
        window.addEventListener('beforeunload', stopStreaming);
        log('页面就绪，2秒后自动开始...');
        setTimeout(startStreaming, 2000);
    })();
</script>
</body>
</html>
