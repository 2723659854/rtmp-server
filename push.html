<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>屏幕推流演示</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg:#0f0f1a; --card:#1a1a2e; --accent:#4cc9f0; --danger:#f72585; --success:#06d6a0; --text:#e0e0e0; --muted:#888; --border:#2a2a3e; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .container { width:100%; max-width:900px; background:var(--card); border-radius:16px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
        .url-input-wrap { flex:1; max-width:400px; display:flex; gap:8px; }
        .title { font-size:1.4em; font-weight:600; }
        .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); display:inline-block; margin-right:8px; }
        .dot.live { background:var(--danger); animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .btn { padding:10px 22px; border:none; border-radius:8px; font-size:0.95em; font-weight:500; cursor:pointer; }
        .btn-start { background:var(--accent); color:#000; } .btn-stop { background:var(--danger); color:#fff; } .btn-dump { background:var(--success); color:#000; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .video-wrap { background:#000; border-radius:12px; overflow:hidden; margin-bottom:20px; border:2px solid var(--border); position:relative; }
        .video-wrap video { width:100%; display:block; max-height:400px; }
        .overlay { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.7); color:var(--danger); padding:4px 10px; border-radius:4px; font-size:0.75em; display:none; }
        .overlay.show { display:flex; }
        .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px; }
        .stat-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
        .stat-card .value { font-size:1.4em; font-weight:700; font-family:monospace; }
        .stat-card .label { font-size:0.7em; color:var(--muted); margin-top:4px; text-transform:uppercase; }
        .value.video { color:var(--accent); } .value.audio { color:var(--success); } .value.time { color:#ff9f1c; }
        .settings { display:flex; gap:16px; margin-bottom:20px; padding:16px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; flex-wrap:wrap; }
        .setting { display:flex; align-items:center; gap:8px; }
        .setting label { font-size:0.85em; color:var(--muted); }
        .setting select { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
        .url-input { flex:1; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.85em; font-family:monospace; outline:none; transition:border-color 0.2s; }
        .url-input:focus { border-color:var(--accent); }
        .log-panel { background:#000; border:1px solid var(--border); border-radius:10px; padding:12px; max-height:200px; overflow-y:auto; font-family:monospace; font-size:0.7em; color:#aaa; }
        .log-warn { color:#ff9f1c; } .log-error { color:#f72585; } .log-success { color:#06d6a0; }
        .footer-notice { margin-top:24px; padding:12px 16px; background:rgba(255,255,255,0.015); border:1px solid rgba(255,255,255,0.04); border-radius:8px; font-size:0.72em; color:#666; line-height:1.5; text-align:center; }
        .footer-notice strong { color:#ff9f1c; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title"><span class="dot" id="statusDot"></span>屏幕推流WS-FLV演示</div>
        <div class="url-input-wrap">
            <input type="text" id="wsUrlInput" class="url-input" placeholder="ws://127.0.0.1:8501/a/b" value="ws://127.0.0.1:8501/a/b">
        </div>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-start" id="startBtn" onclick="startStreaming()">▶ 开始推流</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopStreaming()" disabled>■ 停止</button>
        </div>
    </div>
    <div class="video-wrap">
        <video id="preview" autoplay muted playsinline></video>
        <div class="overlay" id="liveBadge">🔴 LIVE</div>
    </div>
    <div class="stats">
        <div class="stat-card"><div class="value video" id="videoCount">0</div><div class="label">视频帧</div></div>
        <div class="stat-card"><div class="value audio" id="audioCount">0</div><div class="label">音频帧</div></div>
        <div class="stat-card"><div class="value" style="color:#ff9f1c" id="dropCount">0</div><div class="label">丢弃帧</div></div>
        <div class="stat-card"><div class="value time" id="elapsedTime">00:00</div><div class="label">时长</div></div>
        <div class="stat-card"><div class="value" style="color:#fff;" id="avDrift">0ms</div><div class="label">AV漂移</div></div>
    </div>
    <div class="settings">
        <div class="setting"><label>分辨率</label><select id="resSelect"><option value="640x360" selected>640×360</option><option value="854x480">854×480</option></select></div>
        <div class="setting"><label>帧率</label><select id="fpsSelect"><option value="10">10</option><option value="15" selected>15</option><option value="20">20</option></select></div>
        <div class="setting"><label>码率</label><select id="bitrateSelect"><option value="300">300k</option><option value="500" selected>500k</option><option value="800">800k</option></select></div>
    </div>
    <div class="log-panel" id="logPanel"></div>
    <div class="footer-notice">
        <p>推流协议：WebSocket-FLV | 本页面仅供测试</p>
        <p>受限于浏览器性能限制，音视频同步无法解决，存在音视频漂移，导致转码hls协议格式存在问题。故生产环境推荐使用 OBS / FFmpeg等成熟软件</p>
    </div>
    <div style="margin-top:30px;padding:12px 0;text-align:center;font-size:12px;color:#6a6a7a;border-top:1px solid rgba(255,255,255,0.06);">
        本页面由 <strong style="color:#6c8cff;"><a href="https://github.com/2723659854/rtmp-server" style="color: white">xiaosongshu/rtmp-server</a></strong> 提供
    </div>
</div>

<script>
    (function() {
        'use strict';

        const DEFAULT_WS_URL = 'ws://127.0.0.1:8501/a/b';
        const MAX_ENCODE_QUEUE = 3;
        const KEYFRAME_INTERVAL = 10;   // 关键帧间隔（帧数）

        let ws, stream, videoEncoder, audioEncoder;
        let isPushing = false;
        let avcSeqHeader = null, aacSeqHeader = null;
        let avcSeqHeaderSent = false, aacSeqHeaderSent = false;
        let videoFrameCount = 0, audioFrameCount = 0, dropCount = 0;
        // 缓存普通帧，等待序列头发送后再发送
        let pendingVideoFrames = [];
        let pendingAudioFrames = [];
        let statsTimer;
        let WIDTH = 640, HEIGHT = 360, FPS = 15, BITRATE = 500000;
        let streamStartPerf = 0;

        // 独立时钟（毫秒），起始不为0，避免与序列头DTS=0冲突
        let videoDts = 1000 / FPS;
        let audioDts = (1024 / 48000) * 1000;
        // 最后发送的DTS，用于强制单调
        let lastVideoDts = -1;
        let lastAudioDts = -1;
        // 音频参数（浏览器采集的原始采样率）
        let audioSampleRate = 48000;
        let audioChannelCount = 2;

        // 记录时间戳用于漂移计算
        let videoTimestamps = [], audioTimestamps = [];

        /* ========== DOM ========== */
        const previewVideo = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logPanel = document.getElementById('logPanel');
        const videoCountEl = document.getElementById('videoCount');
        const audioCountEl = document.getElementById('audioCount');
        const dropCountEl = document.getElementById('dropCount');
        const elapsedTimeEl = document.getElementById('elapsedTime');
        const avDriftEl = document.getElementById('avDrift');

        /* ========== 日志 ========== */
        function log(msg, level = 'info') {
            const t = new Date().toLocaleTimeString();
            const cls = level === 'warn' ? 'log-warn' : level === 'error' ? 'log-error' : level === 'success' ? 'log-success' : 'log-info';
            const div = document.createElement('div');
            div.innerHTML = `<span style="color:#555">${t}</span> <span class="${cls}">${msg}</span>`;
            logPanel.appendChild(div);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        /* ========== 配置 ========== */
        function updateConfig() {
            const [w, h] = document.getElementById('resSelect').value.split('x');
            WIDTH = +w; HEIGHT = +h;
            FPS = +document.getElementById('fpsSelect').value;
            BITRATE = +document.getElementById('bitrateSelect').value * 1000;
            // 重新计算视频步进
            videoDts = 1000 / FPS;
        }

        /* ========== UI 更新 ========== */
        function updateStats() {
            videoCountEl.textContent = videoFrameCount;
            audioCountEl.textContent = audioFrameCount;
            dropCountEl.textContent = dropCount;
            if (videoTimestamps.length > 0 && audioTimestamps.length > 0) {
                const lastV = videoTimestamps[videoTimestamps.length - 1];
                const lastA = audioTimestamps[audioTimestamps.length - 1];
                const drift = lastA.dts - lastV.dts;
                avDriftEl.textContent = `${drift > 0 ? '+' : ''}${drift.toFixed(0)}ms`;
                avDriftEl.style.color = Math.abs(drift) > 300 ? 'var(--danger)' : '#fff';
            }
            if (streamStartPerf > 0) {
                const sec = Math.floor((performance.now() - streamStartPerf) / 1000);
                elapsedTimeEl.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
            }
        }

        function setStatus(live) {
            document.getElementById('statusDot').className = 'dot' + (live ? ' live' : '');
            document.getElementById('liveBadge').className = 'overlay' + (live ? ' show' : '');
        }

        /* ========== FLV 构建与发送 ========== */
        function getAudioFlags(sr, ch) {
            // FLV 音频头：SoundFormat=10(AAC), SoundRate, SoundSize, SoundType
            const soundFormat = 10 << 4;   // 0xA0
            let rateIdx = 3;               // 44.1kHz (因为48kHz无法直接表示，统一用44.1)
            if (sr >= 44100) rateIdx = 3;
            else if (sr >= 22050) rateIdx = 2;
            else if (sr >= 11025) rateIdx = 1;
            else rateIdx = 0;
            const soundRate = (rateIdx & 0x03) << 2;
            const soundSize = 1 << 1;      // 16-bit
            const soundType = ch === 2 ? 1 : 0;
            return soundFormat | soundRate | soundSize | soundType;
        }

        function sendTagDirect(type, payload, timestampMs) {
            if (!isPushing || !ws || ws.readyState !== WebSocket.OPEN) return false;
            const size = payload.byteLength;
            const tag = new Uint8Array(11 + size + 4);
            const view = new DataView(tag.buffer);
            view.setUint8(0, type);
            view.setUint8(1, (size >> 16) & 0xFF);
            view.setUint8(2, (size >> 8) & 0xFF);
            view.setUint8(3, size & 0xFF);
            const ts = Math.floor(timestampMs);
            view.setUint8(4, (ts >> 16) & 0xFF);
            view.setUint8(5, (ts >> 8) & 0xFF);
            view.setUint8(6, ts & 0xFF);
            view.setUint8(7, (ts >> 24) & 0xFF);
            view.setUint8(8, 0); view.setUint8(9, 0); view.setUint8(10, 0);
            tag.set(payload, 11);
            view.setUint32(11 + size, 11 + size, false);
            try {
                ws.send(tag.buffer);
                return true;
            } catch (e) {
                log(`发送失败: ${e.message}`, 'error');
                return false;
            }
        }

        function sendFlvHeader() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(new Uint8Array([0x46, 0x4C, 0x56, 0x01, 0x05, 0x00, 0x00, 0x00, 0x09]).buffer);
            ws.send(new Uint8Array([0x00, 0x00, 0x00, 0x00]).buffer);
            log('FLV 头已发送');
        }

        function sendMetaData() {
            const n2b = n => { const b = new ArrayBuffer(8); new DataView(b).setFloat64(0, n, false); return new Uint8Array(b); };
            const s2b = s => new TextEncoder().encode(s);
            const parts = [0x02, 0x00, 0x0A, ...s2b('onMetaData'), 0x03];
            const meta = [
                ['duration', 0], ['width', WIDTH], ['height', HEIGHT],
                ['videocodecid', 7], ['audiocodecid', 10],
                ['audiosamplerate', audioSampleRate], ['audiosamplesize', 16],
                ['stereo', audioChannelCount === 2], ['filesize', 0], ['framerate', FPS]
            ];
            meta.forEach(([k, v]) => {
                const key = s2b(k);
                parts.push((key.length >> 8) & 0xFF, key.length & 0xFF, ...key);
                if (typeof v === 'number') { parts.push(0x00); parts.push(...n2b(v)); }
                else { parts.push(0x01, v ? 1 : 0); }
            });
            parts.push(0x00, 0x00, 0x09);
            sendTagDirect(0x12, new Uint8Array(parts), 0);
            log('MetaData 已发送');
        }

        function sendAvcSequenceHeader() {
            if (!avcSeqHeader || avcSeqHeaderSent) return;
            const payload = new Uint8Array(5 + avcSeqHeader.byteLength);
            payload[0] = 0x17; payload[1] = 0x00;
            payload[2] = 0; payload[3] = 0; payload[4] = 0;
            payload.set(avcSeqHeader, 5);
            sendTagDirect(9, payload, 0);
            avcSeqHeaderSent = true;
            log(`AVC 序列头已发送 (${avcSeqHeader.byteLength} 字节)`);
            // 发送缓存的视频帧
            flushPendingVideoFrames();
        }

        function sendAacSequenceHeader() {
            if (!aacSeqHeader || aacSeqHeaderSent) return;
            const flags = getAudioFlags(audioSampleRate, audioChannelCount);
            const payload = new Uint8Array(2 + aacSeqHeader.byteLength);
            payload[0] = flags;
            payload[1] = 0x00;
            payload.set(aacSeqHeader, 2);
            sendTagDirect(8, payload, 0);
            aacSeqHeaderSent = true;
            log(`AAC 序列头已发送 (${aacSeqHeader.byteLength} 字节)`);
            // 发送缓存的音频帧
            flushPendingAudioFrames();
        }

        // 发送缓存的视频帧
        function flushPendingVideoFrames() {
            while (pendingVideoFrames.length > 0) {
                const frame = pendingVideoFrames.shift();
                sendTagDirect(9, buildVideoPayload(frame.data, frame.isKey), frame.dts);
            }
        }

        // 发送缓存的音频帧
        function flushPendingAudioFrames() {
            while (pendingAudioFrames.length > 0) {
                const frame = pendingAudioFrames.shift();
                sendTagDirect(8, buildAudioPayload(frame.data), frame.dts);
            }
        }

        // 构建视频帧负载（CTS=0）
        function buildVideoPayload(data, isKey) {
            const payload = new Uint8Array(5 + data.byteLength);
            payload[0] = isKey ? 0x17 : 0x27;
            payload[1] = 0x01;
            payload[2] = 0; payload[3] = 0; payload[4] = 0; // CTS=0
            payload.set(data, 5);
            return payload;
        }

        // 获取 AAC 采样率索引
        function getAacSampleRateIndex(rate) {
            const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000];
            const idx = rates.indexOf(rate);
            return idx >= 0 ? idx : 3; // 默认 48000
        }

        // 构建 ADTS 头
        function buildAdtsHeader(dataLen) {
            // 根据帧大小判断 profile：220 bytes 左右是 HE-AAC，400+ 是 AAC-LC
            const isHeAac = dataLen < 300;
            const profile = isHeAac ? 3 : 1; // 1=AAC-LC, 3=HE-AAC
            const sampleRateIdx = getAacSampleRateIndex(audioSampleRate);
            const channelConfig = 2; // 固定立体声
            const frameLength = dataLen + 7; // 7 = ADTS header size

            const adts = new Uint8Array(7);
            adts[0] = 0xFF; // Sync word
            adts[1] = isHeAac ? 0xF3 : 0xF1; // HE-AAC uses 0xF3, AAC-LC uses 0xF1
            adts[2] = ((profile & 0x03) << 6) | ((sampleRateIdx & 0x0F) << 2) | ((channelConfig >> 2) & 0x01);
            adts[3] = ((channelConfig & 0x03) << 6) | ((frameLength >> 11) & 0x03);
            adts[4] = (frameLength >> 3) & 0xFF;
            adts[5] = ((frameLength & 0x07) << 5) | 0x1F;
            adts[6] = 0xFC;
            return adts;
        }

        // 构建音频帧负载（添加ADTS头）
        function buildAudioPayload(raw) {
            let data = raw;
            // 检测并剥离 ADTS 头（如果存在）
            if (data.byteLength >= 7 && ((data[0] & 0xFF) << 4 | (data[1] >> 4)) === 0xFFF) {
                const prot = (data[1] & 0x01) === 1;
                const headLen = prot ? 7 : 9;
                if (data.byteLength > headLen) data = data.slice(headLen);
            }
            // 添加 ADTS 头
            const adts = buildAdtsHeader(data.byteLength);
            const flags = getAudioFlags(audioSampleRate, audioChannelCount);
            const payload = new Uint8Array(2 + adts.byteLength + data.byteLength);
            payload[0] = flags;
            payload[1] = 0x01; // AAC raw data
            payload.set(adts, 2);
            payload.set(data, 2 + adts.byteLength);
            return payload;
        }

        // 从 MP4 数据中提取 AAC 数据
        function extractAacFromMp4(mp4Data) {
            let aacData = null;
            
            // 解析 MP4 box
            let offset = 0;
            while (offset < mp4Data.length - 8) {
                const size = (mp4Data[offset] << 24) | (mp4Data[offset+1] << 16) | (mp4Data[offset+2] << 8) | mp4Data[offset+3];
                if (size < 8 || offset + size > mp4Data.length) break;
                
                const type = String.fromCharCode(mp4Data[offset+4], mp4Data[offset+5], mp4Data[offset+6], mp4Data[offset+7]);
                
                if (type === 'mdat') {
                    aacData = mp4Data.slice(offset + 8, offset + size);
                    break;
                }
                
                offset += size;
            }
            
            return { aacData };
        }
        
        // 直接从 AAC 原始数据构建带 ADTS 头的帧（用于 mdat 中的无 ADTS 头数据）
        function buildAacFrameWithAdts(rawData) {
            const adts = buildAdtsHeader(rawData.byteLength);
            const frame = new Uint8Array(adts.byteLength + rawData.byteLength);
            frame.set(adts, 0);
            frame.set(rawData, adts.byteLength);
            return frame;
        }
        
        // 解析 moov box
        function parseMoovBox(data, offset, size) {
            let pos = offset;
            while (pos < offset + size - 8) {
                const boxSize = (data[pos] << 24) | (data[pos+1] << 16) | (data[pos+2] << 8) | data[pos+3];
                if (boxSize < 8 || pos + boxSize > offset + size) break;
                
                const boxType = String.fromCharCode(data[pos+4], data[pos+5], data[pos+6], data[pos+7]);
                
                if (boxType === 'trak') {
                    if (parseTrakBox(data, pos + 8, boxSize - 8)) return true;
                }
                
                pos += boxSize;
            }
            return false;
        }
        
        // 解析 trak box
        function parseTrakBox(data, offset, size) {
            let pos = offset;
            while (pos < offset + size - 8) {
                const boxSize = (data[pos] << 24) | (data[pos+1] << 16) | (data[pos+2] << 8) | data[pos+3];
                if (boxSize < 8 || pos + boxSize > offset + size) break;
                
                const boxType = String.fromCharCode(data[pos+4], data[pos+5], data[pos+6], data[pos+7]);
                
                if (boxType === 'mdia') {
                    if (parseMdiaBox(data, pos + 8, boxSize - 8)) return true;
                }
                pos += boxSize;
            }
            return false;
        }
        
        // 解析 mdia box
        function parseMdiaBox(data, offset, size) {
            let pos = offset;
            while (pos < offset + size - 8) {
                const boxSize = (data[pos] << 24) | (data[pos+1] << 16) | (data[pos+2] << 8) | data[pos+3];
                if (boxSize < 8 || pos + boxSize > offset + size) break;
                
                const boxType = String.fromCharCode(data[pos+4], data[pos+5], data[pos+6], data[pos+7]);
                
                if (boxType === 'minf') {
                    if (parseMinfBox(data, pos + 8, boxSize - 8)) return true;
                }
                pos += boxSize;
            }
            return false;
        }
        
        // 解析 minf box
        function parseMinfBox(data, offset, size) {
            let pos = offset;
            while (pos < offset + size - 8) {
                const boxSize = (data[pos] << 24) | (data[pos+1] << 16) | (data[pos+2] << 8) | data[pos+3];
                if (boxSize < 8 || pos + boxSize > offset + size) break;
                
                const boxType = String.fromCharCode(data[pos+4], data[pos+5], data[pos+6], data[pos+7]);
                
                if (boxType === 'stbl') {
                    if (parseStblBox(data, pos + 8, boxSize - 8)) return true;
                }
                pos += boxSize;
            }
            return false;
        }
        
        // 解析 stbl box
        function parseStblBox(data, offset, size) {
            let pos = offset + 4 + 4; // 跳过 version/flags 和 entry_count
            if (pos >= offset + size - 8) return false;
            
            const entrySize = (data[pos] << 24) | (data[pos+1] << 16) | (data[pos+2] << 8) | data[pos+3];
            const entryType = String.fromCharCode(data[pos+4], data[pos+5], data[pos+6], data[pos+7]);
            
            if (entryType === 'mp4a') {
                return parseMp4aBox(data, pos + 8, entrySize - 8);
            }
            return false;
        }
        
        // 解析 mp4a box
        function parseMp4aBox(data, offset, size) {
            let pos = offset + 6 + 2 + 8 + 2 + 2 + 2 + 2 + 4; // 跳过 mp4a 头部字段
            while (pos < offset + size - 8) {
                const boxSize = (data[pos] << 24) | (data[pos+1] << 16) | (data[pos+2] << 8) | data[pos+3];
                if (boxSize < 8 || pos + boxSize > offset + size) break;
                
                const boxType = String.fromCharCode(data[pos+4], data[pos+5], data[pos+6], data[pos+7]);
                
                if (boxType === 'esds') {
                    return parseEsdsBox(data, pos + 8, boxSize - 8);
                }
                pos += boxSize;
            }
            return false;
        }
        
        // 解析 esds box
        function parseEsdsBox(data, offset, size) {
            let pos = offset + 4; // 跳过 version/flags
            
            // ES_Descriptor tag
            if (data[pos++] !== 0x03) return false;
            
            // 解析描述符长度
            let len = 0;
            while (pos < offset + size && (data[pos] & 0x80)) {
                len = (len << 7) | (data[pos++] & 0x7F);
            }
            if (pos < offset + size) len = (len << 7) | data[pos++];
            
            pos += 2; // ES_ID
            pos++; // flags
            
            // DecoderConfigDescriptor
            while (pos < offset + size - 2) {
                const tag = data[pos++];
                let len2 = 0;
                while (pos < offset + size && (data[pos] & 0x80)) {
                    len2 = (len2 << 7) | (data[pos++] & 0x7F);
                }
                if (pos < offset + size) len2 = (len2 << 7) | data[pos++];
                
                if (tag === 0x04) {
                    pos += 1 + 1 + 3 + 4 + 4; // 跳过各种字段
                    
                    // DecoderSpecificInfo
                    if (pos < offset + size - 2 && data[pos++] === 0x05) {
                        let infoLen = 0;
                        while (pos < offset + size && (data[pos] & 0x80)) {
                            infoLen = (infoLen << 7) | (data[pos++] & 0x7F);
                        }
                        if (pos < offset + size) infoLen = (infoLen << 7) | data[pos++];
                        
                        if (infoLen >= 2) {
                            aacSeqHeader = new Uint8Array([data[pos], data[pos+1]]);
                            log(`从 MP4 提取 AAC 序列头: ${aacSeqHeader.byteLength} 字节`);
                            sendAacSequenceHeader();
                            return true;
                        }
                    }
                }
                pos += len2;
            }
            return false;
        }
        
        // 按帧分割 AAC 数据并发送
        function splitAndSendAacFrames(aacData) {
            if (!aacData || aacData.length < 7) return;
            
            // 检查是否包含 ADTS 同步字
            let hasAdts = false;
            for (let i = 0; i < Math.min(100, aacData.length - 7); i++) {
                if (aacData[i] === 0xFF && (aacData[i+1] & 0xF0) === 0xF0) {
                    hasAdts = true;
                    break;
                }
            }
            
            log(`AAC 数据: ${aacData.length} 字节, 含ADTS头: ${hasAdts}`);
            
            if (hasAdts) {
                // 带 ADTS 头，按帧分割
                let pos = 0;
                while (pos < aacData.length - 7) {
                    // 查找 ADTS 同步字
                    if (aacData[pos] === 0xFF && (aacData[pos+1] & 0xF0) === 0xF0) {
                        const frameLength = ((aacData[pos+3] & 0x03) << 11) | (aacData[pos+4] << 3) | ((aacData[pos+5] >> 5) & 0x07);
                        
                        if (frameLength >= 7 && pos + frameLength <= aacData.length) {
                            const frame = aacData.slice(pos, pos + frameLength);
                            sendAacFrame(frame);
                            pos += frameLength;
                        } else {
                            pos++;
                        }
                    } else {
                        pos++;
                    }
                }
            } else {
                // 不带 ADTS 头：mdat 中的原始 AAC 数据，整个作为一帧
                // 直接添加 ADTS 头发送
                const frame = buildAacFrameWithAdts(aacData);
                log(`添加ADTS头后: ${frame.length} 字节`);
                sendAacFrame(frame);
            }
        }
        
        // 发送单个 AAC 帧
        function sendAacFrame(frame) {
            if (audioFrameCount === 0) {
                log(`发送音频帧 #${audioFrameCount}: ${frame.length} 字节`);
            } else if (audioFrameCount % 100 === 0) {
                log(`音频帧 #${audioFrameCount}: ${frame.length} 字节`);
            }
            
            const dts = audioDts;
            audioDts += (1024 / audioSampleRate) * 1000;
            audioFrameCount++;
            
            if (!aacSeqHeaderSent) {
                pendingAudioFrames.push({ data: frame, dts });
            } else {
                sendTagDirect(8, buildAudioPayload(frame), dts);
            }
        }
        
        // 发送 Opus 帧（需要服务端支持 Opus 转 AAC）
        function sendOpusFrame(frame) {
            log(`Opus 帧: ${frame.length} 字节`);
            // Opus 数据直接发送，标记为 Opus 类型
            // 注意：服务端 Flv2Hls.php 需要修改以支持 Opus
            const dts = audioDts;
            audioDts += (1024 / audioSampleRate) * 1000;
            audioFrameCount++;
            
            // 使用特殊的负载类型 13 表示 Opus（需服务端配合）
            sendTagDirect(8, frame, dts);
        }

        /* ========== 停止推流 ========== */
        async function stopStreaming() {
            if (!isPushing) return;
            isPushing = false;
            if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }

            if (videoEncoder) { videoEncoder.close(); videoEncoder = null; }
            if (audioEncoder) { 
                if (audioEncoder.stop) audioEncoder.stop(); 
                else audioEncoder.close(); 
                audioEncoder = null; 
            }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            previewVideo.srcObject = null;
            if (ws) { try { ws.close(); } catch (e) {} ws = null; }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            setStatus(false);
            updateStats();
            log(`推流已停止 | 视频:${videoFrameCount} 音频:${audioFrameCount}`, 'warn');
        }

        /* ========== 开始推流 ========== */
        async function startStreaming() {
            if (isPushing) return;
            updateConfig();

            // 重置状态
            videoFrameCount = 0; audioFrameCount = 0; dropCount = 0;
            avcSeqHeader = null; 
            // 设置默认 AAC 序列头（48kHz 立体声 LC-AAC）
            // 0x1190 = 0001 0001 1001 0000
            // bit[5:0]=011001=25 -> 保留
            // bit[6:8]=001=1 -> 保留
            // bit[9:12]=1001=9 -> audioObjectType=2 (AAC-LC) 的高4位
            // 0x90 = 1001 0000
            // bit[0:3]=0000=0 -> 保留
            // bit[4:7]=1001=9 -> audioObjectType=2 的低2位 + freqIdx=3 的高2位
            // 完整: audioObjectType=2(010), freqIdx=3(0011), ch=2(10)
            // ASC = 0x1190
            aacSeqHeader = new Uint8Array([0x11, 0x90]); // 48kHz 立体声 LC-AAC
            avcSeqHeaderSent = false; aacSeqHeaderSent = false;
            pendingVideoFrames = []; pendingAudioFrames = [];
            videoTimestamps = []; audioTimestamps = [];
            videoDts = 1000 / FPS;
            audioDts = (1024 / audioSampleRate) * 1000;
            lastVideoDts = -1; lastAudioDts = -1;
            streamStartPerf = 0;

            try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: WIDTH }, height: { ideal: HEIGHT }, frameRate: { ideal: FPS } },
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
                const videoTrack = stream.getVideoTracks()[0];
                const audioTrack = stream.getAudioTracks()[0] || null;
                if (!videoTrack) {
                    log('未获取到视频轨道', 'error');
                    stream.getTracks().forEach(t => t.stop());
                    return;
                }
                videoTrack.addEventListener('ended', () => stopStreaming());
                if (audioTrack) audioTrack.addEventListener('ended', () => log('音频轨道结束', 'warn'));

                previewVideo.srcObject = stream;
                await previewVideo.play();

                if (audioTrack) {
                    const s = audioTrack.getSettings();
                    audioSampleRate = s.sampleRate || 48000;  // 浏览器采集的原始采样率
                    audioChannelCount = Math.min(s.channelCount || 1, 2);
                    // 根据实际采样率计算音频步进
                    audioDts = (1024 / audioSampleRate) * 1000;
                    log(`音频采样率: ${audioSampleRate}Hz, 通道数: ${audioChannelCount}`);
                }

                const wsUrl = document.getElementById('wsUrlInput').value.trim() || DEFAULT_WS_URL;
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';

                ws.onopen = async () => {
                    isPushing = true;
                    streamStartPerf = performance.now();
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    setStatus(true);
                    log(`WebSocket 已连接: ${wsUrl}`, 'success');
                    statsTimer = setInterval(updateStats, 500);

                    // 1. 发送 FLV 头
                    sendFlvHeader();
                    // 2. 发送 MetaData
                    sendMetaData();

                    // 视频编码器
                    videoEncoder = new VideoEncoder({
                        output(chunk, meta) {
                            if (!isPushing) return;
                            if (!avcSeqHeader && meta?.decoderConfig?.description) {
                                avcSeqHeader = new Uint8Array(meta.decoderConfig.description);
                                log(`获取 AVC 序列头: ${avcSeqHeader.byteLength} 字节`);
                                // 立即发送序列头
                                sendAvcSequenceHeader();
                            }
                            const data = new Uint8Array(chunk.byteLength);
                            chunk.copyTo(data);
                            if (data.byteLength < 4) return;

                            // 使用独立时钟计算DTS（强制单调）
                            const dts = videoDts;
                            videoDts += 1000 / FPS;
                            videoFrameCount++;
                            // 记录时间戳用于漂移显示
                            if (videoFrameCount % 50 === 0 || videoFrameCount <= 30)
                                videoTimestamps.push({ frame: videoFrameCount, dts });

                            // 序列头未发送时缓存帧
                            if (!avcSeqHeaderSent) {
                                pendingVideoFrames.push({ data, isKey: chunk.type === 'key', dts });
                            } else {
                                sendTagDirect(9, buildVideoPayload(data, chunk.type === 'key'), dts);
                            }
                        },
                        error(e) { log(`视频编码错误: ${e.message}`, 'error'); }
                    });
                    videoEncoder.configure({
                        codec: 'avc1.42001F', width: WIDTH, height: HEIGHT,
                        bitrate: BITRATE, framerate: FPS, latencyMode: 'realtime'
                    });

                    // 音频编码 - 使用 MediaRecorder
                    if (audioTrack) {
                        const audioStream = new MediaStream([audioTrack]);
                        
                        // 尝试不同格式
                        let mimeType = 'audio/webm; codecs=opus';
                        if (!MediaRecorder.isTypeSupported(mimeType)) {
                            mimeType = 'audio/webm';
                            if (!MediaRecorder.isTypeSupported(mimeType)) {
                                mimeType = 'audio/aac';
                                if (!MediaRecorder.isTypeSupported(mimeType)) {
                                    mimeType = 'audio/mp4; codecs="mp4a.40.2"';
                                }
                            }
                        }
                        log(`MediaRecorder 格式: ${mimeType}`);
                        
                        const mediaRecorder = new MediaRecorder(audioStream, {
                            mimeType: mimeType,
                            audioBitsPerSecond: 128000
                        });
                        
                        let chunkCount = 0;
                        mediaRecorder.ondataavailable = (event) => {
                            chunkCount++;
                            const size = event.data?.size || 0;
                            log(`MediaRecorder 数据块 #${chunkCount}: ${size} 字节`);
                            
                            if (!isPushing || !event.data || size === 0) return;
                            
                            const reader = new FileReader();
                            reader.onload = () => {
                                const arrayBuffer = reader.result;
                                const data = new Uint8Array(arrayBuffer);
                                
                                if (mimeType.includes('opus')) {
                                    // Opus 格式：提取 Opus 数据并发送
                                    // WebM 的 Opus 数据在 SimpleBlock 中，格式为: 
                                    // [1字节Track Number][2字节时间码][2字节(含flags)][ Opus数据]
                                    // 简化处理：跳过前5字节
                                    const opusData = data.slice(5);
                                    log(`Opus 数据: ${opusData.length} 字节`);
                                    sendOpusFrame(opusData);
                                } else if (mimeType.includes('aac') || mimeType.includes('mp4')) {
                                    // AAC 格式：直接发送
                                    log(`AAC 数据: ${data.length} 字节`);
                                    splitAndSendAacFrames(data);
                                } else {
                                    log(`未知格式数据: ${data.length} 字节`);
                                }
                            };
                            reader.readAsArrayBuffer(event.data);
                        };
                        
                        mediaRecorder.onerror = (e) => {
                            log(`MediaRecorder 错误: ${e.message || e}`, 'error');
                        };
                        
                        mediaRecorder.onstart = () => {
                            log('MediaRecorder 已启动，发送 AAC 序列头');
                            sendAacSequenceHeader();
                        };
                        
                        mediaRecorder.start(100);
                        audioEncoder = mediaRecorder;
                    }

                    // 视频采集循环
                    const vp = new MediaStreamTrackProcessor({ track: videoTrack });
                    const vr = vp.readable.getReader();
                    let frameIdx = 0, lastKey = -KEYFRAME_INTERVAL;
                    (async function readVideo() {
                        try {
                            while (isPushing) {
                                const { done, value } = await vr.read();
                                if (done) break;
                                if (videoEncoder?.state === 'configured') {
                                    if (videoEncoder.encodeQueueSize < MAX_ENCODE_QUEUE) {
                                        const needKey = (frameIdx - lastKey >= KEYFRAME_INTERVAL) || frameIdx === 0;
                                        videoEncoder.encode(value, { keyFrame: needKey });
                                        if (needKey) lastKey = frameIdx;
                                        frameIdx++;
                                    } else {
                                        dropCount++;
                                    }
                                }
                                value.close();
                            }
                        } catch (e) { if (isPushing) log(`视频读取异常: ${e.message}`, 'error'); }
                    })();
                };

                ws.onerror = () => { log('WebSocket 错误', 'error'); stopStreaming(); };
                ws.onclose = (e) => {
                    log(`WebSocket 关闭 (${e.code}: ${e.reason})`, 'warn');
                    if (isPushing) stopStreaming();
                };
            } catch (e) {
                log(`启动失败: ${e.message}`, 'error');
            }
        }

        window.addEventListener('beforeunload', () => { if (isPushing) stopStreaming(); });
        window.startStreaming = startStreaming;
        window.stopStreaming = stopStreaming;
    })();
</script>
</body>
</html>
