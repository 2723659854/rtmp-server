<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>屏幕推流 - WebSocket FLV</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg:#0f0f1a; --card:#1a1a2e; --accent:#4cc9f0; --danger:#f72585; --success:#06d6a0; --text:#e0e0e0; --muted:#888; --border:#2a2a3e; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .container { width:100%; max-width:800px; background:var(--card); border-radius:16px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        .title { font-size:1.4em; font-weight:600; display:flex; align-items:center; gap:10px; }
        .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
        .dot.live { background:var(--danger); animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .btn { padding:10px 22px; border:none; border-radius:8px; font-size:0.95em; font-weight:500; cursor:pointer; }
        .btn-start { background:var(--accent); color:#000; } .btn-stop { background:var(--danger); color:#fff; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .video-wrap { background:#000; border-radius:12px; overflow:hidden; margin-bottom:20px; border:2px solid var(--border); }
        .video-wrap video { width:100%; display:block; max-height:400px; }
        .overlay { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.7); color:var(--danger); padding:4px 10px; border-radius:4px; font-size:0.75em; display:none; }
        .overlay.show { display:flex; }
        .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
        .stat-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
        .stat-card .value { font-size:1.6em; font-weight:700; font-family:monospace; }
        .stat-card .label { font-size:0.75em; color:var(--muted); margin-top:4px; text-transform:uppercase; }
        .value.video { color:var(--accent); } .value.audio { color:var(--success); } .value.time { color:#ff9f1c; }
        .settings { display:flex; gap:16px; margin-bottom:20px; padding:16px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; flex-wrap:wrap; }
        .setting { display:flex; align-items:center; gap:8px; }
        .setting label { font-size:0.85em; color:var(--muted); }
        .setting select { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
        .log-panel { background:#000; border:1px solid var(--border); border-radius:10px; padding:12px; max-height:180px; overflow-y:auto; font-family:monospace; font-size:0.7em; color:#aaa; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title"><span class="dot" id="statusDot"></span>屏幕推流</div>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-start" id="startBtn" onclick="startStreaming()">▶ 开始推流</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopStreaming()" disabled>■ 停止</button>
        </div>
    </div>
    <div class="video-wrap" style="position:relative;">
        <video id="preview" autoplay muted playsinline></video>
        <div class="overlay" id="liveBadge">🔴 LIVE</div>
    </div>
    <div class="stats">
        <div class="stat-card"><div class="value video" id="videoCount">0</div><div class="label">视频帧</div></div>
        <div class="stat-card"><div class="value audio" id="audioCount">0</div><div class="label">音频帧</div></div>
        <div class="stat-card"><div class="value time" id="elapsedTime">00:00</div><div class="label">时长</div></div>
        <div class="stat-card"><div class="value" style="color:#fff;" id="bitrate">0</div><div class="label">kbps</div></div>
    </div>
    <div class="settings">
        <div class="setting"><label>分辨率</label><select id="resSelect"><option value="854x480" selected>854×480</option><option value="1280x720">1280×720</option></select></div>
        <div class="setting"><label>帧率</label><select id="fpsSelect"><option value="20">20</option><option value="25" selected>25</option><option value="30">30</option></select></div>
        <div class="setting"><label>码率</label><select id="bitrateSelect"><option value="400">400k</option><option value="500" selected>500k</option><option value="800">800k</option></select></div>
    </div>
    <div class="log-panel" id="logPanel"></div>
</div>

<script>
    const WS_URL = 'ws://127.0.0.1:8501/a/b';
    let ws, stream, videoEncoder, audioEncoder, audioCtx;
    let isPushing = false;
    let avcConfigSent, aacConfigSent, metaSent;
    let videoChunkCount = 0, audioChunkCount = 0;
    let totalBytes = 0, statsTimer;
    let WIDTH = 854, HEIGHT = 480, FPS = 25, BITRATE = 500000;
    const KEYFRAME_INTERVAL = 125;
    const FRAME_DURATION_MS = 1000 / FPS;
    let streamStartPerf = 0;
    // ★ 各自独立的最后时间戳，强制单调递增
    let lastVideoTs = -1, lastAudioTs = -1;

    function log(msg, level='info') {
        const t = new Date().toLocaleTimeString();
        const p = document.getElementById('logPanel');
        p.innerHTML += `<div><span style="color:#555">${t}</span> <span class="log-${level}">${msg}</span></div>`;
        p.scrollTop = p.scrollHeight;
    }
    function updateConfig() {
        const [w,h] = document.getElementById('resSelect').value.split('x'); WIDTH=+w; HEIGHT=+h;
        FPS=+document.getElementById('fpsSelect').value; BITRATE=+document.getElementById('bitrateSelect').value*1000;
    }
    function updateStats() {
        document.getElementById('videoCount').textContent = videoChunkCount;
        document.getElementById('audioCount').textContent = audioChunkCount;
        if (streamStartPerf > 0) {
            const sec = Math.floor((performance.now() - streamStartPerf) / 1000);
            document.getElementById('elapsedTime').textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
            if (sec > 0) document.getElementById('bitrate').textContent = Math.floor(totalBytes * 8 / sec / 1000);
        }
    }
    function setStatus(live) {
        document.getElementById('statusDot').className = 'dot' + (live ? ' live' : '');
        document.getElementById('liveBadge').className = 'overlay' + (live ? ' show' : '');
    }
    function sendTag(type, payload, timestamp) {
        if (!isPushing || !ws || ws.readyState !== WebSocket.OPEN) return;
        const size = payload.length;
        const tag = new Uint8Array(11 + size + 4);
        tag[0] = type;
        tag[1] = (size>>16)&0xFF; tag[2] = (size>>8)&0xFF; tag[3] = size&0xFF;
        const ts = Math.max(0, Math.floor(timestamp));
        tag[4] = (ts>>16)&0xFF; tag[5] = (ts>>8)&0xFF; tag[6] = ts&0xFF; tag[7] = (ts>>24)&0xFF;
        tag[8]=0; tag[9]=0; tag[10]=0;
        tag.set(payload, 11);
        const ps = 11 + size;
        tag[ps] = (ps>>24)&0xFF; tag[ps+1] = (ps>>16)&0xFF; tag[ps+2] = (ps>>8)&0xFF; tag[ps+3] = ps&0xFF;
        ws.send(tag);
        totalBytes += tag.length;
    }
    function sendFlvHeader() { ws.send(new Uint8Array([0x46,0x4C,0x56,0x01,0x05,0x00,0x00,0x00,0x09,0x00,0x00,0x00,0x00])); }
    function sendMetaData() {
        if (metaSent) return; metaSent = true;
        function n2b(n) { const a=new Uint8Array(8); new DataView(a.buffer).setFloat64(0,n,false); return a; }
        function s2b(s) { const a=[]; for(let i=0;i<s.length;i++) a.push(s.charCodeAt(i)); return a; }
        const meta = [['duration',0],['width',WIDTH],['height',HEIGHT],['videocodecid',7],['audiocodecid',10],['audiosamplerate',44100],['audiosamplesize',16],['stereo',true],['filesize',0],['framerate',FPS]];
        const buf = [];
        buf.push(0x02,0x00,0x0A,...s2b('onMetaData'),0x03);
        for(const [k,v] of meta) { buf.push((k.length>>8)&0xFF,k.length&0xFF,...s2b(k)); if(typeof v==='number') buf.push(0x00,...n2b(v)); else if(typeof v==='boolean') buf.push(0x01,v?1:0); }
        buf.push(0x00,0x00,0x09);
        sendTag(0x12,new Uint8Array(buf),0);
    }
    function sendAACConfig(d) { if(aacConfigSent||!d) return; aacConfigSent=true; const a=new Uint8Array(d); const b=new Uint8Array(2+a.length); b[0]=0xAF;b[1]=0x00;b.set(a,2); sendTag(8,b,0); }
    function sendAvcSequenceHeader(d) { if(avcConfigSent) return; avcConfigSent=true; const b=new Uint8Array(5+d.length); b[0]=0x17;b[1]=0x00;b[2]=0;b[3]=0;b[4]=0;b.set(d,5); sendTag(9,b,0); }

    async function stopStreaming() {
        if (!isPushing) return;
        isPushing = false;
        if (videoEncoder && videoEncoder.state !== 'closed') { await videoEncoder.flush(); videoEncoder.close(); }
        if (audioEncoder && audioEncoder.state !== 'closed') { await audioEncoder.flush(); audioEncoder.close(); }
        videoEncoder = null; audioEncoder = null;
        if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
        if (audioCtx) { try { audioCtx.close(); } catch(e) {} audioCtx = null; }
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        document.getElementById('preview').srcObject = null;
        if (ws) { try { ws.close(); } catch(e) {} ws = null; }
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        setStatus(false); updateStats();
        log(`停止 V:${videoChunkCount} A:${audioChunkCount}`, 'warn');
    }

    function resampleAudio(rawTrack) {
        const ctx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:44100}); audioCtx = ctx;
        const src = ctx.createMediaStreamSource(new MediaStream([rawTrack]));
        const merger = ctx.createChannelMerger(2);
        try { const s=ctx.createChannelSplitter(2); src.connect(s); s.connect(merger,0,0); s.connect(merger,1,1); } catch(e) { src.connect(merger,0,0); }
        const dest = ctx.createMediaStreamDestination(); merger.connect(dest);
        return dest.stream.getAudioTracks()[0];
    }

    async function startStreaming() {
        if (isPushing) return;
        updateConfig();
        try {
            log('获取屏幕...', 'info');
            stream = await navigator.mediaDevices.getDisplayMedia({
                video:{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:FPS}}, audio:true
            });
            const videoTrack = stream.getVideoTracks()[0];
            const rawAudioTrack = stream.getAudioTracks()[0] || null;
            stream.getVideoTracks()[0].addEventListener('ended', stopStreaming);
            let processedAudioTrack = rawAudioTrack ? resampleAudio(rawAudioTrack) : null;
            document.getElementById('preview').srcObject = stream;
            await new Promise(r => document.getElementById('preview').onloadedmetadata = r);

            videoChunkCount = 0; audioChunkCount = 0; totalBytes = 0;
            avcConfigSent = false; aacConfigSent = false; metaSent = false;
            lastVideoTs = -1; lastAudioTs = -1;
            streamStartPerf = performance.now();

            ws = new WebSocket(WS_URL); ws.binaryType = 'arraybuffer';

            ws.onopen = async () => {
                log('WS 连接', 'success');
                isPushing = true;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                setStatus(true);
                statsTimer = setInterval(updateStats, 500);

                sendFlvHeader();
                sendMetaData();

                videoEncoder = new VideoEncoder({
                    output(chunk, meta) {
                        const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                        if (meta?.decoderConfig?.description && !avcConfigSent) sendAvcSequenceHeader(new Uint8Array(meta.decoderConfig.description));
                        if (data.length > 0) {
                            videoChunkCount++;
                            // ★ 视频：帧序号 × 帧间隔，保证严格递增
                            const ts = videoChunkCount * FRAME_DURATION_MS;
                            sendTag(9, buildVideoBody(data, chunk.type === 'key'), ts);
                        }
                    },
                    error(e) { log(`V错误: ${e.message}`, 'error'); }
                });
                videoEncoder.configure({codec:'avc1.42001F',width:WIDTH,height:HEIGHT,bitrate:BITRATE,framerate:FPS,latencyMode:'realtime'});

                if (processedAudioTrack) {
                    audioEncoder = new AudioEncoder({
                        output(chunk, meta) {
                            if (meta?.decoderConfig?.description && !aacConfigSent) sendAACConfig(meta.decoderConfig.description);
                            const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                            if (data.length > 0) {
                                audioChunkCount++;
                                // ★ 音频：帧序号 × AAC帧间隔，保证严格递增
                                const ts = audioChunkCount * (1024 / 44100 * 1000);
                                sendTag(8, buildAudioBody(data), ts);
                            }
                        },
                        error(e) { log(`A错误: ${e.message}`, 'error'); }
                    });
                    audioEncoder.configure({codec:'mp4a.40.2',sampleRate:44100,numberOfChannels:2,bitrate:128000});
                }

                const vp = new MediaStreamTrackProcessor({track: videoTrack});
                const vr = vp.readable.getReader();
                let fc = 0, lkf = -KEYFRAME_INTERVAL;
                (async () => { while(isPushing){ const {done,value}=await vr.read(); if(done) break; try{ const kf=(fc-lkf>=KEYFRAME_INTERVAL); videoEncoder.encode(value,{keyFrame:kf||fc===0}); if(kf||fc===0) lkf=fc; fc++; } catch(e){} finally{value.close();} } })();

                if (processedAudioTrack) {
                    const ap = new MediaStreamTrackProcessor({track:processedAudioTrack});
                    const ar = ap.readable.getReader();
                    (async () => { while(isPushing){ const {done,value}=await ar.read(); if(done) break; try{audioEncoder.encode(value);}catch(e){} finally{value.close();} } })();
                }
            };

            ws.onerror = () => stopStreaming();
            ws.onclose = (e) => { if(isPushing) stopStreaming(); };

        } catch(e) { log(`失败: ${e.message}`, 'error'); stopStreaming(); }
    }

    // ★ 辅助函数：构建视频/音频 body
    function buildVideoBody(data, isKey) {
        const b = new Uint8Array(5 + data.length);
        b[0] = isKey ? 0x17 : 0x27; b[1] = 0x01; b[2]=0;b[3]=0;b[4]=0;
        b.set(data, 5); return b;
    }
    function buildAudioBody(data) {
        const b = new Uint8Array(2 + data.length);
        b[0] = 0xAF; b[1] = 0x01;
        b.set(data, 2); return b;
    }

    window.addEventListener('beforeunload', stopStreaming);
    log('页面就绪', 'info');
</script>
</body>
</html>
