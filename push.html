<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>屏幕推流</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg:#0f0f1a; --card:#1a1a2e; --accent:#4cc9f0; --danger:#f72585; --success:#06d6a0; --text:#e0e0e0; --muted:#888; --border:#2a2a3e; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .container { width:100%; max-width:900px; background:var(--card); border-radius:16px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
        .title { font-size:1.4em; font-weight:600; }
        .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); display:inline-block; margin-right:8px; }
        .dot.live { background:var(--danger); animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .btn { padding:10px 22px; border:none; border-radius:8px; font-size:0.95em; font-weight:500; cursor:pointer; }
        .btn-start { background:var(--accent); color:#000; } .btn-stop { background:var(--danger); color:#fff; } .btn-dump { background:var(--success); color:#000; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .video-wrap { background:#000; border-radius:12px; overflow:hidden; margin-bottom:20px; border:2px solid var(--border); position:relative; }
        .video-wrap video { width:100%; display:block; max-height:400px; }
        .overlay { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.7); color:var(--danger); padding:4px 10px; border-radius:4px; font-size:0.75em; display:none; }
        .overlay.show { display:flex; }
        .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px; }
        .stat-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
        .stat-card .value { font-size:1.4em; font-weight:700; font-family:monospace; }
        .stat-card .label { font-size:0.7em; color:var(--muted); margin-top:4px; text-transform:uppercase; }
        .value.video { color:var(--accent); } .value.audio { color:var(--success); } .value.time { color:#ff9f1c; }
        .settings { display:flex; gap:16px; margin-bottom:20px; padding:16px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; flex-wrap:wrap; }
        .setting { display:flex; align-items:center; gap:8px; }
        .setting label { font-size:0.85em; color:var(--muted); }
        .setting select { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
        .log-panel { background:#000; border:1px solid var(--border); border-radius:10px; padding:12px; max-height:200px; overflow-y:auto; font-family:monospace; font-size:0.7em; color:#aaa; }
        .log-warn { color:#ff9f1c; } .log-error { color:#f72585; } .log-success { color:#06d6a0; }

        /* ★ 页脚提示 */
        .footer-notice {
            margin-top: 24px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            font-size: 0.72em;
            color: #666;
            line-height: 1.5;
            text-align: center;
        }
        .footer-notice strong {
            color: #ff9f1c;
        }
        .footer-notice .protocol-tag {
            display: inline-block;
            background: rgba(76, 201, 240, 0.12);
            color: var(--accent);
            padding: 1px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.95em;
            margin: 0 2px;
        }
        .footer-notice .client-tag {
            display: inline-block;
            background: rgba(6, 214, 160, 0.08);
            color: var(--success);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.9em;
            margin: 0 2px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title"><span class="dot" id="statusDot"></span>屏幕推流</div>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-start" id="startBtn" onclick="startStreaming()">▶ 开始推流</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopStreaming()" disabled>■ 停止</button>
            <button class="btn btn-dump" id="dumpBtn" onclick="dumpTimestamps()" disabled>📊 导出时间戳</button>
        </div>
    </div>
    <div class="video-wrap">
        <video id="preview" autoplay muted playsinline></video>
        <div class="overlay" id="liveBadge">🔴 LIVE</div>
    </div>
    <div class="stats">
        <div class="stat-card"><div class="value video" id="videoCount">0</div><div class="label">视频帧</div></div>
        <div class="stat-card"><div class="value audio" id="audioCount">0</div><div class="label">音频帧</div></div>
        <div class="stat-card"><div class="value warn" id="dropCount">0</div><div class="label">丢弃帧</div></div>
        <div class="stat-card"><div class="value time" id="elapsedTime">00:00</div><div class="label">时长</div></div>
        <div class="stat-card"><div class="value" style="color:#fff;" id="avDrift">0ms</div><div class="label">AV漂移</div></div>
    </div>
    <div class="settings">
        <div class="setting"><label>分辨率</label><select id="resSelect"><option value="640x360" selected>640×360</option><option value="854x480">854×480</option></select></div>
        <div class="setting"><label>帧率</label><select id="fpsSelect"><option value="10">10</option><option value="15" selected>15</option><option value="20">20</option></select></div>
        <div class="setting"><label>码率</label><select id="bitrateSelect"><option value="300">300k</option><option value="500" selected>500k</option><option value="800">800k</option></select></div>
    </div>
    <div class="log-panel" id="logPanel"></div>
    <!-- ★ 页脚轻量提示 -->
    <div class="footer-notice">
        <p>
            本项目支持 <span class="protocol-tag">WS-FLV</span> 协议推流。
             <strong>因浏览器端性能限制，存在视频帧编码延迟</strong>，可能存在轻微音视频不同步，所以建议使用低帧率和低分辨率推流。
            生产环境请使用 <span class="client-tag">OBS</span> <span class="client-tag">FFmpeg</span> <span class="client-tag">PHP 客户端</span> 推流。
        </p>
    </div>
</div>

<script>
    const WS_URL = 'ws://127.0.0.1:8501/a/b';
    const MAX_ENCODE_QUEUE = 3;
    const MAX_WS_BUFFER = 2 * 1024 * 1024;
    const KEYFRAME_INTERVAL = 50;

    let ws, stream, videoEncoder, audioEncoder;
    let isPushing = false;
    let avcConfigSent = false, aacConfigSent = false, metaSent = false;
    let videoChunkCount = 0, audioChunkCount = 0, dropCount = 0;
    let totalBytes = 0, statsTimer;
    let WIDTH = 640, HEIGHT = 360, FPS = 15, BITRATE = 500000;
    let streamStartPerf = 0;

    // 统一时钟映射
    let pageBaseUs = null;
    let videoMediaBase = null;
    let audioMediaBase = null;

    // 时间戳日志
    let videoTimestamps = [], audioTimestamps = [];

    function log(msg, level = 'info') {
        const t = new Date().toLocaleTimeString();
        const p = document.getElementById('logPanel');
        const cssClass = level === 'warn' ? 'log-warn' : level === 'error' ? 'log-error' : level === 'success' ? 'log-success' : 'log-info';
        p.innerHTML += `<div><span style="color:#555">${t}</span> <span class="${cssClass}">${msg}</span></div>`;
        p.scrollTop = p.scrollHeight;
    }

    function updateConfig() {
        const [w, h] = document.getElementById('resSelect').value.split('x');
        WIDTH = +w; HEIGHT = +h;
        FPS = +document.getElementById('fpsSelect').value;
        BITRATE = +document.getElementById('bitrateSelect').value * 1000;
    }

    function updateStats() {
        document.getElementById('videoCount').textContent = videoChunkCount;
        document.getElementById('audioCount').textContent = audioChunkCount;
        document.getElementById('dropCount').textContent = dropCount;
        if (videoTimestamps.length > 0 && audioTimestamps.length > 0) {
            const lastV = videoTimestamps[videoTimestamps.length-1];
            const lastA = audioTimestamps[audioTimestamps.length-1];
            const drift = lastA.dts - lastV.dts;
            document.getElementById('avDrift').textContent = `${drift>0?'+':''}${drift.toFixed(0)}ms`;
            document.getElementById('avDrift').style.color = Math.abs(drift) > 200 ? 'var(--danger)' : '#fff';
        }
        if (streamStartPerf > 0) {
            const sec = Math.floor((performance.now() - streamStartPerf) / 1000);
            document.getElementById('elapsedTime').textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
        }
    }

    function setStatus(live) {
        document.getElementById('statusDot').className = 'dot' + (live ? ' live' : '');
        document.getElementById('liveBadge').className = 'overlay' + (live ? ' show' : '');
    }

    function getUnifiedVideoPts(hardwareTsUs) {
        if (pageBaseUs === null) pageBaseUs = performance.now() * 1000;
        if (videoMediaBase === null) videoMediaBase = hardwareTsUs;
        return pageBaseUs + (hardwareTsUs - videoMediaBase);
    }

    function getUnifiedAudioPts(hardwareTsUs) {
        if (pageBaseUs === null) pageBaseUs = performance.now() * 1000;
        if (audioMediaBase === null) audioMediaBase = hardwareTsUs;
        return pageBaseUs + (hardwareTsUs - audioMediaBase);
    }

    function dumpTimestamps() {
        if (videoTimestamps.length === 0 && audioTimestamps.length === 0) return;
        let csv = 'Type,Frame,DTS(ms),RealTime(ms),Details\n';
        let all = [];
        videoTimestamps.forEach(v => all.push({type:'VIDEO', frame:v.frame, dts:v.dts, time:v.time, details:v.type||''}));
        audioTimestamps.forEach(a => all.push({type:'AUDIO', frame:a.frame, dts:a.dts, time:a.time, details:''}));
        all.sort((a,b)=>a.time-b.time);
        all.forEach(t => csv += `${t.type},${t.frame},${t.dts.toFixed(2)},${t.time.toFixed(1)},${t.details}\n`);
        const blob = new Blob([csv], {type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `timestamps_hardware_${new Date().toISOString().replace(/[:.]/g,'-')}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        log(`📊 导出: ${all.length}条`, 'success');
    }

    function sendTag(type, payload, timestampMs) {
        if (!isPushing || !ws || ws.readyState !== WebSocket.OPEN) return false;
        if (ws.bufferedAmount > MAX_WS_BUFFER && type === 9) { dropCount++; return false; }
        const size = payload.length;
        const tag = new Uint8Array(11 + size + 4);
        tag[0] = type;
        tag[1] = (size >> 16) & 0xFF;
        tag[2] = (size >> 8) & 0xFF;
        tag[3] = size & 0xFF;
        const ts = Math.floor(timestampMs);
        tag[4] = (ts >> 16) & 0xFF;
        tag[5] = (ts >> 8) & 0xFF;
        tag[6] = ts & 0xFF;
        tag[7] = (ts >> 24) & 0xFF;
        tag[8] = 0; tag[9] = 0; tag[10] = 0;
        tag.set(payload, 11);
        const prevTagSize = 11 + size;
        tag[prevTagSize] = (prevTagSize >> 24) & 0xFF;
        tag[prevTagSize+1] = (prevTagSize >> 16) & 0xFF;
        tag[prevTagSize+2] = (prevTagSize >> 8) & 0xFF;
        tag[prevTagSize+3] = prevTagSize & 0xFF;
        ws.send(tag.buffer);
        totalBytes += tag.length;
        return true;
    }

    function sendFlvHeader() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(new Uint8Array([0x46,0x4C,0x56,0x01,0x05,0x00,0x00,0x00,0x09,0x00,0x00,0x00,0x00]).buffer);
        log(`[FLV] 发送FLV头部`, 'info');
    }

    function sendMetaData(sr) {
        if (metaSent || !isPushing) return;
        metaSent = true;
        const n2b = n => { const a = new Uint8Array(8); new DataView(a.buffer).setFloat64(0,n,false); return Array.from(a); };
        const s2b = s => Array.from(new TextEncoder().encode(s));
        const buf = [];
        buf.push(0x02,0x00,0x0A,...s2b('onMetaData'),0x03);
        [['duration',0],['width',WIDTH],['height',HEIGHT],['videocodecid',7],['audiocodecid',10],['audiosamplerate',sr],['audiosamplesize',16],['stereo',true],['filesize',0],['framerate',FPS]].forEach(([k,v])=>{
            buf.push((k.length>>8)&0xFF, k.length&0xFF, ...s2b(k));
            if(typeof v==='number') buf.push(0x00, ...n2b(v));
            else buf.push(0x01, v?1:0);
        });
        buf.push(0x00,0x00,0x09);
        sendTag(0x12, new Uint8Array(buf), 0);
        log(`[Meta] 发送元数据: ${WIDTH}x${HEIGHT} ${FPS}fps ${sr}Hz`, 'info');
    }

    function sendAACConfig(desc) {
        if (aacConfigSent || !desc || !isPushing) return;
        aacConfigSent = true;
        const d = new Uint8Array(desc), b = new Uint8Array(2+d.length);
        b[0]=0xAF; b[1]=0x00; b.set(d,2);
        sendTag(8, b, 0);
        log(`[Audio] 发送AAC配置帧: ${d.length}字节`, 'info');
    }

    function sendAvcSequenceHeader(desc) {
        if (avcConfigSent || !isPushing) return;
        avcConfigSent = true;
        const d = new Uint8Array(desc), b = new Uint8Array(5+d.length);
        b[0]=0x17; b[1]=0x00; b[2]=0; b[3]=0; b[4]=0; b.set(d,5);
        sendTag(9, b, 0);
        log(`[Video] 发送AVC序列头: ${d.length}字节`, 'info');
    }

    function buildVideoBody(data, isKey) {
        const b = new Uint8Array(5+data.length);
        b[0]=isKey?0x17:0x27; b[1]=0x01; b[2]=0; b[3]=0; b[4]=0;
        b.set(data,5);
        return b;
    }

    function buildAudioBody(data) {
        const b = new Uint8Array(2+data.length);
        b[0]=0xAF; b[1]=0x01; b.set(data,2);
        return b;
    }

    async function stopStreaming() {
        if (!isPushing) return;
        isPushing = false;
        if (videoEncoder) {
            try { if(videoEncoder.state==='configured') await videoEncoder.flush(); videoEncoder.close(); } catch(e) {}
            videoEncoder = null;
        }
        if (audioEncoder) {
            try { if(audioEncoder.state==='configured') await audioEncoder.flush(); audioEncoder.close(); } catch(e) {}
            audioEncoder = null;
        }
        if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
        if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
        document.getElementById('preview').srcObject = null;
        if (ws) { try{ws.close();}catch(e){} ws = null; }
        pageBaseUs = null; videoMediaBase = null; audioMediaBase = null;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('dumpBtn').disabled = false;
        setStatus(false);
        updateStats();
        log(`已停止 | V:${videoChunkCount} A:${audioChunkCount}`, 'warn');
    }

    async function startStreaming() {
        if (isPushing) return;
        updateConfig();
        pageBaseUs = null; videoMediaBase = null; audioMediaBase = null;
        videoTimestamps = []; audioTimestamps = [];
        videoChunkCount = 0; audioChunkCount = 0; dropCount = 0; totalBytes = 0;
        avcConfigSent = false; aacConfigSent = false; metaSent = false;
        streamStartPerf = 0;

        try {
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: { width:{ideal:WIDTH}, height:{ideal:HEIGHT}, frameRate:{ideal:FPS} },
                audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
            });
            const videoTrack = stream.getVideoTracks()[0];
            const audioTrack = stream.getAudioTracks()[0] || null;
            if (!videoTrack) return log('未获取到视频轨道','error');

            videoTrack.addEventListener('ended', ()=>{ stopStreaming(); });
            if (audioTrack) audioTrack.addEventListener('ended', ()=>log('音频轨道结束','warn'));

            const previewVideo = document.getElementById('preview');
            previewVideo.srcObject = stream;
            await previewVideo.play();

            log(`视频: ${videoTrack.getSettings().width}x${videoTrack.getSettings().height} ${FPS}fps`, 'info');
            let audioSampleRate = 44100;
            if (audioTrack) audioSampleRate = audioTrack.getSettings().sampleRate || 48000;

            streamStartPerf = performance.now();
            ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';

            ws.onopen = async () => {
                isPushing = true;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('dumpBtn').disabled = true;
                setStatus(true);
                log(`[WS] 连接已建立 | URL: ${WS_URL}`, 'success');
                statsTimer = setInterval(updateStats, 500);
                sendFlvHeader();
                sendMetaData(audioSampleRate);

                // 视频编码器
                videoEncoder = new VideoEncoder({
                    output(chunk, meta) {
                        if (!isPushing) return;
                        if (!avcConfigSent && meta?.decoderConfig?.description) sendAvcSequenceHeader(meta.decoderConfig.description);
                        const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                        if (data.length > 0) {
                            videoChunkCount++;
                            const ptsMs = getUnifiedVideoPts(chunk.timestamp) / 1000;
                            if (videoChunkCount <= 100 || videoChunkCount % 50 === 0)
                                videoTimestamps.push({frame:videoChunkCount, dts:ptsMs, type:chunk.type, time:performance.now()-streamStartPerf});
                            sendTag(9, buildVideoBody(data, chunk.type==='key'), ptsMs);
                        }
                    },
                    error(e) { log(`视频编码错误: ${e.message}`, 'error'); }
                });
                videoEncoder.configure({ codec:'avc1.42001F', width:WIDTH, height:HEIGHT, bitrate:BITRATE, framerate:FPS, latencyMode:'realtime' });

                // 音频编码器
                if (audioTrack) {
                    audioEncoder = new AudioEncoder({
                        output(chunk, meta) {
                            if (!isPushing) return;
                            if (!aacConfigSent && meta?.decoderConfig?.description) sendAACConfig(meta.decoderConfig.description);
                            const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
                            if (data.length > 0) {
                                audioChunkCount++;
                                const ptsMs = getUnifiedAudioPts(chunk.timestamp) / 1000;
                                if (audioChunkCount <= 100 || audioChunkCount % 50 === 0)
                                    audioTimestamps.push({frame:audioChunkCount, dts:ptsMs, time:performance.now()-streamStartPerf});
                                sendTag(8, buildAudioBody(data), ptsMs);
                            }
                        },
                        error(e) { log(`音频编码错误: ${e.message}`, 'error'); }
                    });
                    const as = audioTrack.getSettings();
                    audioEncoder.configure({ codec:'mp4a.40.2', sampleRate:as.sampleRate||48000, numberOfChannels:Math.min(as.channelCount||2,2), bitrate:128000 });
                }

                // 视频采集（无主动帧率控制，依赖硬件节奏）
                const vp = new MediaStreamTrackProcessor({ track: videoTrack });
                const vr = vp.readable.getReader();
                let frameCount = 0, lastKeyFrame = -KEYFRAME_INTERVAL;
                (async function readVideo() {
                    try {
                        while (isPushing) {
                            const { done, value } = await vr.read();
                            if (done) break;
                            if (videoEncoder?.state === 'configured') {
                                if (videoEncoder.encodeQueueSize < MAX_ENCODE_QUEUE) {
                                    const isKey = (frameCount - lastKeyFrame >= KEYFRAME_INTERVAL) || frameCount === 0;
                                    videoEncoder.encode(value, { keyFrame: isKey });
                                    if (isKey) lastKeyFrame = frameCount;
                                    frameCount++;
                                } else {
                                    dropCount++;
                                }
                            }
                            value.close();
                        }
                    } catch(e) { if(isPushing) log(`视频异常: ${e.message}`,'error'); }
                })();

                // 音频采集
                if (audioTrack && audioEncoder) {
                    const ap = new MediaStreamTrackProcessor({ track: audioTrack });
                    const ar = ap.readable.getReader();
                    (async function readAudio() {
                        try {
                            while (isPushing) {
                                const { done, value } = await ar.read();
                                if (done) break;
                                if (audioEncoder?.state === 'configured') audioEncoder.encode(value);
                                value.close();
                            }
                        } catch(e) { if(isPushing) log(`音频异常: ${e.message}`,'error'); }
                    })();
                }
            };

            ws.onerror = (e) => { log(`[WS] 连接错误`, 'error'); stopStreaming(); };
            ws.onclose = (e) => {
                log(`[WS] 连接关闭 | 代码:${e.code} | 原因:${e.reason}`, 'warn');
                if(isPushing) stopStreaming();
            };

        } catch(e) { log(`启动失败: ${e.message}`,'error'); }
    }

    window.addEventListener('beforeunload', ()=>{ if(isPushing) stopStreaming(); });
</script>
</body>
</html>
