<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 拉流播放（流畅版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 15px; font-size: 0.9em; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .settings { display: flex; gap: 16px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; padding: 10px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 6px; }
        .setting { display: flex; align-items: center; gap: 6px; }
        .setting label { color: #888; font-size: 0.85em; }
        .setting input, .setting select { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #e0e0e0; font-size: 0.9em; }
        .setting input:focus, .setting select:focus { outline: none; border-color: #4cc9f0; }
        .mode-tip { padding: 8px 12px; margin-bottom: 15px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 6px; font-size: 0.85em; color: #4cc9f0; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95em; cursor: pointer; font-weight: 500; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-start { background: #4cc9f0; color: #000; }
        .btn-stop { background: #f72585; color: #fff; }
        .status { padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .status.idle { background: #1a1a2e; color: #666; }
        .status.connecting { background: #2a1a0a; color: #ff9f1c; }
        .status.playing { background: #0a2a1a; color: #06d6a0; }
        .status.failed { background: #2a0a0a; color: #f72585; }
        .video-box { background: #000; border: 1px solid #2a2a3e; border-radius: 8px; padding: 8px; margin-bottom: 10px; display: flex; justify-content: center; }
        .video-box video { width: 100%; max-height: 400px; border-radius: 4px; background: #111; }
        /* 日志 - 限制最大条数 + 滚动 */
        .log-box { background: #000; border: 1px solid #2a2a3e; border-radius: 8px; padding: 8px 12px; margin-top: 15px; max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.75em; line-height: 1.6; color: #aaa; }
        .log-box .time { color: #555; }
        .log-box .info { color: #ccc; }
        .log-box .warn { color: #ff9f1c; }
        .log-box .success { color: #06d6a0; }
        .log-box .error { color: #f72585; }
        /* 简化的状态面板 */
        .stats-mini { display: flex; gap: 16px; padding: 8px 12px; margin-top: 10px; background: #111; border-radius: 6px; font-size: 0.75em; color: #666; flex-wrap: wrap; }
        .stats-mini span { display: flex; align-items: center; gap: 4px; }
        .stats-mini .val { color: #4cc9f0; font-weight: bold; }
        .stats-mini .val.audio { color: #06d6a0; }
        /* DataChannel 聊天（纯文本，追加式渲染，不整页重排） */
        .chat-box { margin-top: 15px; background: #000; border: 1px solid #2a2a3e; border-radius: 8px; overflow: hidden; }
        .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1a1a2e; border-bottom: 1px solid #2a2a3e; font-size: 0.85em; color: #aaa; }
        .dc-state { color: #ff9f1c; }
        .dc-state.open { color: #06d6a0; }
        .chat-list { height: 170px; overflow-y: auto; padding: 8px 12px; font-size: 0.82em; line-height: 1.6; }
        .chat-msg { white-space: pre-wrap; word-break: break-word; }
        .chat-msg.self { color: #4cc9f0; }
        .chat-msg.recv { color: #e0e0e0; }
        .chat-msg.ack { color: #666; }
        .chat-msg.sys { color: #ff9f1c; }
        .chat-input-row { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #2a2a3e; }
        .chat-input-row input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #e0e0e0; font-size: 0.9em; }
        .chat-input-row input:focus { outline: none; border-color: #4cc9f0; }
        .chat-input-row .btn { padding: 8px 16px; font-size: 0.9em; }
    </style>
</head>
<body>
<div class="container">
    <h1>📥 拉流播放</h1>
    <p class="subtitle">房间 <span id="roomIdDisplay">stream_001</span></p>
    <div class="controls">
        <button class="btn btn-start" id="btnStart" onclick="startPlay()">▶ 开始观看</button>
        <button class="btn btn-stop" id="btnStop" onclick="stopPlay()" disabled>■ 停止</button>
    </div>
    <div class="settings">
        <div class="setting">
            <label>传输模式</label>
            <select id="transModeSelect" onchange="onTransModeChange()">
                <option value="both" selected>媒体+聊天</option>
                <option value="media">仅媒体</option>
                <option value="chat">仅聊天</option>
            </select>
        </div>
        <div class="setting">
            <label>信令</label>
            <input type="text" id="wsUrlInput" style="width:220px;">
        </div>
        <div class="setting">
            <label>房间</label>
            <input type="text" id="roomIdInput" value="stream_001" style="width:120px;">
        </div>
    </div>
    <div class="status idle" id="status">⚪ 空闲</div>
    <div class="mode-tip" id="modeDisplay">当前传输模式：媒体+聊天</div>
    <div class="video-box" id="videoBox"><video id="remoteVideo" autoplay playsinline></video></div>
    <!-- 精简统计 -->
    <div class="stats-mini" id="statsMini">
        <span>📹 视频: <span class="val" id="svPkts">0</span> 包</span>
        <span>🔊 音频: <span class="val audio" id="saPkts">0</span> 包</span>
        <span>⏱️ <span id="sTime">00:00</span></span>
        <span>📊 <span id="sBitrate">0</span> kbps</span>
    </div>
    <div class="chat-box">
        <div class="chat-head">
            <span>💬 DataChannel 聊天</span>
            <span class="dc-state" id="dcState">未连接</span>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" maxlength="500" autocomplete="off" placeholder="输入消息，回车发送（走 DataChannel）">
            <button class="btn btn-start" type="button" onclick="sendChat()">发送</button>
        </div>
    </div>
    <div class="log-box" id="logBox"></div>
</div>

<script>
    const DEFAULT_ROOM_ID = 'stream_001';
    const DEFAULT_WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
    let ROOM_ID = DEFAULT_ROOM_ID;

    let pc = null, ws = null;
    let isPlaying = false, joined = false;
    let _rendered = false;
    let _pendingStream = null;
    let _hasVideoTrack = false;
    let _statsTimer = null, _statsCounter = 0;
    let _startTime = 0;
    let _logBuffer = [], _logTimer = null;
    const stunHost = window.location.hostname;

    // ========== 传输模式 ==========
    // both : 媒体+聊天（默认，接收音视频并建立 DataChannel）
    // media: 仅媒体（只接收音视频，不建 DataChannel）
    // chat : 仅聊天（只建 DataChannel，不加音视频 transceiver、不渲染视频）
    const MODE_LABELS = {
        both: '媒体+聊天（音视频 + DataChannel）',
        media: '仅媒体（只收音视频，不建 DataChannel）',
        chat: '仅聊天（只建 DataChannel，不接收/渲染音视频）',
    };
    let CURRENT_MODE = 'both';
    function readTransMode() {
        const el = $('transModeSelect');
        const v = el ? el.value : 'both';
        return (v === 'media' || v === 'chat') ? v : 'both';
    }
    function modeLabel(mode) { return MODE_LABELS[mode] || MODE_LABELS.both; }
    function setModeDisplay(mode) {
        const el = $('modeDisplay');
        if (el) el.textContent = '当前传输模式：' + modeLabel(mode);
    }
    function applyModeUi(mode) {
        setModeDisplay(mode);
        const chatOnly = mode === 'chat';
        if ($('videoBox')) $('videoBox').style.display = chatOnly ? 'none' : '';
        if ($('statsMini')) $('statsMini').style.display = chatOnly ? 'none' : '';
        const mediaOnly = mode === 'media';
        const input = $('chatInput');
        const btn = input ? input.parentElement.querySelector('button') : null;
        if (input) {
            input.disabled = mediaOnly;
            input.placeholder = mediaOnly ? '仅媒体模式不建立 DataChannel' : '输入消息，回车发送（走 DataChannel）';
        }
        if (btn) btn.disabled = mediaOnly;
        if (mediaOnly) setDcState('未启用（仅媒体模式）', false);
    }
    function onTransModeChange() {
        const mode = readTransMode();
        applyModeUi(mode);
        if (ws || pc) {
            log(`传输模式已切换为「${modeLabel(mode)}」，下次开始观看生效`, 'warn');
        } else {
            log(`传输模式：${modeLabel(mode)}（下次开始观看生效）`, 'info');
        }
    }

    // ========== DataChannel 聊天 ==========
    // label / ordered / id 必须与服务端建链约定一致：sid=0，文本消息 PPID=51
    const DC_LABEL = 'chat';
    const CHAT_MAX_MESSAGES = 80;
    let dc = null;

    function chatAppend(text, cls) {
        const list = $('chatList');
        if (!list) return;
        const row = document.createElement('div');
        row.className = 'chat-msg' + (cls ? ' ' + cls : '');
        row.textContent = text;
        list.appendChild(row);
        // 只删最旧的一条，避免整列表重排
        while (list.children.length > CHAT_MAX_MESSAGES) list.removeChild(list.firstChild);
        list.scrollTop = list.scrollHeight;
    }
    function chatSystem(text) { chatAppend(text, 'sys'); }
    function setDcState(text, open) {
        const el = $('dcState');
        if (!el) return;
        el.textContent = text;
        el.className = 'dc-state' + (open ? ' open' : '');
    }
    function bindDataChannel(channel) {
        dc = channel;
        channel.onopen = () => {
            setDcState('已连接', true);
            log('DataChannel 已打开', 'success');
            chatSystem('DataChannel 已建立，可以聊天');
            if (CURRENT_MODE === 'chat') {
                isPlaying = true;
                setStatus('✅ 聊天已连接（仅 DataChannel）', 'playing');
            }
        };
        channel.onclose = () => {
            setDcState('已关闭', false);
            chatSystem('DataChannel 已关闭');
        };
        channel.onerror = () => {
            setDcState('错误', false);
            chatSystem('DataChannel 出错');
        };
        channel.onmessage = (event) => {
            const data = event.data;
            if (typeof data !== 'string') {
                chatSystem('收到二进制消息（' + (data.byteLength || data.size || '?') + 'B）');
                return;
            }
            if (data.indexOf('服务器收到：') === 0) {
                chatAppend(data, 'ack');
                return;
            }
            chatAppend(data, 'recv');
        };
    }
    function sendChat() {
        const input = $('chatInput');
        const text = (input.value || '').trim();
        if (!text) return;
        if (CURRENT_MODE === 'media') { chatSystem('仅媒体模式，未建立 DataChannel'); return; }
        if (!dc || dc.readyState !== 'open') { chatSystem('DataChannel 未就绪，无法发送'); return; }
        if (text.length > 500) { chatSystem('消息过长（上限 500 字符）'); return; }
        if (dc.bufferedAmount > 1048576) { chatSystem('发送缓冲积压，稍后再试'); return; }
        try {
            dc.send(text);
            chatAppend(text, 'self');
            input.value = '';
        } catch (e) {
            chatSystem('发送失败: ' + e.message);
        }
    }
    $('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendChat(); }
    });

    // ========== 批量日志 ==========
    function log(msg, level='info') {
        const t = new Date().toLocaleTimeString();
        const cls = level === 'warn' ? 'warn' : level === 'error' ? 'error' : level === 'success' ? 'success' : '';
        _logBuffer.push(`<div><span class="time">${t}</span> <span class="${cls}">${msg}</span></div>`);
        if (_logBuffer.length > 5) flushLog();
        if (!_logTimer) _logTimer = setTimeout(flushLog, 200);
    }

    function flushLog() {
        if (_logBuffer.length === 0) return;
        const p = $('logBox');
        p.innerHTML += _logBuffer.join('');
        _logBuffer = [];
        p.scrollTop = p.scrollHeight;
        // 限制日志条数，防止 DOM 膨胀
        while (p.children.length > 100) {
            p.removeChild(p.firstChild);
        }
        _logTimer = null;
    }

    function $(id) { return document.getElementById(id); }

    function setStatus(text, state) {
        const el = $('status');
        el.textContent = text;
        el.className = 'status ' + state;
    }

    function setButtons(playing) {
        $('btnStart').disabled = playing;
        $('btnStop').disabled = !playing;
    }
    // ========== 单次渲染 ==========
    function _tryRenderOnce() {
        if (CURRENT_MODE === 'chat') return;
        if (_rendered) return;
        if (!_hasVideoTrack || !_pendingStream) return;
        const v = $('remoteVideo');
        try {
            v.pause();
            v.srcObject = _pendingStream;
            setStatus('✅ 播放中', 'playing');
            isPlaying = true;
            _startTime = performance.now();
            // 启动统计（降频）
            if (_statsTimer) clearInterval(_statsTimer);
            _statsTimer = setInterval(updateStats, 2000);
            // 尝试播放
            v.play().catch(() => {});
            log('✅ 视频已渲染', 'success');
        } catch (e) {
            log(`渲染异常: ${e.message}`, 'error');
        }
        _rendered = true;
    }

    // ========== 统计更新（降频） ==========
    async function updateStats() {
        if (!pc || !isPlaying || CURRENT_MODE === 'chat') return;
        try {
            const stats = await pc.getStats();
            let vPkts = 0, aPkts = 0, vBytes = 0, aBytes = 0;
            stats.forEach(stat => {
                if (stat.type === 'inbound-rtp') {
                    if (stat.kind === 'video') { vPkts += stat.packetsReceived || 0; vBytes += stat.bytesReceived || 0; }
                    if (stat.kind === 'audio') { aPkts += stat.packetsReceived || 0; aBytes += stat.bytesReceived || 0; }
                }
            });
            const sec = (performance.now() - _startTime) / 1000;
            $('svPkts').textContent = vPkts;
            $('saPkts').textContent = aPkts;
            $('sTime').textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
            const totalBytes = vBytes + aBytes;
            $('sBitrate').textContent = sec > 2 ? Math.floor(totalBytes * 8 / sec / 1000) : 0;
        } catch(e) {}
    }

    // ========== 主流程 ==========
    async function startPlay() {
        stopPlay();
        _rendered = false;
        _pendingStream = null;
        _hasVideoTrack = false;
        if (isPlaying) return;

        const wsUrl = $('wsUrlInput').value.trim();
        ROOM_ID = $('roomIdInput').value.trim();
        if (!wsUrl) {
            setStatus('❌ 请输入信令地址', 'failed');
            log('请输入信令地址', 'error');
            return;
        }
        if (!ROOM_ID) {
            setStatus('❌ 请输入房间 ID', 'failed');
            log('请输入房间 ID', 'error');
            return;
        }
        $('roomIdDisplay').textContent = ROOM_ID;
        const mode = readTransMode();
        CURRENT_MODE = mode;
        applyModeUi(mode);
        setButtons(true);
        setStatus(mode === 'chat' ? '💬 仅聊天：只建 DataChannel...' : '⏳ 连接...', 'connecting');
        log(`开始拉流: ${wsUrl}，房间: ${ROOM_ID}，模式: ${modeLabel(mode)}`, 'info');

        ws = new WebSocket(wsUrl);
        ws.onopen = () => {
            log('信令已连接', 'success');
            ws.send(JSON.stringify({ type: 'join', role: 'play', streamId: ROOM_ID }));
        };

        ws.onmessage = async (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type !== 'candidate') log(`信令: ${msg.type}`, 'info');
                switch (msg.type) {
                    case 'joined':
                        joined = true;
                        // 不在 joined 时建 PC：观看端先于推流端加入时还没有远端 SDP，
                        // 提前建 PC 只会先做一轮无意义的 gather/trickle；
                        // 统一推迟到首个 offer 到达时创建，时序与"推流端先起"一致。
                        break;
                    case 'offer':
                        if (!pc) await createPeerConnection();
                        if (pc && pc.signalingState === 'stable') {
                            await pc.setRemoteDescription(new RTCSessionDescription(msg));
                            log('Offer 已应用', 'success');
                            await createAnswer();
                        }
                        break;
                    case 'candidate':
                        if (pc && msg.candidate) {
                            const cand = { candidate: msg.candidate };
                            // 服务端转发的 candidate 可能不带 sdpMid/sdpMLineIndex，
                            // 两者都为 null 时 Chrome 会拒绝构造 RTCIceCandidate。
                            cand.sdpMid = (msg.sdpMid !== undefined && msg.sdpMid !== null) ? msg.sdpMid : '0';
                            cand.sdpMLineIndex = Number.isInteger(msg.sdpMLineIndex) ? msg.sdpMLineIndex : 0;
                            if (msg.usernameFragment !== undefined && msg.usernameFragment !== null) {
                                cand.usernameFragment = msg.usernameFragment;
                            }
                            try {
                                await pc.addIceCandidate(new RTCIceCandidate(cand));
                            } catch (e) {
                                log(`ICE candidate 添加失败: ${e.message}`, 'warn');
                            }
                        }
                        break;
                    case 'publisher-left':
                        log('主播已下线', 'warn');
                        setStatus('⚠️ 主播已离线', 'failed');
                        stopPlay();
                        break;
                    case 'error':
                        log(`错误: ${msg.message || msg.code}`, 'error');
                        if (msg.code === 'stream-not-ready') {
                            setStatus('🚫 主播未开播', 'failed');
                            stopPlay();
                        }
                        break;
                    default:
                        break;
                }
            } catch (e) {
                log(`信令错误: ${e.message}`, 'error');
            }
        };
        ws.onclose = () => { log('信令关闭', 'warn'); if (isPlaying) stopPlay(); };
        ws.onerror = () => { log('信令错误', 'error'); stopPlay(); };
    }

    // ========== PeerConnection ==========
    async function createPeerConnection() {
        pc = new RTCPeerConnection({ iceServers: [{ urls: `stun:${stunHost}:3478` }] });

        if (CURRENT_MODE !== 'media') {
            // 聊天通道：必须在应答服务端 Offer 之前创建，否则 answer 里不会带 m=application
            try {
                bindDataChannel(pc.createDataChannel(DC_LABEL, { ordered: true, id: 0 }));
            } catch (e) {
                log(`DataChannel 创建失败: ${e.message}`, 'error');
            }
        } else {
            setDcState('未启用（仅媒体模式）', false);
            log('仅媒体模式：不建立 DataChannel', 'info');
        }

        if (CURRENT_MODE !== 'chat') {
            // 顺序必须与服务端 Offer 的 m-line 一致：audio 后 video。
            const audioTransceiver = pc.addTransceiver('audio', { direction: 'recvonly' });
            const videoTransceiver = pc.addTransceiver('video', { direction: 'recvonly' });
            const audioCodecs = RTCRtpReceiver.getCapabilities('audio')?.codecs
                .filter(codec => codec.mimeType.toLowerCase() === 'audio/opus') || [];
            const videoCodecs = RTCRtpReceiver.getCapabilities('video')?.codecs
                .filter(codec => codec.mimeType.toLowerCase() === 'video/h264'
                    && /(?:^|;)\s*packetization-mode=1(?:;|$)/i.test(codec.sdpFmtpLine || '')) || [];
            if (audioCodecs.length === 0) throw new Error('浏览器不支持 Opus 音频解码');
            if (videoCodecs.length === 0) throw new Error('浏览器不支持 packetization-mode=1 的 H264 视频解码');
            if (typeof audioTransceiver.setCodecPreferences !== 'function'
                || typeof videoTransceiver.setCodecPreferences !== 'function') {
                throw new Error('浏览器不支持 setCodecPreferences，无法限制接收编码');
            }
            audioTransceiver.setCodecPreferences(audioCodecs);
            videoTransceiver.setCodecPreferences(videoCodecs);
        } else {
            log('💬 仅聊天模式：不添加音视频 transceiver，也不渲染视频', 'info');
        }

        pc.ontrack = (event) => {
            const t = event.track;
            if (CURRENT_MODE === 'chat') {
                log(`仅聊天模式：忽略远端 ${t.kind} 轨道（不渲染）`, 'warn');
                return;
            }
            let stream = event.streams?.[0] || _pendingStream || new MediaStream([t]);
            if (!event.streams?.[0] && !_pendingStream) log('新建 MediaStream', 'warn');
            if (t.kind === 'video') _hasVideoTrack = true;
            _pendingStream = stream;
            // 低延迟优化
            try { if (event.receiver?.playoutDelayHint !== undefined) event.receiver.playoutDelayHint = 0.03; } catch(e) {}
            _tryRenderOnce();
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({
                    type: 'candidate',
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex,
                    usernameFragment: event.candidate.usernameFragment,
                }));
            }
        };

        pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            log(`ICE: ${state}`, 'info');
            if (state === 'failed' || state === 'disconnected') { setStatus('❌ ICE断开', 'failed'); stopPlay(); }
        };
        pc.onconnectionstatechange = () => {
            const state = pc.connectionState;
            if (state === 'failed') { setStatus('❌ 连接失败', 'failed'); stopPlay(); }
        };
    }

    async function createAnswer() {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription.sdp }));
        log('Answer 已发送', 'success');
    }

    // ========== 停止 ==========
    function stopPlay() {
        isPlaying = false;
        joined = false;
        _rendered = false;
        _pendingStream = null;
        _hasVideoTrack = false;
        setButtons(false);
        setStatus('⚪ 已停止', 'idle');
        log('已停止', 'warn');
        if (_statsTimer) { clearInterval(_statsTimer); _statsTimer = null; }
        if (dc) {
            dc.onopen = null; dc.onmessage = null; dc.onclose = null; dc.onerror = null;
            try { dc.close(); } catch(_) {}
            dc = null;
        }
        setDcState(CURRENT_MODE === 'media' ? '未启用（仅媒体模式）' : '未连接', false);
        if (pc) { try { pc.close(); } catch(_) {} pc = null; }
        if (ws && ws.readyState === WebSocket.OPEN) { try { ws.close(); } catch(_) {} ws = null; }
        // 清理 video
        try {
            const v = $('remoteVideo');
            v.pause();
            if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); }
            v.srcObject = null;
        } catch(_) {}
        // 重置统计
        $('svPkts').textContent = '0';
        $('saPkts').textContent = '0';
        $('sTime').textContent = '00:00';
        $('sBitrate').textContent = '0';
        $('btnStart').disabled = false;
    }

    window.addEventListener('beforeunload', stopPlay);
    $('wsUrlInput').value = DEFAULT_WS_URL;
    $('roomIdInput').value = DEFAULT_ROOM_ID;
    $('roomIdDisplay').textContent = ROOM_ID;
    applyModeUi(readTransMode());
    log('🚀 就绪，点击「开始观看」', 'success');
</script>
</body>
</html>
