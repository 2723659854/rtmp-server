<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 拉流播放（流畅版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 15px; font-size: 0.9em; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .settings { display: flex; gap: 16px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; padding: 10px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 6px; }
        .setting { display: flex; align-items: center; gap: 6px; }
        .setting label { color: #888; font-size: 0.85em; }
        .setting input { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #e0e0e0; font-size: 0.9em; }
        .setting input:focus { outline: none; border-color: #4cc9f0; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95em; cursor: pointer; font-weight: 500; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-start { background: #4cc9f0; color: #000; }
        .btn-stop { background: #f72585; color: #fff; }
        .status { padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .status.idle { background: #1a1a2e; color: #666; }
        .status.connecting { background: #2a1a0a; color: #ff9f1c; }
        .status.playing { background: #0a2a1a; color: #06d6a0; }
        .status.failed { background: #2a0a0a; color: #f72585; }
        .video-box { background: #000; border: 1px solid #2a2a3e; border-radius: 8px; padding: 8px; margin-bottom: 10px; display: flex; justify-content: center; }
        .video-box video { width: 100%; max-height: 400px; border-radius: 4px; background: #111; }
        /* 日志 - 限制最大条数 + 滚动 */
        .log-box { background: #000; border: 1px solid #2a2a3e; border-radius: 8px; padding: 8px 12px; margin-top: 15px; max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.75em; line-height: 1.6; color: #aaa; }
        .log-box .time { color: #555; }
        .log-box .info { color: #ccc; }
        .log-box .warn { color: #ff9f1c; }
        .log-box .success { color: #06d6a0; }
        .log-box .error { color: #f72585; }
        /* 简化的状态面板 */
        .stats-mini { display: flex; gap: 16px; padding: 8px 12px; margin-top: 10px; background: #111; border-radius: 6px; font-size: 0.75em; color: #666; flex-wrap: wrap; }
        .stats-mini span { display: flex; align-items: center; gap: 4px; }
        .stats-mini .val { color: #4cc9f0; font-weight: bold; }
        .stats-mini .val.audio { color: #06d6a0; }
        .chat-controls { display: flex; gap: 10px; margin-top: 15px; }
        .chat-controls input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #2a2a3e; background: #1a1a2e; color: #e0e0e0; font-size: 0.95em; }
        .chat-controls input:focus { outline: none; border-color: #4cc9f0; }
        .chat-controls input:disabled { opacity: 0.4; }
        .btn-send { background: #06d6a0; color: #000; }
    </style>
</head>
<body>
<div class="container">
    <h1>📥 拉流播放</h1>
    <p class="subtitle">房间 <span id="roomIdDisplay">stream_001</span></p>
    <div class="controls">
        <button class="btn btn-start" id="btnStart" onclick="startPlay()">▶ 开始观看</button>
        <button class="btn btn-stop" id="btnStop" onclick="stopPlay()" disabled>■ 停止</button>
    </div>
    <div class="settings">
        <div class="setting">
            <label>信令</label>
            <input type="text" id="wsUrlInput" style="width:220px;">
        </div>
        <div class="setting">
            <label>房间</label>
            <input type="text" id="roomIdInput" value="stream_001" style="width:120px;">
        </div>
    </div>
    <div class="status idle" id="status">⚪ 空闲</div>
    <div class="video-box"><video id="remoteVideo" autoplay playsinline></video></div>
    <!-- 精简统计 -->
    <div class="stats-mini" id="statsMini">
        <span>📹 视频: <span class="val" id="svPkts">0</span> 包</span>
        <span>🔊 音频: <span class="val audio" id="saPkts">0</span> 包</span>
        <span>⏱️ <span id="sTime">00:00</span></span>
        <span>📊 <span id="sBitrate">0</span> kbps</span>
    </div>
    <div class="chat-controls" style="display: none !important;">
        <input type="text" id="chatInput" placeholder="输入聊天消息..." disabled>
        <button class="btn btn-send" id="btnSend" onclick="sendChatMessage()" disabled>发送</button>
    </div>
    <div class="log-box" id="logBox"></div>
    <div style="margin-top:30px;padding:12px 0;text-align:center;font-size:12px;color:#6a6a7a;border-top:1px solid rgba(255,255,255,0.06);font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
        本页面由 <strong style="color:#6c8cff;"><a href="https://github.com/2723659854/rtmp-server" style="color: white">xiaosongshu/rtmp-server</a></strong> 提供
    </div>
</div>

<script>
    const DEFAULT_ROOM_ID = 'stream_001';
    const DEFAULT_WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
    let ROOM_ID = DEFAULT_ROOM_ID;

    let pc = null, ws = null, dc = null;
    let isPlaying = false, joined = false;
    let _rendered = false;
    let _pendingStream = null;
    let _hasVideoTrack = false;
    let _dummyAc = null, _dummyTracks = [];
    let _statsTimer = null, _statsCounter = 0;
    let _startTime = 0;
    let _logBuffer = [], _logTimer = null;
    const stunHost = window.location.hostname;

    // ========== 批量日志 ==========
    function log(msg, level='info') {
        const t = new Date().toLocaleTimeString();
        const cls = level === 'warn' ? 'warn' : level === 'error' ? 'error' : level === 'success' ? 'success' : '';
        _logBuffer.push(`<div><span class="time">${t}</span> <span class="${cls}">${msg}</span></div>`);
        if (_logBuffer.length > 5) flushLog();
        if (!_logTimer) _logTimer = setTimeout(flushLog, 200);
    }

    function flushLog() {
        if (_logBuffer.length === 0) return;
        const p = $('logBox');
        p.innerHTML += _logBuffer.join('');
        _logBuffer = [];
        p.scrollTop = p.scrollHeight;
        // 限制日志条数，防止 DOM 膨胀
        while (p.children.length > 100) {
            p.removeChild(p.firstChild);
        }
        _logTimer = null;
    }

    function $(id) { return document.getElementById(id); }

    function setStatus(text, state) {
        const el = $('status');
        el.textContent = text;
        el.className = 'status ' + state;
    }

    function setButtons(playing) {
        $('btnStart').disabled = playing;
        $('btnStop').disabled = !playing;
    }
    function setChatEnabled(enabled) {
        $('chatInput').disabled = !enabled;
        $('btnSend').disabled = !enabled;
    }
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    function bindDataChannel(channel) {
        console.log('bindDataChannel 被调用，channel readyState =', channel.readyState);
        if (dc === channel) return;
        if (dc && dc.readyState !== 'closed') {
            try { dc.close(); } catch (_) {}
        }
        dc = channel;
        setChatEnabled(false);
        dc.onopen = () => {
            if (dc !== channel) return;
            log('💬 DataChannel 已打开', 'success');
            setChatEnabled(true);
        };
        dc.onmessage = (event) => {
            if (dc !== channel) return;
            log(`📥 聊天: ${escapeHtml(String(event.data))}`, 'success');
        };
        dc.onerror = (event) => {
            if (dc !== channel) return;
            log(`DataChannel 错误: ${escapeHtml(event.error?.message || 'unknown')}`, 'error');
        };
        dc.onclose = () => {
            if (dc !== channel) return;
            log('DataChannel 已关闭', 'warn');
            setChatEnabled(false);
        };
    }
    function sendChatMessage() {
        const input = $('chatInput');
        const text = input.value.trim();
        if (!text || !dc || dc.readyState !== 'open') return;
        dc.send(text);
        log(`📤 我: ${escapeHtml(text)}`, 'info');
        input.value = '';
    }
    $('chatInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            sendChatMessage();
        }
    });

    // ========== 单次渲染 ==========
    function _tryRenderOnce() {
        if (_rendered) return;
        if (!_hasVideoTrack || !_pendingStream) return;
        const v = $('remoteVideo');
        try {
            v.pause();
            v.srcObject = _pendingStream;
            setStatus('✅ 播放中', 'playing');
            isPlaying = true;
            _startTime = performance.now();
            // 启动统计（降频）
            if (_statsTimer) clearInterval(_statsTimer);
            _statsTimer = setInterval(updateStats, 2000);
            // 尝试播放
            v.play().catch(() => {});
            log('✅ 视频已渲染', 'success');
        } catch (e) {
            log(`渲染异常: ${e.message}`, 'error');
        }
        _rendered = true;
    }

    // ========== 统计更新（降频） ==========
    async function updateStats() {
        if (!pc || !isPlaying) return;
        try {
            const stats = await pc.getStats();
            let vPkts = 0, aPkts = 0, vBytes = 0, aBytes = 0;
            stats.forEach(stat => {
                if (stat.type === 'inbound-rtp') {
                    if (stat.kind === 'video') { vPkts += stat.packetsReceived || 0; vBytes += stat.bytesReceived || 0; }
                    if (stat.kind === 'audio') { aPkts += stat.packetsReceived || 0; aBytes += stat.bytesReceived || 0; }
                }
            });
            const sec = (performance.now() - _startTime) / 1000;
            $('svPkts').textContent = vPkts;
            $('saPkts').textContent = aPkts;
            $('sTime').textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
            const totalBytes = vBytes + aBytes;
            $('sBitrate').textContent = sec > 2 ? Math.floor(totalBytes * 8 / sec / 1000) : 0;
        } catch(e) {}
    }

    // ========== 主流程 ==========
    async function startPlay() {
        stopPlay();
        _rendered = false;
        _pendingStream = null;
        _hasVideoTrack = false;
        if (isPlaying) return;

        const wsUrl = $('wsUrlInput').value.trim();
        ROOM_ID = $('roomIdInput').value.trim();
        if (!wsUrl) {
            setStatus('❌ 请输入信令地址', 'failed');
            log('请输入信令地址', 'error');
            return;
        }
        if (!ROOM_ID) {
            setStatus('❌ 请输入房间 ID', 'failed');
            log('请输入房间 ID', 'error');
            return;
        }
        $('roomIdDisplay').textContent = ROOM_ID;
        setButtons(true);
        setStatus('⏳ 连接...', 'connecting');
        log(`开始拉流: ${wsUrl}，房间: ${ROOM_ID}`, 'info');

        ws = new WebSocket(wsUrl);
        ws.onopen = () => {
            log('信令已连接', 'success');
            ws.send(JSON.stringify({ type: 'join', role: 'play', streamId: ROOM_ID, clientOffer: true }));
        };

        ws.onmessage = async (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type !== 'candidate') log(`信令: ${msg.type}`, 'info');
                switch (msg.type) {
                    case 'joined':
                        joined = true;
                        await createPeerConnection();
                        await createOffer();
                        break;
                    case 'answer':
                        if (pc && pc.signalingState === 'have-local-offer') {
                            await pc.setRemoteDescription(new RTCSessionDescription(msg));
                            log('Answer 已应用', 'success');
                        }
                        break;
                    case 'offer':
                        log('忽略旧服务端 Offer，当前由浏览器主动协商', 'warn');
                        break;
                    case 'candidate':
                        if (pc && msg.candidate) {
                            const cand = { candidate: msg.candidate, sdpMid: msg.sdpMid || '0', sdpMLineIndex: msg.sdpMLineIndex || 0 };
                            if (msg.usernameFragment) cand.usernameFragment = msg.usernameFragment;
                            await pc.addIceCandidate(new RTCIceCandidate(cand));
                        }
                        break;
                    case 'publisher-left':
                        log('主播已下线', 'warn');
                        setStatus('⚠️ 主播已离线', 'failed');
                        stopPlay();
                        break;
                    case 'error':
                        log(`错误: ${msg.message || msg.code}`, 'error');
                        if (msg.code === 'stream-not-ready') {
                            setStatus('🚫 主播未开播', 'failed');
                            stopPlay();
                        }
                        break;
                    default:
                        break;
                }
            } catch (e) {
                log(`信令错误: ${e.message}`, 'error');
            }
        };
        ws.onclose = () => { log('信令关闭', 'warn'); if (isPlaying) stopPlay(); };
        ws.onerror = () => { log('信令错误', 'error'); stopPlay(); };
    }

    // ========== PeerConnection ==========
    async function createPeerConnection() {
        pc = new RTCPeerConnection({ iceServers: [{ urls: `stun:${stunHost}:3478` }] });
        pc.ondatachannel = (event) => {
            console.log('🔥 DataChannel 事件触发！');
            log('检测到远端 DataChannel', 'info');
            bindDataChannel(event.channel);
        };
        bindDataChannel(pc.createDataChannel('chat', { ordered: true, id: 0 }));
        pc.addTransceiver('audio', { direction: 'recvonly' });
        pc.addTransceiver('video', { direction: 'recvonly' });

        pc.ontrack = (event) => {
            const t = event.track;
            let stream = event.streams?.[0] || _pendingStream || new MediaStream([t]);
            if (!event.streams?.[0] && !_pendingStream) log('新建 MediaStream', 'warn');
            if (t.kind === 'video') _hasVideoTrack = true;
            _pendingStream = stream;
            // 低延迟优化
            try { if (event.receiver?.playoutDelayHint !== undefined) event.receiver.playoutDelayHint = 0.03; } catch(e) {}
            _tryRenderOnce();
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                const c = event.candidate.candidate;
                if (c.includes('.local') || c.includes('0.0.0.0')) return;
                ws.send(JSON.stringify({
                    type: 'candidate',
                    candidate: c,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex,
                    usernameFragment: event.candidate.usernameFragment,
                }));
            }
        };

        pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            log(`ICE: ${state}`, 'info');
            if (state === 'failed' || state === 'disconnected') { setStatus('❌ ICE断开', 'failed'); stopPlay(); }
        };
        pc.onconnectionstatechange = () => {
            const state = pc.connectionState;
            if (state === 'failed') { setStatus('❌ 连接失败', 'failed'); stopPlay(); }
        };
    }

    async function createOffer() {
        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }));
            log('Offer 已发送', 'success');
        } catch (e) {
            log(`创建 Offer 失败: ${e.message}`, 'error');
        }
    }

    // ========== 停止 ==========
    function stopPlay() {
        isPlaying = false;
        joined = false;
        _rendered = false;
        _pendingStream = null;
        _hasVideoTrack = false;
        setButtons(false);
        setStatus('⚪ 已停止', 'idle');
        log('已停止', 'warn');
        if (_statsTimer) { clearInterval(_statsTimer); _statsTimer = null; }
        if (dc) { try { dc.close(); } catch(_) {} dc = null; }
        setChatEnabled(false);
        if (pc) { try { pc.close(); } catch(_) {} pc = null; }
        if (ws && ws.readyState === WebSocket.OPEN) { try { ws.close(); } catch(_) {} ws = null; }
        // 清理 dummy
        try { _dummyTracks.forEach(t => t.stop()); _dummyTracks = []; } catch(_) {}
        try { if (_dummyAc) { _dummyAc.close(); _dummyAc = null; } } catch(_) {}
        // 清理 video
        try {
            const v = $('remoteVideo');
            v.pause();
            if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); }
            v.srcObject = null;
        } catch(_) {}
        // 重置统计
        $('svPkts').textContent = '0';
        $('saPkts').textContent = '0';
        $('sTime').textContent = '00:00';
        $('sBitrate').textContent = '0';
        $('btnStart').disabled = false;
    }

    window.addEventListener('beforeunload', stopPlay);
    $('wsUrlInput').value = DEFAULT_WS_URL;
    $('roomIdInput').value = DEFAULT_ROOM_ID;
    $('roomIdDisplay').textContent = ROOM_ID;
    log('🚀 就绪，点击「开始观看」', 'success');
</script>
</body>
</html>
