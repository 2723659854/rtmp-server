<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MP4录播回放视频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1430 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(20, 25, 45, 0.9);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(64, 128, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .video-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.4);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0a0b0;
        }

        .file-path {
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 6px;
            color: #6c8cff;
            font-size: 12px;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 地址输入区域 */
        .url-input-area {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .url-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .url-input-row .url-input-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .url-input-row .url-input-wrap input {
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            transition: all 0.3s ease;
            outline: none;
        }

        .url-input-row .url-input-wrap input:focus {
            border-color: #4a6cf7;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }

        .url-input-row .url-input-wrap input::placeholder {
            color: #6a6a7a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .url-input-row .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .url-hint {
            font-size: 12px;
            color: #6a6a7a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .url-hint .hint-tag {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(74, 108, 247, 0.15);
            border-radius: 12px;
            color: #6c8cff;
            font-size: 11px;
            font-weight: 500;
        }

        .protocol-detect-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(74, 108, 247, 0.15);
            color: #6c8cff;
        }

        .protocol-detect-badge.unknown {
            background: rgba(255, 255, 255, 0.05);
            color: #6a6a7a;
        }

        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 0 100px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            outline: none;
        }

        /* 自定义视频控件样式 */
        video::-webkit-media-controls-panel {
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        }

        video::-webkit-media-controls-play-button {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
        }

        video::-webkit-media-controls-timeline {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 10px;
        }

        video::-webkit-media-controls-volume-slider {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* 信息面板 */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .info-label {
            font-size: 11px;
            color: #6a6a7a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-value {
            font-size: 15px;
            color: #e0e0e0;
            font-weight: 500;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
        }

        .info-value.highlight {
            color: #6c8cff;
        }

        /* 控制按钮 */
        .control-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-orange {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        .btn-orange:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
        }

        /* 键盘快捷键提示 */
        .shortcuts-hint {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shortcuts-title {
            font-size: 12px;
            color: #6a6a7a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }

        .shortcut-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #a0a0b0;
        }

        .key-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            color: #e0e0e0;
            min-width: 24px;
            text-align: center;
        }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            max-width: 400px;
        }

        .error-toast.show {
            transform: translateX(0);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .player-container {
                padding: 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 18px;
            }

            .info-panel {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .info-card {
                padding: 12px;
            }

            .info-value {
                font-size: 14px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .file-path {
                max-width: 200px;
            }

            .url-input-row {
                flex-direction: column;
                align-items: stretch;
            }

            .url-input-row .btn {
                justify-content: center;
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            .info-panel {
                grid-template-columns: 1fr;
            }

            .control-bar {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="player-container">
    <!-- 头部 -->
    <div class="header">
        <div class="title-group">
            <h1>MP4 视频播放器</h1>
            <div class="video-type-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                MP4
            </div>
        </div>
        <div class="file-info">
            <span style="color: #6a6a7a;">📁 当前地址</span>
            <span class="file-path" id="filePath">正在获取地址...</span>
        </div>
    </div>

    <!-- 地址输入区域 -->
    <div class="url-input-area">
        <div class="url-input-row">
            <div class="url-input-wrap">
                <input type="text" id="streamUrl"
                       placeholder="输入 MP4 视频地址，如 http://example.com/video.mp4"
                       spellcheck="false"
                       autocomplete="off" />
            </div>
            <button class="btn btn-primary" id="playBtn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                播放
            </button>
            <button class="btn btn-secondary" id="resetUrlBtn" title="恢复默认地址">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>
        </div>
        <div class="url-hint">
            <span>支持 <strong>MP4</strong> 格式，按回车或点击播放加载</span>
            <span class="protocol-detect-badge" id="detectBadge">🎬 MP4</span>
            <span style="color:#6c8cff;font-size:12px;" id="detectHint">默认使用动态地址</span>
        </div>
    </div>

    <!-- 播放器 -->
    <div class="player-wrapper">
        <video id="video" controls playsinline preload="auto"></video>
    </div>

    <!-- 视频信息面板 -->
    <div class="info-panel">
        <div class="info-card">
            <div class="info-label">⏱️ 当前时间</div>
            <div class="info-value highlight" id="currentTime">00:00</div>
        </div>
        <div class="info-card">
            <div class="info-label">📊 总时长</div>
            <div class="info-value" id="duration">--:--</div>
        </div>
        <div class="info-card">
            <div class="info-label">📈 播放进度</div>
            <div class="info-value" id="progress">0%</div>
        </div>
        <div class="info-card">
            <div class="info-label">🔊 音量</div>
            <div class="info-value" id="volumeDisplay">100%</div>
        </div>
        <div class="info-card">
            <div class="info-label">📺 分辨率</div>
            <div class="info-value" id="resolution">--</div>
        </div>
        <div class="info-card">
            <div class="info-label">🎬 播放状态</div>
            <div class="info-value" id="playState">准备中</div>
        </div>
    </div>

    <!-- 控制按钮 -->
    <div class="control-bar">
        <button class="btn btn-orange" onclick="togglePlay()" id="playPauseBtn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            播放
        </button>
        <button class="btn btn-secondary" onclick="toggleMute()" id="muteBtn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            静音
        </button>
        <button class="btn btn-secondary" onclick="skipTime(-10)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
            后退10秒
        </button>
        <button class="btn btn-secondary" onclick="skipTime(10)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
            </svg>
            快进10秒
        </button>
        <button class="btn btn-secondary" onclick="resetVideo()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            重新播放
        </button>
    </div>

    <!-- 键盘快捷键提示 -->
    <div class="shortcuts-hint">
        <div class="shortcuts-title">⌨️ 键盘快捷键</div>
        <div class="shortcuts-grid">
            <div class="shortcut-item">
                <span class="key-badge">Space</span> 播放/暂停
            </div>
            <div class="shortcut-item">
                <span class="key-badge">←</span> 后退5秒
            </div>
            <div class="shortcut-item">
                <span class="key-badge">→</span> 快进5秒
            </div>
            <div class="shortcut-item">
                <span class="key-badge">↑</span> 音量增加
            </div>
            <div class="shortcut-item">
                <span class="key-badge">↓</span> 音量减少
            </div>
            <div class="shortcut-item">
                <span class="key-badge">M</span> 静音切换
            </div>
            <div class="shortcut-item">
                <span class="key-badge">F</span> 全屏
            </div>
            <div class="shortcut-item">
                <span class="key-badge">R</span> 重新播放
            </div>
        </div>
    </div>
</div>

<!-- 错误提示 -->
<div class="error-toast" id="errorToast"></div>
<div style="margin-top:30px;padding:12px 0;text-align:center;font-size:12px;color:#6a6a7a;border-top:1px solid rgba(255,255,255,0.06);font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
    本页面由 <strong style="color:#6c8cff;"><a href="https://github.com/2723659854/rtmp-server" style="color: white">xiaosongshu/rtmp-server</a></strong> 提供
</div>
<script>
    // ============ DOM引用 ============
    const video = document.getElementById('video');
    const streamUrlInput = document.getElementById('streamUrl');
    const playBtn = document.getElementById('playBtn');
    const resetUrlBtn = document.getElementById('resetUrlBtn');
    const detectBadge = document.getElementById('detectBadge');
    const detectHint = document.getElementById('detectHint');
    const filePathSpan = document.getElementById('filePath');
    const playPauseBtn = document.getElementById('playPauseBtn');

    let isLoading = false;

    // ============ 核心方法：动态获取当前基础地址 ============
    function getDynamicBaseUrl() {
        const protocol = window.location.protocol;
        const host = window.location.host;
        return `${protocol}//${host}`;
    }

    // ============ 构建默认MP4地址 ============
    function getDefaultMp4Url() {
        const base = getDynamicBaseUrl();
        // 可根据需要修改默认路径
        const path = '/mp4/a/b/output_merge/b_full.mp4';
        return base + path;
    }

    // ============ 显示错误提示 ============
    function showError(message) {
        const toast = document.getElementById('errorToast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast.hideTimeout);
        toast.hideTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 4000);
    }

    // ============ 格式化时间 ============
    function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '--:--';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // ============ 更新信息面板 ============
    function updateInfo() {
        document.getElementById('currentTime').textContent = formatTime(video.currentTime);
        if (video.duration && isFinite(video.duration)) {
            document.getElementById('duration').textContent = formatTime(video.duration);
            const progress = (video.currentTime / video.duration * 100).toFixed(1);
            document.getElementById('progress').textContent = Math.min(100, progress) + '%';
        }
        document.getElementById('volumeDisplay').textContent = Math.round(video.volume * 100) + '%';

        if (video.videoWidth && video.videoHeight) {
            document.getElementById('resolution').textContent =
                video.videoWidth + '×' + video.videoHeight;
        }

        let state = '准备中';
        if (video.error) state = '错误';
        else if (video.readyState === 0) state = '未初始化';
        else if (video.readyState === 1) state = '元数据加载中';
        else if (video.paused && video.currentTime === 0 && !video.seeking) state = '未播放';
        else if (video.seeking) state = '跳转中...';
        else if (video.paused) state = '已暂停';
        else if (video.ended) state = '播放完毕';
        else state = '播放中';
        document.getElementById('playState').textContent = state;
    }

    setInterval(updateInfo, 500);

    // ============ 安全的跳转 ============
    function safeSeek(targetTime) {
        if (!video.duration || !isFinite(video.duration)) {
            showError('视频尚未加载完成，无法跳转');
            return;
        }
        targetTime = Math.max(0, Math.min(video.duration, targetTime));
        try {
            const wasPlaying = !video.paused;
            const onSeeked = () => {
                video.removeEventListener('seeked', onSeeked);
                video.removeEventListener('error', onSeekError);
                isLoading = false;
                updateInfo();
                if (wasPlaying) {
                    video.play().catch(e => console.warn('恢复播放失败:', e));
                }
            };
            const onSeekError = (e) => {
                video.removeEventListener('seeked', onSeeked);
                video.removeEventListener('error', onSeekError);
                isLoading = false;
                console.error('跳转失败:', video.error);
                showError('跳转失败，可能是服务器不支持 Range 请求');
            };
            video.addEventListener('seeked', onSeeked, { once: true });
            video.addEventListener('error', onSeekError, { once: true });
            video.currentTime = targetTime;
            updateInfo();
        } catch (e) {
            console.error('跳转异常:', e);
            showError('跳转操作失败');
            isLoading = false;
        }
    }

    // ============ 加载视频 ============
    function loadVideo(url) {
        // 如果地址为空，使用默认
        if (!url || url.trim() === '') {
            url = getDefaultMp4Url();
            streamUrlInput.value = url;
        }

        // 标准化地址：如果是相对路径，补全
        if (!/^https?:\/\//i.test(url)) {
            if (url.startsWith('/')) {
                url = window.location.origin + url;
            } else {
                url = window.location.origin + '/' + url.replace(/^\/+/, '');
            }
            streamUrlInput.value = url;
        }

        // 更新显示
        filePathSpan.textContent = url;
        filePathSpan.title = url;
        detectBadge.textContent = '🎬 MP4';
        detectBadge.className = 'protocol-detect-badge';
        detectHint.textContent = '加载 MP4 文件';

        // 如果视频正在播放，暂停并重置
        video.pause();
        video.removeAttribute('src');
        video.load();

        // 设置新源
        video.src = url;
        video.load();

        // 更新状态
        document.getElementById('playState').textContent = '加载中...';
        console.log(`[MP4播放器] 加载视频: ${url}`);

        // 监听加载完成
        const onLoaded = () => {
            video.removeEventListener('loadedmetadata', onLoaded);
            video.removeEventListener('error', onError);
            updateInfo();
            document.getElementById('playState').textContent = '就绪';
            // 自动播放
            video.play().catch(e => {
                console.warn('自动播放失败:', e);
                // 不阻塞，用户可手动点击播放
            });
        };
        const onError = (e) => {
            video.removeEventListener('loadedmetadata', onLoaded);
            video.removeEventListener('error', onError);
            console.error('视频加载错误:', video.error);
            updateInfo();
            let msg = '加载失败';
            if (video.error) {
                switch(video.error.code) {
                    case MediaError.MEDIA_ERR_ABORTED: msg = '加载被中止'; break;
                    case MediaError.MEDIA_ERR_NETWORK: msg = '网络错误，请检查路径或服务器'; break;
                    case MediaError.MEDIA_ERR_DECODE: msg = '解码失败，文件可能损坏'; break;
                    case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED: msg = '格式不支持或文件不存在'; break;
                }
            }
            showError(msg);
            document.getElementById('playState').textContent = '错误';
        };
        video.addEventListener('loadedmetadata', onLoaded);
        video.addEventListener('error', onError);
    }

    // ============ 播放控制 ============
    function togglePlay() {
        if (video.paused) {
            video.play().catch(e => {
                console.error('播放失败:', e);
                showError('播放失败，请检查视频源');
            });
        } else {
            video.pause();
        }
    }

    function toggleMute() {
        const btn = document.getElementById('muteBtn');
        if (video.muted || video.volume === 0) {
            video.muted = false;
            video.volume = 1;
            btn.innerHTML = `
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                静音
            `;
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-secondary');
        } else {
            video.muted = true;
            btn.innerHTML = `
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
                取消静音
            `;
            btn.classList.remove('btn-secondary');
            btn.classList.add('btn-primary');
        }
    }

    function skipTime(seconds) {
        if (!video.duration || !isFinite(video.duration)) {
            showError('视频尚未加载完成');
            return;
        }
        safeSeek(video.currentTime + seconds);
    }

    function resetVideo() {
        if (!video.duration || !isFinite(video.duration)) {
            showError('视频尚未加载完成');
            return;
        }
        safeSeek(0);
        setTimeout(() => {
            video.play().catch(e => console.warn('重新播放失败:', e));
        }, 100);
    }

    // ============ 用户输入播放 ============
    function playStream() {
        let url = streamUrlInput.value.trim();
        if (!url) {
            url = getDefaultMp4Url();
            streamUrlInput.value = url;
        }
        loadVideo(url);
    }

    function resetToDefault() {
        const defaultUrl = getDefaultMp4Url();
        streamUrlInput.value = defaultUrl;
        detectBadge.textContent = '🎬 MP4 (默认)';
        detectHint.textContent = '使用默认动态地址';
        loadVideo(defaultUrl);
    }

    // ============ 键盘快捷键 ============
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            // 在输入框中按回车触发播放
            if (e.key === 'Enter' && e.target === streamUrlInput) {
                e.preventDefault();
                playStream();
            }
            return;
        }
        switch(e.key.toLowerCase()) {
            case ' ':
                e.preventDefault();
                togglePlay();
                break;
            case 'arrowleft':
                e.preventDefault();
                skipTime(-5);
                break;
            case 'arrowright':
                e.preventDefault();
                skipTime(5);
                break;
            case 'arrowup':
                e.preventDefault();
                video.volume = Math.min(1, video.volume + 0.1);
                break;
            case 'arrowdown':
                e.preventDefault();
                video.volume = Math.max(0, video.volume - 0.1);
                break;
            case 'm':
                e.preventDefault();
                toggleMute();
                break;
            case 'f':
                e.preventDefault();
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    video.requestFullscreen().catch(e => console.warn('全屏失败:', e));
                }
                break;
            case 'r':
                e.preventDefault();
                resetVideo();
                break;
        }
    });

    // ============ 视频事件 ============
    video.addEventListener('loadedmetadata', updateInfo);
    video.addEventListener('playing', function() {
        updateInfo();
        playPauseBtn.innerHTML = `
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                暂停
            `;
    });
    video.addEventListener('pause', function() {
        updateInfo();
        playPauseBtn.innerHTML = `
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                播放
            `;
    });
    video.addEventListener('ended', function() {
        updateInfo();
        document.getElementById('playState').textContent = '播放完毕';
        playPauseBtn.innerHTML = `
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                播放
            `;
    });
    video.addEventListener('seeking', function() {
        document.getElementById('playState').textContent = '跳转中...';
    });
    video.addEventListener('seeked', updateInfo);
    video.addEventListener('volumechange', updateInfo);
    video.addEventListener('timeupdate', updateInfo);

    // ============ 按钮事件绑定 ============
    playBtn.addEventListener('click', function(e) {
        e.preventDefault();
        playStream();
    });

    resetUrlBtn.addEventListener('click', function(e) {
        e.preventDefault();
        resetToDefault();
    });

    streamUrlInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            playStream();
        }
    });

    // 输入时更新提示
    streamUrlInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (val) {
            if (/\.mp4$/i.test(val) || /video\/mp4/i.test(val)) {
                detectBadge.textContent = '🎬 MP4';
                detectBadge.className = 'protocol-detect-badge';
                detectHint.textContent = '检测到 MP4 地址';
            } else {
                detectBadge.textContent = '📄 未知格式';
                detectBadge.className = 'protocol-detect-badge unknown';
                detectHint.textContent = '请确保输入的是 MP4 地址';
            }
        } else {
            detectBadge.textContent = '🎬 MP4';
            detectBadge.className = 'protocol-detect-badge';
            detectHint.textContent = '请输入 MP4 视频地址';
        }
    });

    // 播放/暂停按钮（使用同一个按钮，但我们已经用id playPauseBtn）
    playPauseBtn.addEventListener('click', togglePlay);

    // ============ 初始化 ============
    const defaultUrl = getDefaultMp4Url();
    streamUrlInput.value = defaultUrl;
    detectBadge.textContent = '🎬 MP4 (默认)';
    detectHint.textContent = '使用默认动态地址';
    filePathSpan.textContent = defaultUrl;
    filePathSpan.title = defaultUrl;

    // 加载默认视频
    loadVideo(defaultUrl);
    console.log(`[MP4播放器] 初始化完成，默认地址: ${defaultUrl}`);

    // 暴露全局函数（供onclick使用）
    window.togglePlay = togglePlay;
    window.toggleMute = toggleMute;
    window.skipTime = skipTime;
    window.resetVideo = resetVideo;
    window.playStream = playStream;
    window.resetToDefault = resetToDefault;
</script>
</body>
</html>
