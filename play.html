<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>HLS直播录播视频播放器</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 容器 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1430 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(20, 25, 45, 0.9);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(64, 128, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hls-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0a0b0;
            flex-wrap: wrap;
        }

        .file-path {
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 6px;
            color: #f39c12;
            font-size: 12px;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 地址输入区域 ===== */
        .url-input-area {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .url-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .url-input-row .url-input-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .url-input-row .url-input-wrap input {
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            transition: all 0.3s ease;
            outline: none;
        }

        .url-input-row .url-input-wrap input:focus {
            border-color: #e67e22;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        .url-input-row .url-input-wrap input::placeholder {
            color: #6a6a7a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .url-input-row .url-input-wrap input.error {
            border-color: #ff4b2b;
            box-shadow: 0 0 0 3px rgba(255, 75, 43, 0.15);
        }

        .url-input-row .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .url-hint {
            font-size: 12px;
            color: #6a6a7a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .url-hint .hint-tag {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(230, 126, 34, 0.15);
            border-radius: 12px;
            color: #f39c12;
            font-size: 11px;
            font-weight: 500;
        }

        .url-hint .hint-tag.hls-tag {
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
        }

        .protocol-detect-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
        }

        .protocol-detect-badge.unknown {
            background: rgba(255, 255, 255, 0.05);
            color: #6a6a7a;
        }

        /* ===== 播放器 ===== */
        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 0 100px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            outline: none;
            background: #000;
        }

        /* ===== 信息面板 ===== */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .info-label {
            font-size: 11px;
            color: #6a6a7a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-value {
            font-size: 15px;
            color: #e0e0e0;
            font-weight: 500;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
        }

        .info-value.highlight {
            color: #f39c12;
        }

        .error-detail {
            font-size: 11px;
            color: #f44336;
            word-break: break-all;
            max-height: 60px;
            overflow-y: auto;
        }

        /* ===== 调试面板 ===== */
        .debug-panel {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-height: 200px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            display: none;
        }

        .debug-panel.show {
            display: block;
        }

        .debug-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .debug-error {
            color: #f44336;
        }
        .debug-warn {
            color: #ff9800;
        }
        .debug-info {
            color: #6c8cff;
        }
        .debug-success {
            color: #4caf50;
        }
        .debug-debug {
            color: #78909c;
        }

        /* ===== 控制栏 ===== */
        .control-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-bar .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-orange {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        .btn-orange:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: white;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-info {
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
        }

        .toast-error {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .toast-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
        }

        .toast-warning {
            background: linear-gradient(135deg, #e67e22, #f39c12);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .player-container {
                padding: 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 18px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .file-path {
                max-width: 200px;
            }

            .info-panel {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .url-input-row {
                flex-direction: column;
                align-items: stretch;
            }

            .url-input-row .btn {
                justify-content: center;
                padding: 10px 16px;
            }

            .control-bar {
                flex-direction: column;
            }

            .control-bar .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .player-container {
                padding: 10px;
            }

            h1 {
                font-size: 16px;
            }

            .info-panel {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .info-card {
                padding: 10px;
            }

            .info-value {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<div class="player-container">
    <!-- ===== 头部 ===== -->
    <div class="header">
        <div class="title-group">
            <h1>HLS 视频播放器</h1>
            <div class="hls-badge">HLS</div>
        </div>
        <div class="file-info">
            <span style="color: #6a6a7a;">📁 当前地址</span>
            <span class="file-path" id="filePath">正在获取地址...</span>
        </div>
    </div>

    <!-- ===== 地址输入区域 ===== -->
    <div class="url-input-area">
        <div class="url-input-row">
            <div class="url-input-wrap">
                <input type="text" id="streamUrl"
                       placeholder="输入 HLS 流地址，如 http://example.com/stream.m3u8"
                       spellcheck="false"
                       autocomplete="off" />
            </div>
            <button class="btn btn-primary" id="playBtn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                播放
            </button>
            <button class="btn btn-secondary" id="resetUrlBtn" title="恢复默认地址">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>
        </div>
        <div class="url-hint">
            <span>支持 <strong>HLS (.m3u8)</strong> 流地址，按回车或点击播放加载</span>
            <span class="protocol-detect-badge" id="detectBadge">🎬 HLS</span>
            <span style="color:#f39c12;font-size:12px;" id="detectHint">默认使用动态地址</span>
        </div>
    </div>

    <!-- ===== 播放器 ===== -->
    <div class="player-wrapper">
        <video id="video" muted controls playsinline></video>
    </div>

    <!-- ===== 调试面板 ===== -->
    <div class="debug-panel" id="debugPanel"></div>

    <!-- ===== 信息面板 ===== -->
    <div class="info-panel">
        <div class="info-card">
            <div class="info-label">⏱️ 当前时间</div>
            <div class="info-value highlight" id="currentTime">00:00</div>
        </div>
        <div class="info-card">
            <div class="info-label">📊 总时长</div>
            <div class="info-value" id="duration">--:--</div>
        </div>
        <div class="info-card">
            <div class="info-label">🎬 播放状态</div>
            <div class="info-value" id="playState">加载中</div>
        </div>
        <div class="info-card">
            <div class="info-label">📡 视频编码</div>
            <div class="info-value" id="codecInfo">检测中...</div>
        </div>
        <div class="info-card">
            <div class="info-label">📋 片段类型</div>
            <div class="info-value" id="fragmentType">检测中...</div>
        </div>
        <div class="info-card">
            <div class="info-label">❌ 错误详情</div>
            <div class="error-detail" id="errorDetail">无</div>
        </div>
    </div>

    <!-- ===== 控制栏 ===== -->
    <!-- ===== 控制栏 ===== -->
    <div class="control-bar">
        <button class="btn btn-orange" id="playPauseBtn" onclick="togglePlay()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            播放/暂停
        </button>
        <button class="btn btn-secondary" onclick="skipNextFragment()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
            跳过损坏分片(+3秒)
        </button>
        <button class="btn btn-secondary" onclick="skipPrevFragment()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 6l-8.5 6L18 18V6zM6 18V6h2v12H6z"/>
            </svg>
            回退3秒
        </button>
        <button class="btn btn-secondary" onclick="toggleMute()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            静音
        </button>
        <button class="btn btn-secondary" onclick="reloadPlayer()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            重新加载
        </button>
        <button class="btn btn-secondary" onclick="toggleDebug()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 12c0-1.1.9-2 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-1.99.9-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2zm-4.42 4.8L12 14.5l-3.58 2.3 1.08-4.12-3.29-2.69 4.24-.25L12 5.8l1.54 3.95 4.24.25-3.29 2.69 1.09 4.11z"/>
            </svg>
            调试信息
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>
<div style="margin-top:30px;padding:12px 0;text-align:center;font-size:12px;color:#6a6a7a;border-top:1px solid rgba(255,255,255,0.06);font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
    本页面由 <strong style="color:#6c8cff;"><a href="https://github.com/2723659854/rtmp-server" style="color: white">xiaosongshu/rtmp-server</a></strong> 提供
</div>
<script>
    // ============================================================
    //  1. 核心：动态获取默认地址
    // ============================================================
    function getDynamicBaseUrl() {
        const protocol = window.location.protocol;
        const host = window.location.host;
        return `${protocol}//${host}`;
    }

    function getDefaultHlsSource() {
        const baseUrl = getDynamicBaseUrl();
        const hlsPath = '/hls/a/b/index.m3u8';
        return baseUrl + hlsPath;
    }

    // ============================================================
    //  2. DOM 引用
    // ============================================================
    const video = document.getElementById('video');
    const debugPanel = document.getElementById('debugPanel');
    const streamUrlInput = document.getElementById('streamUrl');
    const playBtn = document.getElementById('playBtn');
    const resetUrlBtn = document.getElementById('resetUrlBtn');
    const detectBadge = document.getElementById('detectBadge');
    const detectHint = document.getElementById('detectHint');
    const filePathSpan = document.getElementById('filePath');

    // 新增：手动播放遮罩层（动态创建）
    let playMask = null;
    function createPlayMask() {
        if(playMask) return;
        playMask = document.createElement('div');
        playMask.style.cssText = `
        position:absolute;left:0;top:0;right:0;bottom:0;
        background:rgba(0,0,0,0.7);display:flex;align-items:center;
        justify-content:center;z-index:99;border-radius:12px;cursor:pointer;
    `;
        playMask.innerHTML = `
        <div style="text-align:center;padding:20px">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="#fff" style="margin:0 auto 10px;">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <p style="color:#fff;font-size:16px;margin:0">点击画面手动播放视频</p>
            <p style="color:#aaa;font-size:12px;margin-top:6px">浏览器限制自动播放，请交互后播放</p>
            <p style="color:#ff9f1c;font-size:12px;margin-top:8px">分片损坏可使用下方按钮跳转时间戳</p>
        </div>
    `;
        playMask.onclick = async () => {
            hidePlayMask();
            await safePlay();
        };
        document.querySelector('.player-wrapper').appendChild(playMask);
    }
    function showPlayMask(){ playMask.style.display = 'flex'; }
    function hidePlayMask(){ playMask.style.display = 'none'; }

    // ============================================================
    //  3. 状态变量
    // ============================================================
    let hls = null;
    let updateTimer = null;
    let debugLogs = [];
    let isDebugMode = false;
    let currentSource = getDefaultHlsSource();

    // 分片错误单独计数，仅用于提示，不阻断加载
    let fragErrorCounter = {
        badFragmentCount: 0,
        reset() { this.badFragmentCount = 0; }
    };

    const CONFIG = {
        // 分片出错跳转步长（秒）
        skipStep: 3,
        // HLS 核心容错配置：关键改动，允许坏分片后继续加载后续分片
        HLS_CONFIG: {
            autoStartLoad: true,
            startPosition: -1,
            debug: false,
            capLevelToPlayerSize: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 600,
            maxBufferSize: 60 * 1000 * 1000,
            maxBufferHole: 2, // 放大缓冲区空洞容忍，不中断加载
            highBufferWatchdogPeriod: 3,
            nudgeOffset: 0.1,
            nudgeMaxRetry: 5,
            maxFragLookUpTolerance: 0.5,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 15,
            enableWorker: true,
            enableSoftwareAES: true,
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 10, // 清单重试拉满，持续获取分片索引
            manifestLoadingRetryDelay: 800,
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 10,
            levelLoadingRetryDelay: 800,
            fragLoadingTimeOut: 15000,
            fragLoadingMaxRetry: 1, // 单个分片仅重试1次，失败直接放弃该分片，不阻塞后续
            fragLoadingRetryDelay: 300,
            // 核心：分片错误不判定为全局致命，仅局部丢弃
            ignoreFragErrors: true,
            manifestLoadPolicy: {
                default: {
                    maxTimeToFirstByteMs: 10000,
                    maxLoadTimeMs: 10000,
                    timeoutRetry: {
                        maxNumRetry: 10,
                        retryDelayMs: 800,
                        maxRetryDelayMs: 3000
                    },
                    errorRetry: {
                        maxNumRetry: 10,
                        retryDelayMs: 800,
                        maxRetryDelayMs: 3000
                    }
                }
            },
            fragLoadPolicy: {
                default: {
                    maxTimeToFirstByteMs: 15000,
                    maxLoadTimeMs: 15000,
                    timeoutRetry: {
                        maxNumRetry: 1,
                        retryDelayMs: 300,
                        maxRetryDelayMs: 1000
                    },
                    errorRetry: {
                        maxNumRetry: 1,
                        retryDelayMs: 300,
                        maxRetryDelayMs: 1000
                    }
                }
            }
        }
    };

    // ============================================================
    //  4. Toast 提示
    // ============================================================
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast toast-${type} show`;
        clearTimeout(toast.hideTimeout);
        toast.hideTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ============================================================
    //  5. 调试日志
    // ============================================================
    function addDebugLog(message, type = 'info') {
        debugLogs.push({ time: new Date().toLocaleTimeString(), message, type });
        if (debugLogs.length > 200) debugLogs.shift();
        updateDebugPanel();
    }

    function updateDebugPanel() {
        if (!isDebugMode) return;
        debugPanel.innerHTML = debugLogs.map(log =>
            `<div class="debug-entry debug-${log.type}">[${log.time}] ${log.message}</div>`
        ).join('');
        debugPanel.scrollTop = debugPanel.scrollHeight;
    }

    function toggleDebug() {
        isDebugMode = !isDebugMode;
        if (isDebugMode) {
            debugPanel.classList.add('show');
            updateDebugPanel();
            showToast('调试模式已开启', 'info');
        } else {
            debugPanel.classList.remove('show');
            showToast('调试模式已关闭', 'info');
        }
    }

    // ============================================================
    //  6. 时间格式化 & UI 更新
    // ============================================================
    function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '--:--';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateUI() {
        if (!video) return;
        document.getElementById('currentTime').textContent = formatTime(video.currentTime);
        if (video.duration && isFinite(video.duration)) {
            document.getElementById('duration').textContent = formatTime(video.duration);
        }

        let state = '就绪';
        if (video.error) state = '解码异常';
        else if (video.readyState === 0) state = '加载清单';
        else if (video.paused && video.currentTime === 0) state = '未播放';
        else if (video.paused) state = '已暂停';
        else if (video.ended) state = '播放完毕';
        else state = '播放中';
        document.getElementById('playState').textContent = state;
    }

    // ============================================================
    //  7. 安全播放函数（修复 play() interrupted 核心）
    // ============================================================
    async function safePlay() {
        try {
            hidePlayMask();
            await video.play();
            addDebugLog('▶️ 播放执行成功', 'success');
            document.getElementById('errorDetail').textContent = '无';
        } catch (err) {
            addDebugLog(`自动播放失败: ${err.message}`, 'warn');
            showPlayMask();
            document.getElementById('errorDetail').textContent = '浏览器阻止自动播放，点击画面手动播放；分片损坏可使用下方跳转按钮';
        }
    }

    // 跳过当前损坏分片，切换下一切片
    function skipNextFragment() {
        const target = video.currentTime + CONFIG.skipStep;
        addDebugLog(`⏭️ 手动跳转，向后跳过 ${CONFIG.skipStep}s，新播放位置:${formatTime(target)}`, 'info');
        video.currentTime = target;
        showToast(`前进${CONFIG.skipStep}秒，继续加载后续分片`, 'success');
    }

    // 回退分片
    function skipPrevFragment() {
        const target = Math.max(0, video.currentTime - CONFIG.skipStep);
        addDebugLog(`⏮️ 手动回退 ${CONFIG.skipStep}s，新播放位置:${formatTime(target)}`, 'info');
        video.currentTime = target;
    }

    // ============================================================
    //  8. HLS 初始化（核心重写容错逻辑）
    // ============================================================
    function initHLS(sourceUrl) {
        createPlayMask();
        hidePlayMask();
        fragErrorCounter.reset();

        let url = sourceUrl || currentSource || getDefaultHlsSource();
        if (!/^https?:\/\//i.test(url)) {
            if (url.startsWith('/')) {
                url = window.location.origin + url;
            } else {
                url = window.location.origin + '/' + url.replace(/^\/+/, '');
            }
        }

        currentSource = url;
        streamUrlInput.value = url;
        filePathSpan.textContent = url;
        filePathSpan.title = url;
        detectBadge.textContent = '🎬 HLS';
        detectBadge.className = 'protocol-detect-badge';
        detectHint.textContent = '使用 HLS (.m3u8) 协议，坏分片自动跳过、持续加载剩余分片';

        addDebugLog(`📡 加载地址: ${url} | 容错模式开启：单个分片损坏不阻塞后续分片加载`, 'info');

        // 销毁旧实例
        if (hls) {
            hls.stopLoad();
            hls.detachMedia();
            hls.destroy();
            hls = null;
        }
        if (updateTimer) {
            clearInterval(updateTimer);
            updateTimer = null;
        }

        document.getElementById('currentTime').textContent = '00:00';
        document.getElementById('duration').textContent = '--:--';
        document.getElementById('playState').textContent = '加载清单中';
        document.getElementById('codecInfo').textContent = '检测中...';
        document.getElementById('fragmentType').textContent = '直播/点播分片';
        document.getElementById('errorDetail').textContent = '无';

        // 原生HLS兼容（Safari）
        if (!Hls.isSupported()) {
            if (video.canPlayType('application/vnd.apple.mpegURL')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    document.getElementById('playState').textContent = '就绪';
                    safePlay();
                });
                document.getElementById('codecInfo').textContent = '原生 HLS';
                showToast('浏览器原生HLS播放，分片损坏请手动拖拽进度', 'info');
                return;
            } else {
                showToast('浏览器不支持 HLS 播放', 'error');
                document.getElementById('playState').textContent = '不支持';
                return;
            }
        }

        hls = new Hls(CONFIG.HLS_CONFIG);

        // 清单解析成功
        hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
            const levels = data.levels;
            addDebugLog(`✅ m3u8索引加载完成，共 ${levels.length} 清晰度，将持续加载所有分片`, 'success');
            if (levels.length > 0) {
                const level = levels[0];
                document.getElementById('codecInfo').textContent = level.attrs?.CODECS || 'avc1.64001f,mp4a.40.2';
            }
            document.getElementById('playState').textContent = '就绪';
            safePlay();
        });

        // 重写错误事件：分片错误仅提示，绝不停止全局加载
        hls.on(Hls.Events.ERROR, function(event, data) {
            const errType = data.type;
            const errDetail = data.details;
            const errMsg = `${errType} - ${errDetail}`;

            // 1. 分片加载/解析损坏：仅计数，自动跳转，持续加载后续分片
            if ([
                Hls.ErrorDetails.FRAG_PARSING_ERROR,
                Hls.ErrorDetails.FRAG_LOAD_ERROR,
                Hls.ErrorDetails.FRAG_LOAD_TIMEOUT,
                Hls.ErrorDetails.BUFFER_APPEND_ERROR
            ].includes(errDetail)) {
                fragErrorCounter.badFragmentCount++;
                addDebugLog(`⚠️ 第${fragErrorCounter.badFragmentCount}个分片损坏，自动跳过，继续加载索引内其余分片`, 'warn');
                document.getElementById('errorDetail').textContent = `已损坏分片总数：${fragErrorCounter.badFragmentCount}，播放器持续加载后续分片，可手动跳转时间戳`;
                // 自动跳片，不阻断加载器
                skipNextFragment();
                showToast(`检测到损坏分片，自动跳过，其余分片正常加载`, 'warning');
                // 标记非致命，hls内部继续请求下一个分片
                data.fatal = false;
                return;
            }

            // 2. 网络完全断开（唯一真正致命场景）
            if (errType === Hls.ErrorTypes.NETWORK_ERROR && errDetail === Hls.ErrorDetails.MANIFEST_LOAD_ERROR) {
                addDebugLog(`❌ 无法加载m3u8索引文件，网络完全断开`, 'error');
                document.getElementById('errorDetail').textContent = '无法获取分片索引，请检查服务是否正常';
                document.getElementById('playState').textContent = '索引加载失败';
                showPlayMask();
                return;
            }

            // 3. 其余非致命错误：仅日志提示，不停止加载
            addDebugLog(`ℹ️ 非致命告警：${errMsg}，不影响后续分片加载`, 'debug');
            data.fatal = false;
        });

        hls.on(Hls.Events.LEVEL_SWITCHING, (e, d) => addDebugLog(`切换清晰度级别: ${d.level}`, 'info'));
        hls.on(Hls.Events.LEVEL_SWITCHED, (e, d) => addDebugLog(`清晰度切换完成: ${d.level}`, 'success'));
        hls.on(Hls.Events.BUFFER_FLUSHING, () => addDebugLog('缓冲区刷新', 'debug'));
        hls.on(Hls.Events.FRAG_LOADED, () => addDebugLog('正常分片加载完成', 'debug'));

        addDebugLog(`⏳ 开始加载m3u8索引，持续请求全部分片，单个损坏分片自动跳过`, 'info');
        hls.loadSource(url);
        hls.attachMedia(video);
        document.getElementById('playState').textContent = '加载分片索引...';
        updateTimer = setInterval(updateUI, 500);
        showToast('开启容错模式：坏分片不阻塞后续分片加载', 'success');
    }

    // ============================================================
    //  10. 控制函数
    // ============================================================
    function togglePlay() {
        if (!video) return;
        if (video.paused) {
            if (video.ended) video.currentTime = 0;
            safePlay();
        } else {
            video.pause();
        }
    }

    function toggleMute() {
        if (!video) return;
        video.muted = !video.muted;
        showToast(video.muted ? '已静音' : '已取消静音', 'info');
    }

    function reloadPlayer() {
        addDebugLog('🔄 手动重载播放器，重置分片错误计数', 'info');
        fragErrorCounter.reset();
        const url = streamUrlInput.value.trim() || currentSource || getDefaultHlsSource();
        initHLS(url);
        showToast('播放器重载，容错模式生效', 'success');
    }

    // ============================================================
    //  11. 播放指定地址
    // ============================================================
    function playStream() {
        let url = streamUrlInput.value.trim();
        if (!url) url = getDefaultHlsSource();
        if (!/^https?:\/\//i.test(url)) {
            url = window.location.origin + (url.startsWith('/') ? url : '/' + url.replace(/^\/+/, ''));
            streamUrlInput.value = url;
        }
        addDebugLog(`▶️ 切换流地址: ${url}`, 'info');
        initHLS(url);
        showToast('切换流地址，持续加载所有分片', 'success');
    }

    // ============================================================
    //  12. 重置默认地址
    // ============================================================
    function resetToDefault() {
        const defaultUrl = getDefaultHlsSource();
        streamUrlInput.value = defaultUrl;
        detectBadge.textContent = '🎬 HLS (默认容错模式)';
        detectHint.textContent = '默认地址，单个分片损坏不阻塞加载';
        addDebugLog(`🔄 重置默认地址: ${defaultUrl}`, 'info');
        initHLS(defaultUrl);
        showToast('已恢复默认流地址', 'success');
    }

    // ============================================================
    //  13. 视频原生事件
    // ============================================================
    video.addEventListener('playing', () => {
        hidePlayMask();
        updateUI();
    });
    video.addEventListener('pause', updateUI);
    video.addEventListener('ended', () => {
        document.getElementById('playState').textContent = '播放完毕';
    });
    video.addEventListener('error', (e) => {
        const err = video.error;
        let msg = '视频解码异常';
        if (err?.code === 3) msg = '当前分片解码失败，播放器仍在加载后续分片，可点击跳过分片';
        addDebugLog(`视频元素告警: ${msg}`, 'warn');
        document.getElementById('errorDetail').textContent = msg;
        showPlayMask();
    });

    // ============================================================
    //  14. 键盘快捷键
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            if (e.key === 'Enter') playStream();
            return;
        }
        switch (e.key.toLowerCase()) {
            case ' ': e.preventDefault(); togglePlay(); break;
            case 'arrowleft': e.preventDefault(); skipPrevFragment(); break;
            case 'arrowright': e.preventDefault(); skipNextFragment(); break;
            case 'arrowup': video.volume = Math.min(1, video.volume + 0.1); break;
            case 'arrowdown': video.volume = Math.max(0, video.volume - 0.1); break;
            case 'm': toggleMute(); break;
            case 'f': document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen(); break;
            case 'r': reloadPlayer(); break;
            case 'd': toggleDebug(); break;
        }
    });

    // ============================================================
    //  15. 按钮绑定
    // ============================================================
    playBtn.addEventListener('click', playStream);
    resetUrlBtn.addEventListener('click', resetToDefault);
    streamUrlInput.addEventListener('keydown', e => e.key === 'Enter' && playStream());
    streamUrlInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (/\.m3u8/i.test(val)) {
            detectBadge.textContent = '🎬 HLS 容错';
            detectBadge.className = 'protocol-detect-badge';
            detectHint.textContent = '坏分片自动跳过，持续加载全部索引分片';
        } else if (val) {
            detectBadge.textContent = '📄 未知';
            detectBadge.className = 'protocol-detect-badge unknown';
            detectHint.textContent = '请输入 .m3u8 索引地址';
        } else {
            detectBadge.textContent = '🎬 HLS';
            detectHint.textContent = '输入HLS地址，容错模式自动开启';
        }
    });
    document.getElementById('playPauseBtn').addEventListener('click', togglePlay);

    // ============================================================
    //  16. 页面初始化
    // ============================================================
    const defaultUrl = getDefaultHlsSource();
    streamUrlInput.value = defaultUrl;
    detectBadge.textContent = '🎬 HLS 默认容错';
    detectHint.textContent = '启动容错模式：单个分片损坏不阻塞后续分片加载';
    addDebugLog(`🚀 播放器启动，默认地址: ${defaultUrl} | 核心优化：损坏分片不中断全局加载`, 'success');
    initHLS(defaultUrl);

    // 全局暴露函数
    window.togglePlay = togglePlay;
    window.toggleMute = toggleMute;
    window.reloadPlayer = reloadPlayer;
    window.toggleDebug = toggleDebug;
    window.playStream = playStream;
    window.resetToDefault = resetToDefault;
    window.skipNextFragment = skipNextFragment;
    window.skipPrevFragment = skipPrevFragment;

    console.log('[HLS容错播放器] 已启动');
    console.log('[机制说明] 单个TS分片加载/解析失败仅自动跳转，m3u8内其余分片持续请求，播放控制权交给用户手动跳转');
    console.log('[快捷键] ←回退 | →跳过损坏分片 | 空格播放暂停 | R重载');

</script>
</body>
</html>
