<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>HLS直播录播视频播放器</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1430 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(20, 25, 45, 0.9);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(64, 128, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hls-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0a0b0;
        }

        .file-path {
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 6px;
            color: #f39c12;
            font-size: 12px;
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 0 100px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            outline: none;
            background: #000;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .info-label {
            font-size: 11px;
            color: #6a6a7a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-value {
            font-size: 16px;
            color: #e0e0e0;
            font-weight: 500;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
        }

        .info-value.highlight {
            color: #f39c12;
        }

        .error-detail {
            font-size: 11px;
            color: #f44336;
            word-break: break-all;
            max-height: 60px;
            overflow-y: auto;
        }

        .debug-panel {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-height: 200px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            display: none;
        }

        .debug-panel.show {
            display: block;
        }

        .debug-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .debug-error {
            color: #f44336;
        }
        .debug-warn {
            color: #ff9800;
        }
        .debug-info {
            color: #6c8cff;
        }
        .debug-success {
            color: #4caf50;
        }

        .control-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: white;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-info {
            background: linear-gradient(135deg, #4a6cf7, #6c8cff);
        }

        .toast-error {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .toast-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
        }

        .toast-warning {
            background: linear-gradient(135deg, #e67e22, #f39c12);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .player-container {
                padding: 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 18px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .info-panel {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .control-bar {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="player-container">
    <div class="header">
        <div class="title-group">
            <h1>HLS 视频播放器</h1>
            <div class="hls-badge">HLS</div>
        </div>
        <div class="file-info">
            <span style="color: #6a6a7a;">📁 动态地址</span>
            <span class="file-path" id="filePath">正在获取地址...</span>
        </div>
    </div>

    <div class="player-wrapper">
        <video id="video" muted controls playsinline></video>
    </div>

    <!-- 调试面板 -->
    <div class="debug-panel" id="debugPanel"></div>

    <div class="info-panel">
        <div class="info-card">
            <div class="info-label">⏱️ 当前时间</div>
            <div class="info-value highlight" id="currentTime">00:00</div>
        </div>
        <div class="info-card">
            <div class="info-label">📊 总时长</div>
            <div class="info-value" id="duration">--:--</div>
        </div>
        <div class="info-card">
            <div class="info-label">🎬 播放状态</div>
            <div class="info-value" id="playState">加载中</div>
        </div>
        <div class="info-card">
            <div class="info-label">📡 视频编码</div>
            <div class="info-value" id="codecInfo">检测中...</div>
        </div>
        <div class="info-card">
            <div class="info-label">📋 片段类型</div>
            <div class="info-value" id="fragmentType">检测中...</div>
        </div>
        <div class="info-card">
            <div class="info-label">❌ 错误详情</div>
            <div class="error-detail" id="errorDetail">无</div>
        </div>
    </div>

    <div class="control-bar">
        <button class="btn btn-primary" id="playPauseBtn" onclick="togglePlay()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            播放
        </button>
        <button class="btn btn-secondary" onclick="toggleMute()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            静音
        </button>
        <button class="btn btn-secondary" onclick="reloadPlayer()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            重新加载
        </button>
        <button class="btn btn-secondary" onclick="toggleDebug()">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 12c0-1.1.9-2 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-1.99.9-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2zm-4.42 4.8L12 14.5l-3.58 2.3 1.08-4.12-3.29-2.69 4.24-.25L12 5.8l1.54 3.95 4.24.25-3.29 2.69 1.09 4.11z"/>
            </svg>
            调试信息
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ============ 核心方法：动态获取当前基础地址 ============
    function getDynamicBaseUrl() {
        const protocol = window.location.protocol;
        const host = window.location.host;
        return `${protocol}//${host}`;
    }

    function getHlsSource() {
        const baseUrl = getDynamicBaseUrl();
        const hlsPath = '/hls/a/b/index.m3u8';
        const fullUrl = baseUrl + hlsPath;
        console.log(`[HLS播放器] 动态生成流地址: ${fullUrl}`);
        return fullUrl;
    }

    function updateFilePathDisplay(url) {
        const filePathSpan = document.getElementById('filePath');
        if (filePathSpan) {
            filePathSpan.textContent = url;
            filePathSpan.title = url;
        }
    }

    const CURRENT_SOURCE = getHlsSource();
    updateFilePathDisplay(CURRENT_SOURCE);

    const CONFIG = {
        SOURCE: CURRENT_SOURCE,
        // 【新增】重试配置
        MAX_RETRY_COUNT: 5,        // 最大重试次数
        MAX_RECOVER_COUNT: 3,      // 最大恢复次数

        HLS_CONFIG: {
            autoStartLoad: true,
            startPosition: -1,
            debug: false,           // 【修改】关闭调试模式减少日志
            capLevelToPlayerSize: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 600,
            maxBufferSize: 60 * 1000 * 1000,
            maxBufferHole: 0.5,
            highBufferWatchdogPeriod: 1,
            nudgeOffset: 0.1,
            nudgeMaxRetry: 3,       // 【新增】nudge 重试次数
            maxFragLookUpTolerance: 0.25,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 10,
            enableWorker: true,
            enableSoftwareAES: true,

            // 【修改】超时和重试配置
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 2,     // 【新增】清单加载最大重试
            manifestLoadingRetryDelay: 500,

            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 2,        // 【新增】级别加载最大重试
            levelLoadingRetryDelay: 500,

            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 3,         // 【新增】片段加载最大重试
            fragLoadingRetryDelay: 500,

            // 【新增】使用新版超时策略
            manifestLoadPolicy: {
                default: {
                    maxTimeToFirstByteMs: 10000,
                    maxLoadTimeMs: 10000,
                    timeoutRetry: {
                        maxNumRetry: 2,
                        retryDelayMs: 500,
                        maxRetryDelayMs: 2000
                    },
                    errorRetry: {
                        maxNumRetry: 2,
                        retryDelayMs: 500,
                        maxRetryDelayMs: 2000
                    }
                }
            },
            fragLoadPolicy: {
                default: {
                    maxTimeToFirstByteMs: 20000,
                    maxLoadTimeMs: 20000,
                    timeoutRetry: {
                        maxNumRetry: 3,
                        retryDelayMs: 500,
                        maxRetryDelayMs: 2000
                    },
                    errorRetry: {
                        maxNumRetry: 3,
                        retryDelayMs: 500,
                        maxRetryDelayMs: 2000
                    }
                }
            }
        }
    };

    const video = document.getElementById('video');
    const debugPanel = document.getElementById('debugPanel');
    let hls = null;
    let updateTimer = null;
    let debugLogs = [];
    let isDebugMode = false;

    // 【新增】全局错误计数器
    let errorCounter = {
        mediaErrors: 0,
        networkErrors: 0,
        muxErrors: 0,
        otherErrors: 0,
        recoverAttempts: 0,
        totalErrors: 0,
        lastErrorTime: 0,
        reset() {
            this.mediaErrors = 0;
            this.networkErrors = 0;
            this.muxErrors = 0;
            this.otherErrors = 0;
            this.recoverAttempts = 0;
            this.totalErrors = 0;
            this.lastErrorTime = 0;
        }
    };

    // 【新增】检查是否超过最大重试次数
    function hasExceededMaxRetries() {
        const totalErrors = errorCounter.mediaErrors +
            errorCounter.networkErrors +
            errorCounter.muxErrors +
            errorCounter.otherErrors;

        return totalErrors >= CONFIG.MAX_RETRY_COUNT ||
            errorCounter.recoverAttempts >= CONFIG.MAX_RECOVER_COUNT;
    }

    // 【新增】检查错误频率（防止短时间内大量错误）
    function isErrorFlooding() {
        const now = Date.now();
        if (now - errorCounter.lastErrorTime < 1000) {
            errorCounter.totalErrors++;
            return errorCounter.totalErrors > 10; // 1秒内超过10个错误
        } else {
            errorCounter.totalErrors = 1;
            return false;
        }
    }

    // ============ Toast ============
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast toast-${type} show`;
        clearTimeout(toast.hideTimeout);
        toast.hideTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000); // 【修改】缩短显示时间
    }

    // ============ 调试日志 ============
    function addDebugLog(message, type = 'info') {
        debugLogs.push({ time: new Date().toLocaleTimeString(), message, type });
        if (debugLogs.length > 200) debugLogs.shift(); // 【修改】增加日志容量
        updateDebugPanel();
    }

    function updateDebugPanel() {
        if (!isDebugMode) return;
        debugPanel.innerHTML = debugLogs.map(log =>
            `<div class="debug-entry debug-${log.type}">[${log.time}] ${log.message}</div>`
        ).join('');
        debugPanel.scrollTop = debugPanel.scrollHeight;
    }

    function toggleDebug() {
        isDebugMode = !isDebugMode;
        if (isDebugMode) {
            debugPanel.classList.add('show');
            updateDebugPanel();
            showToast('调试模式已开启 (错误: ' + (errorCounter.mediaErrors + errorCounter.networkErrors + errorCounter.muxErrors + errorCounter.otherErrors) + ' 次)', 'info');
        } else {
            debugPanel.classList.remove('show');
            showToast('调试模式已关闭', 'info');
        }
    }

    // ============ 时间格式化 ============
    function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '--:--';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateUI() {
        if (!video) return;
        document.getElementById('currentTime').textContent = formatTime(video.currentTime);
        if (video.duration && isFinite(video.duration)) {
            document.getElementById('duration').textContent = formatTime(video.duration);
        }

        let state = '就绪';
        if (video.error) state = '错误';
        else if (video.readyState === 0) state = '加载中';
        else if (video.paused && video.currentTime === 0) state = '未播放';
        else if (video.paused) state = '已暂停';
        else if (video.ended) state = '播放完毕';
        else state = '播放中';
        document.getElementById('playState').textContent = state;
    }

    // ============ 初始化 HLS ============
    function initHLS() {
        // 【修改】清理旧实例
        if (hls) {
            hls.stopLoad();
            hls.detachMedia();
            hls.destroy();
            hls = null;
        }
        if (updateTimer) {
            clearInterval(updateTimer);
            updateTimer = null;
        }

        // 重置状态
        errorCounter.reset();
        document.getElementById('currentTime').textContent = '00:00';
        document.getElementById('duration').textContent = '--:--';
        document.getElementById('playState').textContent = '加载中';
        document.getElementById('codecInfo').textContent = '检测中...';
        document.getElementById('fragmentType').textContent = '检测中...';
        document.getElementById('errorDetail').textContent = '无';
        debugLogs = [];

        const currentSource = getHlsSource();
        updateFilePathDisplay(currentSource);
        CONFIG.SOURCE = currentSource;

        // 检查浏览器支持
        if (!Hls.isSupported()) {
            if (video.canPlayType('application/vnd.apple.mpegURL')) {
                video.src = CONFIG.SOURCE;
                video.addEventListener('loadedmetadata', () => {
                    document.getElementById('playState').textContent = '就绪';
                    video.play().catch(e => console.warn('自动播放失败:', e));
                });
                document.getElementById('codecInfo').textContent = '原生 HLS';
                document.getElementById('fragmentType').textContent = 'N/A';
                showToast('使用原生 HLS 播放', 'info');
            } else {
                showToast('浏览器不支持 HLS 播放', 'error');
                document.getElementById('playState').textContent = '不支持';
            }
            return;
        }

        hls = new Hls(CONFIG.HLS_CONFIG);

        // 清单解析完成
        hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
            const levels = data.levels;
            addDebugLog(`清单解析成功: ${levels.length} 个质量级别`, 'success');

            if (levels.length > 0) {
                const level = levels[0];
                if (!level.attrs?.CODECS) {
                    const forcedCodecs = 'avc1.64001f,mp4a.40.2';
                    if (level.audioCodec === undefined) {
                        level.audioCodec = 'mp4a.40.2';
                    }
                    if (level.videoCodec === undefined) {
                        level.videoCodec = 'avc1.64001f';
                    }
                    document.getElementById('codecInfo').textContent = forcedCodecs;
                } else {
                    document.getElementById('codecInfo').textContent = level.attrs.CODECS;
                }
            }

            document.getElementById('playState').textContent = '就绪';
            video.play().catch(e => {
                addDebugLog(`自动播放失败: ${e.message}`, 'warn');
            });
        });

        // 【修改】错误处理 - 限制重试次数
        hls.on(Hls.Events.ERROR, function(event, data) {
            const now = Date.now();
            errorCounter.lastErrorTime = now;

            // 检查错误频率
            if (isErrorFlooding()) {
                addDebugLog('🛑 错误频率过高，停止重试', 'error');
                document.getElementById('errorDetail').textContent = '错误频率过高，已停止重试';
                document.getElementById('playState').textContent = '错误停止';
                hls.stopLoad();
                showToast('错误过多，已停止加载。请重新加载页面', 'error');
                return;
            }

            // 检查是否超过最大重试次数
            if (hasExceededMaxRetries()) {
                addDebugLog(`🛑 已达到最大重试次数 (${CONFIG.MAX_RETRY_COUNT})，停止重试`, 'error');
                document.getElementById('errorDetail').textContent = '已达最大重试次数，请重新加载';
                document.getElementById('playState').textContent = '重试耗尽';
                hls.stopLoad();
                showToast('重试次数已耗尽，请重新加载页面', 'error');
                return;
            }

            const errorMsg = `${data.type} / ${data.details}`;

            if (data.fatal) {
                addDebugLog(`❌ 致命错误 #${errorCounter.mediaErrors + errorCounter.networkErrors + 1}: ${errorMsg}`, 'error');

                if (data.error) {
                    addDebugLog(`详情: ${data.error.message || data.error}`, 'error');
                }

                switch(data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        errorCounter.networkErrors++;
                        document.getElementById('errorDetail').textContent =
                            `网络错误 (${errorCounter.networkErrors}/${CONFIG.MAX_RETRY_COUNT})`;

                        if (hasExceededMaxRetries()) {
                            addDebugLog('🛑 网络错误次数过多，停止加载', 'error');
                            showToast('网络错误次数过多，请检查网络连接', 'error');
                            document.getElementById('playState').textContent = '网络错误停止';
                            hls.stopLoad();
                        } else {
                            addDebugLog(`🔄 尝试网络恢复... (${errorCounter.networkErrors}/${CONFIG.MAX_RETRY_COUNT})`, 'warn');
                            setTimeout(() => {
                                if (hls && !hasExceededMaxRetries()) {
                                    hls.startLoad();
                                }
                            }, 1000);
                        }
                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:
                        errorCounter.mediaErrors++;
                        document.getElementById('errorDetail').textContent =
                            `媒体错误 (${errorCounter.mediaErrors}/${CONFIG.MAX_RETRY_COUNT})`;

                        if (data.details === Hls.ErrorDetails.BUFFER_APPEND_ERROR) {
                            errorCounter.muxErrors++;
                            addDebugLog(`缓冲区追加错误 (复用错误: ${errorCounter.muxErrors})`, 'error');
                            addDebugLog('可能原因: 视频编码不兼容或 TS 片段格式异常', 'info');
                        }

                        if (hasExceededMaxRetries()) {
                            addDebugLog('🛑 媒体错误次数过多，停止加载', 'error');
                            showToast('媒体错误过多，视频编码可能不兼容', 'error');
                            document.getElementById('playState').textContent = '媒体错误停止';
                            hls.stopLoad();
                        } else if (errorCounter.recoverAttempts < CONFIG.MAX_RECOVER_COUNT) {
                            errorCounter.recoverAttempts++;
                            addDebugLog(`🔄 尝试媒体恢复... (${errorCounter.recoverAttempts}/${CONFIG.MAX_RECOVER_COUNT})`, 'warn');
                            setTimeout(() => {
                                if (hls && !hasExceededMaxRetries()) {
                                    hls.recoverMediaError();
                                }
                            }, 500);
                        } else {
                            addDebugLog('🛑 恢复次数耗尽，停止加载', 'error');
                            document.getElementById('playState').textContent = '恢复失败';
                            hls.stopLoad();
                        }
                        break;

                    case Hls.ErrorTypes.MUX_ERROR:
                        errorCounter.muxErrors++;
                        document.getElementById('errorDetail').textContent =
                            `复用错误 (${errorCounter.muxErrors}/${CONFIG.MAX_RETRY_COUNT})`;

                        if (hasExceededMaxRetries()) {
                            addDebugLog('🛑 复用错误次数过多，停止加载', 'error');
                            showToast('视频复用错误过多，源文件可能损坏', 'error');
                            document.getElementById('playState').textContent = '复用错误停止';
                            hls.stopLoad();
                        } else if (errorCounter.recoverAttempts < CONFIG.MAX_RECOVER_COUNT) {
                            errorCounter.recoverAttempts++;
                            addDebugLog(`🔄 尝试恢复复用错误... (${errorCounter.recoverAttempts}/${CONFIG.MAX_RECOVER_COUNT})`, 'warn');
                            setTimeout(() => {
                                if (hls && !hasExceededMaxRetries()) {
                                    hls.recoverMediaError();
                                }
                            }, 500);
                        }
                        break;

                    default:
                        errorCounter.otherErrors++;
                        document.getElementById('errorDetail').textContent =
                            `其他错误 (${errorCounter.otherErrors}/${CONFIG.MAX_RETRY_COUNT})`;

                        if (hasExceededMaxRetries()) {
                            addDebugLog('🛑 错误次数过多，停止加载', 'error');
                            showToast('播放器遇到严重错误，请重新加载', 'error');
                            document.getElementById('playState').textContent = '严重错误';
                            hls.stopLoad();
                        } else {
                            addDebugLog('尝试恢复...', 'warn');
                            setTimeout(() => {
                                if (hls && !hasExceededMaxRetries()) {
                                    hls.startLoad();
                                }
                            }, 1000);
                        }
                        break;
                }
            } else {
                // 非致命错误
                addDebugLog(`⚠️ 非致命错误: ${errorMsg}`, 'warn');

                if (data.details === 'internalException') {
                    errorCounter.muxErrors++;
                    addDebugLog(`内部异常 (${errorCounter.muxErrors}/${CONFIG.MAX_RETRY_COUNT})`, 'warn');
                }
            }
        });

        // 级别切换警告
        hls.on(Hls.Events.LEVEL_SWITCHING, function(event, data) {
            addDebugLog(`切换到级别: ${data.level}`, 'info');
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
            addDebugLog(`级别切换完成: ${data.level}`, 'success');
        });

        // 缓冲警告
        hls.on(Hls.Events.BUFFER_FLUSHING, function() {
            addDebugLog('缓冲区刷新中...', 'warn');
        });

        hls.on(Hls.Events.BACK_BUFFER_REACHED, function() {
            addDebugLog('达到后向缓冲区限制', 'debug');
        });

        // 开始加载
        addDebugLog(`开始加载: ${CONFIG.SOURCE}`, 'info');
        addDebugLog(`最大重试次数: ${CONFIG.MAX_RETRY_COUNT}, 最大恢复次数: ${CONFIG.MAX_RECOVER_COUNT}`, 'info');

        hls.loadSource(CONFIG.SOURCE);
        hls.attachMedia(video);
        document.getElementById('playState').textContent = '加载中...';

        // 定时更新 UI
        updateTimer = setInterval(updateUI, 500);

        // 【新增】定时检查错误状态
        let healthCheckTimer = setInterval(() => {
            if (hasExceededMaxRetries() && hls) {
                clearInterval(healthCheckTimer);
                addDebugLog('🛑 健康检查发现错误超限，停止播放器', 'error');
                hls.stopLoad();
            }
        }, 2000);

        // 清理定时器
        video.addEventListener('loadeddata', () => {
            clearInterval(healthCheckTimer);
        }, { once: true });
    }

    // ============ 控制函数 ============
    function togglePlay() {
        if (!video) return;
        if (video.paused) {
            if (video.ended) video.currentTime = 0;
            video.play().catch(e => {
                addDebugLog(`播放失败: ${e.message}`, 'error');
            });
        } else {
            video.pause();
        }
    }

    function toggleMute() {
        if (!video) return;
        video.muted = !video.muted;
    }

    function reloadPlayer() {
        addDebugLog('🔄 手动重新加载播放器', 'info');
        initHLS();
        showToast('播放器已重新加载', 'success');
    }

    // ============ 事件监听 ============
    video.addEventListener('playing', () => updateUI());
    video.addEventListener('pause', () => updateUI());
    video.addEventListener('ended', () => {
        document.getElementById('playState').textContent = '播放完毕';
    });
    video.addEventListener('error', (e) => {
        const error = video.error;
        let msg = '未知错误';
        if (error) {
            switch(error.code) {
                case 1: msg = 'MEDIA_ERR_ABORTED'; break;
                case 2: msg = 'MEDIA_ERR_NETWORK'; break;
                case 3: msg = 'MEDIA_ERR_DECODE - 解码失败'; break;
                case 4: msg = 'MEDIA_ERR_SRC_NOT_SUPPORTED'; break;
            }
        }
        addDebugLog(`视频元素错误: ${msg}`, 'error');
        document.getElementById('errorDetail').textContent = msg;
        document.getElementById('playState').textContent = '解码错误';
    });

    // ============ 键盘快捷键 ============
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        switch(e.key.toLowerCase()) {
            case ' ': e.preventDefault(); togglePlay(); break;
            case 'arrowleft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); break;
            case 'arrowright': e.preventDefault(); video.currentTime = Math.min(video.duration || video.currentTime, video.currentTime + 5); break;
            case 'arrowup': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); break;
            case 'arrowdown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); break;
            case 'm': e.preventDefault(); toggleMute(); break;
            case 'f': e.preventDefault();
                if (document.fullscreenElement) document.exitFullscreen();
                else video.requestFullscreen().catch(e => console.warn('全屏失败:', e));
                break;
            case 'r': e.preventDefault(); reloadPlayer(); break;
            case 'd': e.preventDefault(); toggleDebug(); break;
        }
    });

    // ============ 启动 ============
    initHLS();
</script>
</body>
</html>
