<!DOCTYPE html>
<html>
<head>
    <title>FLV 推流测试（MediaRecorder + mux.js + HTTP 推流）</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: monospace; padding: 20px; }
        button { margin: 5px; padding: 6px 12px; cursor: pointer; }
        #status { margin: 10px 0; font-size: 14px; }
        video { border: 1px solid #ccc; margin-bottom: 10px; }
    </style>
    <!-- 引入 mux.js -->
    <script src="https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.js"></script>
</head>
<body>
<h3>FLV 直播推流（HTTP 接口）</h3>
<video id="preview" autoplay muted playsinline controls width="640"></video>
<div>
    <button id="startBtn">开始推流</button>
    <button id="stopBtn" disabled>停止推流</button>
</div>
<div id="status">⚪ 未推流</div>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', initApp);

    function initApp() {
        // DOM 元素
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');

        // 推流接口地址
        const PUSH_URL = "http://127.0.0.1:8501/a/b";
        // 每帧分片间隔(ms)
        const SLICE_INTERVAL = 1000;

        let mediaRecorder = null;
        let stream = null;
        let flvMuxer = null;
        let isPushing = false;

        // 状态更新
        function setStatus(text, isError = false) {
            if (isError) {
                statusDiv.innerHTML = `❌ ${text}`;
            } else {
                statusDiv.innerHTML = `✅ ${text}`;
            }
            console.log('[状态]', text);
        }

        /**
         * WebM 解封装 + FLV 封装 处理器
         * 输入：WebM ArrayBuffer
         * 输出：标准FLV二进制数据
         */
        class WebM2FLV {
            constructor(onFlvOutput) {
                this.onFlvOutput = onFlvOutput;
                // WebM 解封装器
                this.demuxer = new muxjs.webm.Demuxer();
                // FLV 封装器
                this.muxer = new muxjs.flv.Muxer();

                // 解封装回调：提取音视频裸流
                this.demuxer.on('data', (frame) => {
                    const { type, data, pts, dts } = frame;
                    if (type === 'video') {
                        this.muxer.addVideoFrame(data, pts, dts);
                    } else if (type === 'audio') {
                        this.muxer.addAudioFrame(data, pts, dts);
                    }
                });

                // FLV 封装完成，输出二进制
                this.muxer.on('data', (flvBuffer) => {
                    this.onFlvOutput && this.onFlvOutput(flvBuffer);
                });
            }

            // 写入 WebM 二进制数据
            feed(buffer) {
                if (!buffer || buffer.byteLength === 0) return;
                this.demuxer.push(buffer);
            }

            // 销毁实例，释放资源
            destroy() {
                this.demuxer.dispose();
                this.muxer.dispose();
                this.demuxer = null;
                this.muxer = null;
            }
        }

        /**
         * HTTP 二进制上传推流
         * @param {ArrayBuffer} flvBuffer FLV 二进制数据
         */
        async function pushFlvToServer(flvBuffer) {
            if (!isPushing) return;
            try {
                const response = await fetch(PUSH_URL, {
                    method: 'POST',
                    body: flvBuffer,
                    headers: {
                        'Content-Type': 'application/octet-stream'
                    },
                    mode: 'cors'
                });
                if (!response.ok) {
                    console.warn(`[HTTP推流] 请求异常: ${response.status}`);
                }
            } catch (err) {
                console.error('[HTTP推流] 上传失败:', err);
            }
        }

        /**
         * 停止推流 & 全量资源释放
         */
        async function stopStreaming() {
            isPushing = false;

            // 停止录制
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            mediaRecorder = null;

            // 停止媒体流
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            preview.srcObject = null;

            // 销毁封装器
            if (flvMuxer) {
                flvMuxer.destroy();
                flvMuxer = null;
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            setStatus('已停止推流');
        }

        /**
         * 开始推流主逻辑
         */
        async function startStreaming() {
            if (isPushing) return;
            isPushing = true;
            setStatus('正在请求摄像头/麦克风...');

            try {
                // 1. 获取媒体流 720P 30帧
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    },
                    audio: true
                });
                preview.srcObject = stream;
                setStatus('媒体获取成功，初始化封装器...');

                // 2. 初始化 WebM -> FLV 转换器
                flvMuxer = new WebM2FLV(pushFlvToServer);

                // 3. 兼容浏览器编码，优先 H264+AAC
                let mimeType = '';
                const mimeList = [
                    'video/webm;codecs="avc1.42E01E, mp4a.40.2"',
                    'video/webm;codecs=h264,aac',
                    'video/webm'
                ];
                for (const mime of mimeList) {
                    if (MediaRecorder.isTypeSupported(mime)) {
                        mimeType = mime;
                        break;
                    }
                }

                // 4. 初始化录制器
                const recorderOpts = mimeType ? { mimeType } : {};
                mediaRecorder = new MediaRecorder(stream, recorderOpts);

                // 5. 数据回调：接收 WebM 分片，转为 FLV 并上传
                mediaRecorder.ondataavailable = async (e) => {
                    if (!e.data || e.data.size === 0 || !isPushing) return;
                    // 原生异步转换，替代老旧 FileReader
                    const arrayBuf = await e.data.arrayBuffer();
                    flvMuxer.feed(arrayBuf);
                };

                // 录制异常监听
                mediaRecorder.onerror = (err) => {
                    console.error('[录制异常]', err);
                    setStatus('录制出错', true);
                    stopStreaming();
                };

                // 启动录制
                mediaRecorder.start(SLICE_INTERVAL);
                startBtn.disabled = true;
                stopBtn.disabled = false;
                setStatus('FLV 推流中（HTTP）');

            } catch (err) {
                console.error('[启动失败]', err);
                setStatus(`启动失败: ${err.message}`, true);
                isPushing = false;
            }
        }

        // 绑定按钮事件
        startBtn.addEventListener('click', startStreaming);
        stopBtn.addEventListener('click', stopStreaming);
    }
</script>
</body>
</html>
