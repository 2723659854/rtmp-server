<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLV+H264 标准推流</title>
    <script src="/aliplayer-min.js"></script>
    <link rel="stylesheet" href="/aliplayer-min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; color: #eee; padding: 20px; }
        .ctrl { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #222; padding: 10px 20px; border-radius: 8px; z-index: 999; }
        button { padding: 6px 16px; margin: 0 5px; cursor: pointer; }
        .log { position: fixed; bottom: 10px; left: 10px; right: 10px; height: 120px; background: #000; padding: 8px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .drag-player { position: absolute; width: 320px; height: 220px; background: #000; border: 2px solid #4cc9f0; border-radius: 6px; overflow: hidden; }
        .drag-header { height: 26px; line-height: 26px; background: #4cc9f0; color: #000; text-align: center; cursor: move; font-size: 12px; }
        .prism-player { width: 100%; height: calc(100% - 26px); }
        #player1 { top: 80px; left: 20px; }
        #player2 { top: 80px; left: 360px; }
        #mergeCanvas { position: fixed; left: -9999px; top: -9999px; width: 300px; height: 150px; }
    </style>
</head>
<body>
<div class="ctrl">
    <span>FLV + 标准H264(SPS/PPS+起始码) 300x150 25fps</span>
    <button id="btnStart">开始推流</button>
    <button id="btnStop">停止推流</button>
</div>

<div class="drag-player" id="player1">
    <div class="drag-header">流 A /a/b.flv</div>
    <div class="prism-player" id="p1"></div>
</div>
<div class="drag-player" id="player2">
    <div class="drag-header">流 B /a/c.flv</div>
    <div class="prism-player" id="p2"></div>
</div>

<canvas id="mergeCanvas" width="300" height="150"></canvas>
<div class="log" id="log"></div>

<script>
    const WS_URL = "ws://127.0.0.1:8501/a/merge";
    const SRC1 = "ws://127.0.0.1:8501/a/b.flv";
    const SRC2 = "ws://127.0.0.1:8501/a/c.flv";

    const canvas = document.getElementById("mergeCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const FPS = 25;
    const FRAME_INTERVAL = 1000 / FPS;

    let player1, player2;
    let ws = null;
    let pushTimer = null;
    let isPushing = false;
    let ts = 0;
    let spsPpsSent = false;

    // 标准 300x150 H264 SPS/PPS (Annex-B 带 00 00 00 01 起始码)
    const SPS = new Uint8Array([
        0x00,0x00,0x00,0x01,0x67,0x42,0x00,0x1E,0x8D,0x68,0x2D,0x01,0x00,0x01,0xF0,0x00,0x00
    ]);
    const PPS = new Uint8Array([
        0x00,0x00,0x00,0x01,0x68,0xCE,0x06,0xD2
    ]);

    // 日志
    function log(text) {
        const el = document.getElementById("log");
        const t = new Date().toLocaleTimeString();
        el.innerHTML += `[${t}] ${text}\n`;
        el.scrollTop = el.scrollHeight;
    }

    // 初始化播放器
    function initPlayer() {
        const opt = {
            width: "100%", height: "100%",
            autoplay: true, isLive: true, rePlay: false,
            useH5Prism: true, skinLayout: [], controlBarVisibility: "none"
        };
        player1 = new Aliplayer({...opt, id: "p1", source: SRC1}, () => log("播放器1 拉流成功"));
        player2 = new Aliplayer({...opt, id: "p2", source: SRC2}, () => log("播放器2 拉流成功"));
    }

    // FLV 文件头
    function makeFlvHeader() {
        return new Uint8Array([
            0x46, 0x4C, 0x56, 0x01, 0x05,
            0x00, 0x00, 0x00, 0x09,
            0x00, 0x00, 0x00, 0x00
        ]);
    }

    // 构造 FLV Tag
    function makeFlvTag(type, data, timestamp) {
        const dataLen = data.length;
        const totalLen = 11 + dataLen + 4;
        const tag = new Uint8Array(totalLen);

        tag[0] = type;
        tag[1] = (dataLen >> 16) & 0xFF;
        tag[2] = (dataLen >> 8) & 0xFF;
        tag[3] = dataLen & 0xFF;

        tag[4] = (timestamp >> 16) & 0xFF;
        tag[5] = (timestamp >> 8) & 0xFF;
        tag[6] = timestamp & 0xFF;
        tag[7] = (timestamp >> 24) & 0xFF;

        tag[8] = tag[9] = tag[10] = 0;
        tag.set(data, 11);

        const prevTagSize = 11 + dataLen;
        tag[11 + dataLen] = (prevTagSize >> 24) & 0xFF;
        tag[12 + dataLen] = (prevTagSize >> 16) & 0xFF;
        tag[13 + dataLen] = (prevTagSize >> 8) & 0xFF;
        tag[14 + dataLen] = prevTagSize & 0xFF;

        return tag;
    }

    // AMF0 工具
    function writeAMFString(str) {
        const buf = [];
        const len = str.length;
        buf.push((len >> 8) & 0xFF, len & 0xFF);
        for (let i = 0; i < len; i++) buf.push(str.charCodeAt(i));
        return buf;
    }

    // 标准 AMF0 onMetaData
    function makeAMFOnMetaData() {
        const buf = [];
        buf.push(0x02);
        buf.push(...writeAMFString("onMetaData"));
        buf.push(0x08);
        buf.push(0x00, 0x00, 0x00, 0x0A);

        const dv = new DataView(new ArrayBuffer(8));
        const addNum = (key, val) => {
            buf.push(...writeAMFString(key));
            buf.push(0x00);
            dv.setFloat64(0, val, false);
            buf.push(...new Uint8Array(dv.buffer));
        };
        const addBool = (key, val) => {
            buf.push(...writeAMFString(key));
            buf.push(0x01, val ? 0x01 : 0x00);
        };

        addNum("duration", 0);
        addNum("width", W);
        addNum("height", H);
        addNum("videocodecid", 7);
        addNum("audiocodecid", 10);
        addNum("audiosamplerate", 44100);
        addNum("audiosamplesize", 16);
        addBool("stereo", true);
        addNum("filesize", 0);
        addNum("framerate", FPS);

        buf.push(0x00, 0x00, 0x09);
        return new Uint8Array(buf);
    }

    // 构造 FLV H264 Video Tag 数据
    function makeH264VideoData(nalu, isKeyFrame = false, avcType = 0x01) {
        const header = new Uint8Array(5);
        header[0] = isKeyFrame ? 0x17 : 0x27;
        header[1] = avcType;
        header[2] = header[3] = header[4] = 0x00;

        const out = new Uint8Array(header.length + nalu.length);
        out.set(header, 0);
        out.set(nalu, header.length);
        return out;
    }

    // 发送 SPS+PPS (AVC sequence header)
    function sendSpsPps() {
        if (spsPpsSent) return;
        spsPpsSent = true;

        // AVC sequence header (avcType=0)
        const avcHeader = new Uint8Array(5);
        avcHeader[0] = 0x17;
        avcHeader[1] = 0x00;
        avcHeader[2] = avcHeader[3] = avcHeader[4] = 0x00;

        const combined = new Uint8Array(avcHeader.length + SPS.length + PPS.length);
        combined.set(avcHeader, 0);
        combined.set(SPS, avcHeader.length);
        combined.set(PPS, avcHeader.length + SPS.length);

        const tag = makeFlvTag(0x09, combined, 0);
        ws.send(tag);
        log("已发送 H264 SPS/PPS 序列头");
    }

    // 生成一帧H264 IDR帧(带起始码)
    function makeH264Frame(isKey = false) {
        // 模拟IDR帧 NALU，带标准 00 00 00 01
        const nalu = new Uint8Array([
            0x00,0x00,0x00,0x01,
            isKey ? 0x65 : 0x41,
            0x88,0x80,0x00,0x26,0x2A,0x6E,0x48,0x93,0x2B,0xFF,0xC0
        ]);
        return makeH264VideoData(nalu, isKey, 0x01);
    }

    // 循环推帧
    function pushFrame() {
        if (!isPushing || !ws || ws.readyState !== WebSocket.OPEN) return;

        // 绘制左右分屏
        const v1 = document.querySelector("#p1 video");
        const v2 = document.querySelector("#p2 video");
        if (v1 && v2) {
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(v1, 0, 0, W / 2, H);
            ctx.drawImage(v2, W / 2, 0, W / 2, H);
        }

        const isKey = (ts % 2000 === 0);
        const frameData = makeH264Frame(isKey);
        const videoTag = makeFlvTag(0x09, frameData, ts);
        ws.send(videoTag);

        ts += FRAME_INTERVAL;
    }

    // 开始推流
    function startPush() {
        if (isPushing) return;
        log("正在连接推流服务...");
        ws = new WebSocket(WS_URL);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
            log("WebSocket 连接成功");
            isPushing = true;
            spsPpsSent = false;
            ts = 0;

            // 1. FLV 头
            ws.send(makeFlvHeader());
            log("已发送 FLV 文件头");

            // 2. 元数据
            const metaBin = makeAMFOnMetaData();
            const metaTag = makeFlvTag(0x12, metaBin, 0);
            ws.send(metaTag);
            log("已发送 onMetaData");

            // 3. H264 SPS/PPS 关键(修复 no start code)
            sendSpsPps();

            // 4. 定时推帧
            pushTimer = setInterval(pushFrame, FRAME_INTERVAL);
            log("帧推送已启动");
        };

        ws.onclose = () => {
            log("WebSocket 连接关闭");
            stopPush();
        };
        ws.onerror = () => {
            log("WebSocket 发生错误");
            stopPush();
        };
    }

    // 停止推流
    function stopPush() {
        isPushing = false;
        if (pushTimer) {
            clearInterval(pushTimer);
            pushTimer = null;
        }
        if (ws) {
            ws.close();
            ws = null;
        }
        log("推流已停止");
    }

    // 拖拽
    function initDrag() {
        document.querySelectorAll(".drag-header").forEach(header => {
            const box = header.parentElement;
            let drag = false, sx, sy, ox, oy;
            header.addEventListener("mousedown", e => {
                drag = true;
                sx = e.clientX; sy = e.clientY;
                ox = box.offsetLeft; oy = box.offsetTop;
                e.preventDefault();
            });
            document.addEventListener("mousemove", e => {
                if (!drag) return;
                box.style.left = ox + e.clientX - sx + "px";
                box.style.top = oy + e.clientY - sy + "px";
            });
            document.addEventListener("mouseup", () => drag = false);
        });
    }

    window.onload = () => {
        initDrag();
        setTimeout(initPlayer, 600);
        document.getElementById("btnStart").onclick = startPush;
        document.getElementById("btnStop").onclick = stopPush;
        log("页面初始化完成");
    };
</script>
</body>
</html>
