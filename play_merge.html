<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>fMP4直播录播播放器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        video {
            width: 100%;
            background: #000;
            border-radius: 12px;
            max-height: 600px;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn:hover { background: #45a049; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-danger { background: #f44336; }
        .btn-danger:hover { background: #da190b; }
        .btn-secondary { background: #607D8B; }
        .btn-secondary:hover { background: #546E7A; }
        #status {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .status-info { color: #4CAF50; }
        .status-warning { color: #ff9800; }
        .status-error { color: #f44336; }
        .status-debug { color: #2196F3; }
        .mode-selector {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        .mode-btn:hover:not(.active) {
            background: rgba(255,255,255,0.15);
        }
        .info-panel {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 14px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        .info-panel ul {
            margin: 0;
            padding-left: 20px;
        }
        .info-panel li {
            margin-bottom: 5px;
        }
        .buffer-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
        .buffer-good { background: #4CAF50; color: white; }
        .buffer-low { background: #ff9800; color: white; }
        .buffer-critical { background: #f44336; color: white; }
        .live-badge {
            display: inline-block;
            background: #f44336;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .path-display {
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .cache-note {
            background: #ff980020;
            border-left: 3px solid #ff9800;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<h1>fMP4 直播播放器 <span class="live-badge">LIVE</span></h1>

<div class="path-display" id="pathDisplay">
    📁 动态加载中...
</div>

<div class="mode-selector">
    <button class="mode-btn active" data-mode="separate">分开音视频模式</button>
    <button class="mode-btn" data-mode="merged">合并模式</button>
</div>

<div class="info-panel">
    <h3>当前模式: <span id="modeInfo">分开音视频模式</span></h3>
    <div style="margin-top: 10px;">
        缓冲状态: <span id="bufferStatus" class="buffer-indicator buffer-good">充足</span>
        已加载切片: <span id="loadedSegments">0</span>
        队列长度: <span id="queueLength">0</span>
    </div>
    <ul>
        <li><strong>直播模式</strong>: 持续轮询服务器，有新切片就立即加载</li>
        <li><strong>无缓存策略</strong>: 所有请求均添加动态参数 + no-cache头，确保获取最新切片</li>
        <li><strong>队列管理</strong>: 单一追加队列，避免重复追加</li>
        <li><strong>智能结束</strong>: 连续多次404才认为流结束</li>
    </ul>
    <div class="cache-note">
        ⚡ 缓存破坏已启用：每次请求自动添加时间戳+随机数，强制从服务器拉取最新切片，彻底解决直播缓存问题。
    </div>
</div>

<video id="video" controls autoplay muted playsinline></video>

<div class="controls">
    <button id="playBtn" class="btn">播放</button>
    <button id="pauseBtn" class="btn" disabled>暂停</button>
    <button id="resetBtn" class="btn btn-danger">重置</button>
    <button id="debugBtn" class="btn btn-secondary">显示调试信息</button>
</div>

<div id="status">准备播放...</div>

<script>
    // ============ 核心方法：动态获取当前基础地址 ============
    function getDynamicBaseUrl() {
        const protocol = window.location.protocol;
        const host = window.location.host;
        return `${protocol}//${host}`;
    }

    // ============ 构建完整的切片文件基础路径 ============
    function getBasePath(mode) {
        const baseUrl = getDynamicBaseUrl();
        const modeDir = mode === 'separate' ? 'output_separate' : 'output_merge';
        const fullPath = `${baseUrl}/mp4/a/b/${modeDir}/`;
        console.log(`[fMP4播放器] 动态生成路径: ${fullPath}`);
        return fullPath;
    }

    // ============ 🚀 缓存破坏核心函数 ============
    // 为URL添加动态参数，确保每次请求都是全新的，避免浏览器/代理缓存
    function bustCache(url) {
        // 检测是否已有查询参数
        const separator = url.includes('?') ? '&' : '?';
        // 使用时间戳 + 强随机数，保证每次请求URL唯一性
        const timestamp = Date.now();
        const random = Math.random().toString(36).substring(2, 12);
        return `${url}${separator}_nc=${timestamp}_${random}`;
    }

    // 封装一个强制无缓存的fetch方法
    // 作用：为每个请求添加缓存破坏参数 + 强制设置 no-cache 请求头
    async function noCacheFetch(url, options = {}) {
        const bustedUrl = bustCache(url);
        const fetchOptions = {
            ...options,
            cache: 'no-store',           // 禁止使用任何缓存
            headers: {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0',
                ...(options.headers || {})
            }
        };
        if (isDebugMode) {
            console.log(`[无缓存请求] ${bustedUrl}`);
        }
        return fetch(bustedUrl, fetchOptions);
    }

    // ============ 播放器配置 ============
    const CONFIG = {
        POLL_INTERVAL: 500,
        MAX_CONSECUTIVE_404: 15,
        START_SEGMENT_IDX: 1,
        DEFAULT_MODE: 'separate',
        DEFAULT_VIDEO_CODEC: 'avc1.42E01E',
        DEFAULT_AUDIO_CODEC: 'mp4a.40.2',
        DEBUG: false,
    };

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    const modeInfo = document.getElementById('modeInfo');
    const bufferStatus = document.getElementById('bufferStatus');
    const loadedSegments = document.getElementById('loadedSegments');
    const queueLengthDisplay = document.getElementById('queueLength');
    const pathDisplay = document.getElementById('pathDisplay');

    let currentMode = CONFIG.DEFAULT_MODE;
    let BASE_URL = '';  // 动态赋值
    let mediaSource;
    let audioSourceBuffer, videoSourceBuffer;
    let streamEnded = false;
    let segmentIdx = CONFIG.START_SEGMENT_IDX;
    let isDebugMode = CONFIG.DEBUG;
    let metaInfo = null;
    let isPolling = false;
    let totalLoadedSegments = 0;
    let consecutive404Count = 0;

    // 全局的追加函数
    let appendAudioFunc = null;
    let appendVideoFunc = null;
    let appendMergedFunc = null;

    function updatePathDisplay(mode) {
        const currentPath = getBasePath(mode);
        pathDisplay.innerHTML = `📁 动态加载路径: <span style="color: #4CAF50;">${currentPath}</span><br>`;
        pathDisplay.innerHTML += `<span style="font-size: 11px; color: #888;">💡 自动获取当前页面地址: ${getDynamicBaseUrl()}</span><br>`;
        pathDisplay.innerHTML += `<span style="font-size: 11px; color: #ffaa66;">🚫 缓存破坏已启用: 每个请求独立动态参数，绝对无缓存</span>`;
    }

    function buildBaseUrl(mode) {
        return getBasePath(mode);
    }

    function addStatus(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const typeClass = `status-${type}`;
        statusDiv.innerHTML += `<div class="${typeClass}">[${timestamp}] ${message}</div>`;
        statusDiv.scrollTop = statusDiv.scrollHeight;
        console.log(`[fMP4] ${message}`);
    }

    function updateBufferStatus() {
        if (!video.buffered || video.buffered.length === 0) {
            bufferStatus.textContent = '无数据';
            bufferStatus.className = 'buffer-indicator buffer-critical';
            return;
        }

        const bufferedEnd = video.buffered.end(video.buffered.length - 1);
        const currentTime = video.currentTime;
        const bufferAhead = bufferedEnd - currentTime;

        if (bufferAhead > 5) {
            bufferStatus.textContent = `充足 (${bufferAhead.toFixed(1)}s)`;
            bufferStatus.className = 'buffer-indicator buffer-good';
        } else if (bufferAhead > 2) {
            bufferStatus.textContent = `较低 (${bufferAhead.toFixed(1)}s)`;
            bufferStatus.className = 'buffer-indicator buffer-low';
        } else {
            bufferStatus.textContent = `不足 (${bufferAhead.toFixed(1)}s)`;
            bufferStatus.className = 'buffer-indicator buffer-critical';
        }
    }

    // 创建追加队列
    function createAppendQueue(sourceBuffer) {
        let queue = [];
        let processing = false;

        function processQueue() {
            if (processing || queue.length === 0) {
                if (sourceBuffer === audioSourceBuffer || sourceBuffer === videoSourceBuffer) {
                    updateQueueLength();
                }
                return;
            }
            processing = true;

            const { data, description, resolve, reject } = queue.shift();

            const onUpdateEnd = () => {
                sourceBuffer.removeEventListener('updateend', onUpdateEnd);
                sourceBuffer.removeEventListener('error', onError);
                if (isDebugMode) {
                    addStatus(`${description} 追加成功 (${data.byteLength} bytes)`, 'debug');
                }
                processing = false;
                resolve();
                setTimeout(() => {
                    processQueue();
                    updateQueueLength();
                }, 0);
            };

            const onError = (e) => {
                sourceBuffer.removeEventListener('updateend', onUpdateEnd);
                sourceBuffer.removeEventListener('error', onError);
                addStatus(`SourceBuffer 错误: ${e.type || e}`, 'error');
                processing = false;
                reject(new Error('SourceBuffer error'));
                setTimeout(() => {
                    processQueue();
                    updateQueueLength();
                }, 0);
            };

            sourceBuffer.addEventListener('updateend', onUpdateEnd, { once: true });
            sourceBuffer.addEventListener('error', onError, { once: true });

            try {
                if (sourceBuffer.updating) {
                    queue.unshift({ data, description, resolve, reject });
                    processing = false;
                    setTimeout(() => processQueue(), 50);
                    return;
                }
                sourceBuffer.appendBuffer(data);
                if (isDebugMode) {
                    addStatus(`正在追加 ${description}...`, 'debug');
                }
            } catch (e) {
                addStatus(`appendBuffer 异常: ${e.message}`, 'error');
                processing = false;
                reject(e);
                setTimeout(() => processQueue(), 50);
            }
        }

        function updateQueueLength() {
            if (queueLengthDisplay) {
                queueLengthDisplay.textContent = queue.length;
            }
        }

        return {
            append: (data, description) => {
                return new Promise((resolve, reject) => {
                    queue.push({ data, description, resolve, reject });
                    processQueue();
                });
            },
            getQueueLength: () => queue.length
        };
    }

    // 获取编解码信息（强制无缓存请求）
    async function getCodecs() {
        try {
            // 使用 noCacheFetch 代替原始 fetch，彻底避免 meta.json 被缓存
            const res = await noCacheFetch(BASE_URL + 'meta.json');
            if (!res.ok) {
                addStatus(`meta.json 加载失败 (HTTP ${res.status})，使用默认编解码器`, 'warning');
                return {
                    videoCodec: CONFIG.DEFAULT_VIDEO_CODEC,
                    audioCodec: CONFIG.DEFAULT_AUDIO_CODEC
                };
            }
            metaInfo = await res.json();
            addStatus(`编解码器: 视频=${metaInfo.videoCodec}, 音频=${metaInfo.audioCodec} (已绕过缓存)`, 'debug');
            return {
                videoCodec: metaInfo.videoCodec || CONFIG.DEFAULT_VIDEO_CODEC,
                audioCodec: metaInfo.audioCodec || CONFIG.DEFAULT_AUDIO_CODEC
            };
        } catch (e) {
            addStatus(`获取编解码器失败: ${e.message}`, 'warning');
            return {
                videoCodec: CONFIG.DEFAULT_VIDEO_CODEC,
                audioCodec: CONFIG.DEFAULT_AUDIO_CODEC
            };
        }
    }

    // 分开模式的初始化加载（无缓存）
    async function loadInitSeparate(codecs) {
        addStatus('开始加载初始化片段 (无缓存模式)...', 'info');

        try {
            // 使用 noCacheFetch 确保 init 文件都是最新的
            const [audioRes, videoRes] = await Promise.all([
                noCacheFetch(BASE_URL + 'audio_init.mp4'),
                noCacheFetch(BASE_URL + 'video_init.mp4')
            ]);

            if (!audioRes.ok) throw new Error(`音频初始化文件加载失败: HTTP ${audioRes.status}`);
            if (!videoRes.ok) throw new Error(`视频初始化文件加载失败: HTTP ${videoRes.status}`);

            const [audioInit, videoInit] = await Promise.all([
                audioRes.arrayBuffer(),
                videoRes.arrayBuffer()
            ]);

            addStatus(`音频初始化: ${audioInit.byteLength} bytes, 视频初始化: ${videoInit.byteLength} bytes (已绕过缓存)`, 'debug');

            audioSourceBuffer = mediaSource.addSourceBuffer(`audio/mp4; codecs="${codecs.audioCodec.toLowerCase()}"`);
            audioSourceBuffer.mode = 'sequence';

            videoSourceBuffer = mediaSource.addSourceBuffer(`video/mp4; codecs="${codecs.videoCodec.toLowerCase()}"`);
            videoSourceBuffer.mode = 'sequence';

            addStatus('SourceBuffer 创建成功', 'info');

            const audioQueue = createAppendQueue(audioSourceBuffer);
            const videoQueue = createAppendQueue(videoSourceBuffer);
            appendAudioFunc = audioQueue.append;
            appendVideoFunc = videoQueue.append;

            await Promise.all([
                appendAudioFunc(audioInit, '音频初始化'),
                appendVideoFunc(videoInit, '视频初始化')
            ]);

            addStatus('初始化完成', 'info');

        } catch (e) {
            addStatus(`加载初始化片段失败: ${e.message}`, 'error');
            throw e;
        }
    }

    // 合并模式的初始化加载（无缓存）
    async function loadInitMerged(codecs) {
        addStatus('开始加载初始化片段 (合并模式, 无缓存)...', 'info');

        try {
            const res = await noCacheFetch(BASE_URL + 'init.mp4');
            if (!res.ok) throw new Error(`初始化文件加载失败: HTTP ${res.status}`);

            const initData = await res.arrayBuffer();
            addStatus(`初始化数据: ${initData.byteLength} bytes (已绕过缓存)`, 'debug');

            const codecStr = `${codecs.videoCodec.toLowerCase()},${codecs.audioCodec.toLowerCase()}`;
            audioSourceBuffer = mediaSource.addSourceBuffer(`video/mp4; codecs="${codecStr}"`);
            audioSourceBuffer.mode = 'sequence';
            videoSourceBuffer = null;

            addStatus(`SourceBuffer 创建成功: ${codecStr}`, 'info');

            const mergedQueue = createAppendQueue(audioSourceBuffer);
            appendMergedFunc = mergedQueue.append;

            await appendMergedFunc(initData, '初始化数据');

            addStatus('初始化完成', 'info');

        } catch (e) {
            addStatus(`加载初始化片段失败: ${e.message}`, 'error');
            throw e;
        }
    }

    // 分开模式加载单个切片（绝对无缓存）
    async function loadSingleSegmentSeparate(segIdx) {
        try {
            // 每个切片独立使用无缓存请求，强制从服务器拉取最新数据
            const [audioResp, videoResp] = await Promise.all([
                noCacheFetch(`${BASE_URL}audio_${segIdx}.m4s`),
                noCacheFetch(`${BASE_URL}video_${segIdx}.m4s`)
            ]);

            // 两个都是404说明切片还未生成
            if (audioResp.status === 404 && videoResp.status === 404) {
                return { success: false, notFound: true };
            }

            const [audioData, videoData] = await Promise.all([
                audioResp.status === 200 ? audioResp.arrayBuffer() : null,
                videoResp.status === 200 ? videoResp.arrayBuffer() : null
            ]);

            const appendPromises = [];
            if (audioData) {
                appendPromises.push(appendAudioFunc(audioData, `音频片段 ${segIdx}`));
            }
            if (videoData) {
                appendPromises.push(appendVideoFunc(videoData, `视频片段 ${segIdx}`));
            }

            await Promise.all(appendPromises);

            return { success: true, notFound: false };

        } catch (e) {
            addStatus(`加载片段 ${segIdx} 失败: ${e.message}`, 'error');
            return { success: false, notFound: false };
        }
    }

    // 合并模式加载单个切片（绝对无缓存）
    async function loadSingleSegmentMerged(segIdx) {
        try {
            const resp = await noCacheFetch(`${BASE_URL}segment_${segIdx}.m4s`);

            if (resp.status === 404) {
                return { success: false, notFound: true };
            }

            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            const data = await resp.arrayBuffer();
            await appendMergedFunc(data, `片段 ${segIdx}`);

            return { success: true, notFound: false };

        } catch (e) {
            addStatus(`加载片段 ${segIdx} 失败: ${e.message}`, 'error');
            return { success: false, notFound: false };
        }
    }

    // 轮询切片（持续拉取最新数据）
    async function pollSegments() {
        if (isPolling || streamEnded) return;

        isPolling = true;
        addStatus('开始轮询加载切片 (每次请求均使用动态缓存破坏参数，保证实时性)...', 'info');

        while (!streamEnded && mediaSource.readyState === 'open') {
            let result;
            if (currentMode === 'separate') {
                result = await loadSingleSegmentSeparate(segmentIdx);
            } else {
                result = await loadSingleSegmentMerged(segmentIdx);
            }

            if (result.notFound) {
                consecutive404Count++;
                if (consecutive404Count >= CONFIG.MAX_CONSECUTIVE_404) {
                    addStatus(`连续 ${CONFIG.MAX_CONSECUTIVE_404} 次未找到切片，直播可能已结束`, 'warning');
                    streamEnded = true;
                    break;
                }
                if (isDebugMode) {
                    addStatus(`切片 ${segmentIdx} 尚未生成 (${consecutive404Count}/${CONFIG.MAX_CONSECUTIVE_404}) - 请求已绕过缓存`, 'debug');
                }
            } else if (result.success) {
                consecutive404Count = 0;
                totalLoadedSegments++;
                loadedSegments.textContent = totalLoadedSegments;
                segmentIdx++;
                if (totalLoadedSegments % 10 === 0) {
                    addStatus(`已加载 ${totalLoadedSegments} 个切片 (无缓存实时拉取)`, 'info');
                }
            }

            // 更新队列长度显示
            if (appendAudioFunc || appendVideoFunc || appendMergedFunc) {
                // 只是UI占位，实际队列状态已在队列内部更新
            }
            queueLengthDisplay.textContent = (appendAudioFunc || appendVideoFunc || appendMergedFunc) ? '处理中' : '0';

            await sleep(CONFIG.POLL_INTERVAL);
        }

        isPolling = false;

        if (streamEnded && mediaSource.readyState === 'open') {
            try {
                mediaSource.endOfStream();
                addStatus(`直播结束，共加载 ${totalLoadedSegments} 个切片`, 'info');
            } catch (e) {
                addStatus(`endOfStream 失败: ${e.message}`, 'warning');
            }
        }
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 重置并初始化 MediaSource
    async function initMediaSource() {
        streamEnded = true; // 停止旧轮询

        if (mediaSource) {
            try {
                if (mediaSource.readyState === 'open') {
                    mediaSource.endOfStream();
                }
            } catch (e) {}
            URL.revokeObjectURL(video.src);
        }

        streamEnded = false;
        segmentIdx = CONFIG.START_SEGMENT_IDX;
        consecutive404Count = 0;
        totalLoadedSegments = 0;
        isPolling = false;
        audioSourceBuffer = null;
        videoSourceBuffer = null;
        appendAudioFunc = null;
        appendVideoFunc = null;
        appendMergedFunc = null;

        // 动态获取 BASE_URL
        BASE_URL = buildBaseUrl(currentMode);
        updatePathDisplay(currentMode);

        document.getElementById('playBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = true;
        loadedSegments.textContent = '0';
        queueLengthDisplay.textContent = '0';

        statusDiv.innerHTML = `<div class="status-info">[初始化] 正在准备播放器... (模式: ${currentMode === 'separate' ? '分开音视频' : '合并'} | 无缓存模式已启用)</div>`;
        addStatus(`使用动态地址: ${BASE_URL}`, 'info');
        addStatus(`✅ 已启用全链路缓存破坏: 每个请求独立时间戳+随机数 + Cache-Control禁止缓存`, 'info');

        try {
            mediaSource = new MediaSource();
            video.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener('sourceopen', async () => {
                try {
                    addStatus('MediaSource 已打开', 'debug');

                    const codecs = await getCodecs();

                    if (currentMode === 'separate') {
                        await loadInitSeparate(codecs);
                    } else {
                        await loadInitMerged(codecs);
                    }

                    document.getElementById('playBtn').disabled = false;
                    document.getElementById('pauseBtn').disabled = false;

                    // 启动轮询
                    pollSegments();

                } catch (e) {
                    addStatus(`初始化失败: ${e.message}`, 'error');
                    console.error('MediaSource 初始化错误:', e);
                }
            });

            mediaSource.addEventListener('sourceclose', () => {
                addStatus('MediaSource 已关闭', 'debug');
            });

            mediaSource.addEventListener('error', (e) => {
                addStatus(`MediaSource 错误: ${e}`, 'error');
            });

        } catch (e) {
            addStatus(`创建 MediaSource 失败: ${e.message}`, 'error');
        }
    }

    // 事件绑定
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentMode = btn.dataset.mode;
            modeInfo.textContent = currentMode === 'separate' ? '分开音视频模式' : '合并模式';
            addStatus(`切换到${currentMode === 'separate' ? '分开音视频' : '合并'}模式，新路径: ${getBasePath(currentMode)}`, 'info');
            addStatus(`缓存破坏策略继续生效，所有后续请求均实时拉取`, 'info');

            initMediaSource();
        });
    });

    document.getElementById('playBtn').addEventListener('click', () => {
        video.play();
        document.getElementById('playBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = false;
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
        video.pause();
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('playBtn').disabled = false;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        initMediaSource();
    });

    document.getElementById('debugBtn').addEventListener('click', () => {
        isDebugMode = !isDebugMode;
        if (isDebugMode) {
            statusDiv.style.display = 'block';
            document.getElementById('debugBtn').textContent = '隐藏调试信息';
            addStatus('调试模式已开启，将显示详细请求信息', 'debug');
        } else {
            statusDiv.style.display = 'none';
            document.getElementById('debugBtn').textContent = '显示调试信息';
        }
    });

    video.addEventListener('error', (e) => {
        addStatus(`视频元素错误: ${video.error?.message || e}`, 'error');
    });

    video.addEventListener('playing', () => {
        addStatus('视频开始播放', 'info');
    });

    video.addEventListener('pause', () => {
        addStatus('视频已暂停', 'info');
    });

    video.addEventListener('ended', () => {
        addStatus('视频播放结束', 'info');
    });

    setInterval(updateBufferStatus, 1000);

    // 启动播放器
    initMediaSource();
</script>
</body>
</html>
